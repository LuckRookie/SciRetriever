<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; frame-src 'self' file:; base-uri 'none'"
    />
    <title>SciRetriever · Web 设计对比</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f5f0;
        --ink: #263b33;
        --line: #d9dfd3;
        --green: #254f39;
        --muted: #637167;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font:
          13px/1.5 "Avenir Next",
          "Segoe UI",
          "Noto Sans CJK SC",
          "Microsoft YaHei",
          sans-serif;
        color: var(--ink);
        background: var(--bg);
        height: 100dvh;
        display: flex;
        flex-direction: column;
      }
      header {
        display: flex;
        gap: 20px;
        align-items: center;
        justify-content: space-between;
        padding: 12px 20px;
        border-bottom: 1px solid var(--line);
        flex-wrap: wrap;
      }
      h1 {
        font-size: 15px;
        margin: 0;
        font-weight: 650;
      }
      small {
        display: block;
        color: var(--muted);
        font-size: 11px;
        margin-top: 2px;
      }
      nav {
        display: flex;
        gap: 4px;
        padding: 3px;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: #e9ede3;
      }
      button {
        border: 0;
        background: transparent;
        color: var(--muted);
        font: inherit;
        padding: 8px 16px;
        border-radius: 6px;
        cursor: pointer;
      }
      button[aria-pressed="true"] {
        color: white;
        background: var(--green);
      }
      button:focus-visible,
      a:focus-visible {
        outline: 3px solid #648465;
        outline-offset: 3px;
      }
      a {
        color: var(--green);
        font-size: 12px;
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      .links {
        display: flex;
        gap: 17px;
        align-items: center;
      }
      .meta {
        padding: 9px 20px;
        border-bottom: 1px solid var(--line);
        font-size: 12px;
        color: var(--muted);
        display: flex;
        gap: 10px;
        justify-content: space-between;
      }
      .meta strong {
        color: var(--ink);
        font-weight: 600;
      }
      .frames {
        position: relative;
        flex: 1;
        min-height: 0;
        background: white;
      }
      iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
      }
      [hidden] {
        display: none !important;
      }
      @media (max-width: 680px) {
        header {
          gap: 10px;
          padding: 10px 12px;
        }
        h1 {
          font-size: 13px;
        }
        .links {
          gap: 10px;
        }
        nav {
          order: 3;
          width: 100%;
          justify-content: stretch;
        }
        nav button {
          flex: 1;
          padding: 7px;
        }
        .meta {
          padding: 8px 12px;
          font-size: 11px;
        }
        .meta .hint {
          display: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          scroll-behavior: auto;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>SciRetriever · 两种工作台方案</h1>
        <small>设计评审 · 合成数据 · 未连接真实任务</small>
      </div>
      <nav aria-label="选择设计版本">
        <button type="button" data-version="opus" aria-pressed="true">
          B · Opus 对比版</button
        ><button type="button" data-version="codex" aria-pressed="false">
          A · 原版 v0
        </button>
      </nav>
      <div class="links">
        <a
          id="standalone"
          href="opus-variant.html"
          target="_blank"
          rel="noopener"
          >独立打开 ↗</a
        ><a href="comparison.md">评审结论</a
        ><a href="../2026-10-08-agent-workbench.md">提案</a>
      </div>
    </header>
    <div class="meta">
      <span id="version-note"
        ><strong>Opus 对比版</strong> ·
        保留四个入口，重新组织内容与视觉层级。</span
      ><span class="hint">切换保留各自页面状态 · 独立打开可评审完整首屏</span>
    </div>
    <div class="frames">
      <iframe
        id="frame-opus"
        src="opus-variant.html"
        title="Opus 设计对比版本"
      ></iframe
      ><iframe
        id="frame-codex"
        data-src="prototype.html"
        title="Codex 原版 v0"
        hidden
      ></iframe>
    </div>
    <script>
      const versions = {
        opus: {
          file: "opus-variant.html",
          label: "Opus 对比版",
          description: "保留四个入口，重新组织内容与视觉层级。",
        },
        codex: {
          file: "prototype.html",
          label: "原版 v0",
          description: "任务总览与独立观看页；右下角可切换三种布局。",
        },
      };
      for (const button of document.querySelectorAll("[data-version]"))
        button.addEventListener("click", () => {
          const key = button.dataset.version;
          const version = versions[key];
          for (const frame of document.querySelectorAll("iframe")) {
            frame.hidden = frame.id !== "frame-" + key;
            if (!frame.hidden && frame.dataset.src) {
              frame.src = frame.dataset.src;
              delete frame.dataset.src;
            }
          }
          for (const b of document.querySelectorAll("[data-version]"))
            b.setAttribute("aria-pressed", String(b === button));
          document.getElementById("standalone").href = version.file;
          document
            .getElementById("version-note")
            .replaceChildren(
              Object.assign(document.createElement("strong"), {
                textContent: version.label,
              }),
              document.createTextNode(" · " + version.description),
            );
        });
    </script>
  </body>
</html>
