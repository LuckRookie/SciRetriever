<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>SciRetriever · 蓝白任务工作台</title>
    <style>
      :root {
        --bg: #f4f7fc;
        --surface: #fff;
        --ink: #18243a;
        --muted: #64748b;
        --line: #e2e8f2;
        --blue: #2563eb;
        --blue-hover: #1d4ed8;
        --blue-soft: #edf4ff;
        --blue-line: #c8dcff;
        --amber: #9a5c0a;
        --amber-soft: #fff6e6;
        --green: #187650;
        --green-soft: #eaf7f0;
        --red: #bc3f46;
        --red-soft: #fff0f1;
        --shadow: 0 16px 60px #18243a1c;
        --radius: 10px;
        --row-pad: 19px;
        --rail: 216px;
        --font: "Segoe UI", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 14px/1.6 var(--font);
        -webkit-font-smoothing: antialiased;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      button,
      a,
      input,
      select,
      textarea {
        touch-action: manipulation;
      }
      button,
      a {
        transition:
          background 0.15s,
          color 0.15s,
          border-color 0.15s;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.5;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible,
      summary:focus-visible {
        outline: 3px solid #85b0ff;
        outline-offset: 3px;
      }
      h1,
      h2,
      h3,
      h4,
      p {
        margin: 0;
        text-wrap: pretty;
      }
      h1 {
        font-size: 27px;
        line-height: 1.35;
        letter-spacing: -0.6px;
        font-weight: 650;
      }
      h2 {
        font-size: 16px;
        font-weight: 650;
      }
      h3 {
        font-size: 14px;
        font-weight: 600;
      }
      [hidden] {
        display: none !important;
      }
      .icon {
        display: inline-block;
        width: 18px;
        height: 18px;
        flex: none;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.65;
        stroke-linecap: round;
        stroke-linejoin: round;
        vertical-align: middle;
      }
      .icon.sm {
        width: 15px;
        height: 15px;
      }
      .muted {
        color: var(--muted);
      }
      .small {
        font-size: 12px;
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
        font-size: 12px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .between {
        justify-content: space-between;
      }
      .wrap {
        flex-wrap: wrap;
      }
      .grow {
        flex: 1;
        min-width: 0;
      }
      .stack {
        display: grid;
        gap: 20px;
      }
      .blue {
        color: var(--blue);
      }
      .nowrap {
        white-space: nowrap;
      }
      .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
        display: inline-block;
        flex: none;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border-radius: 5px;
        padding: 3px 8px;
        font-size: 12px;
        font-weight: 500;
        line-height: 1.5;
        white-space: nowrap;
        background: #f0f3f8;
        color: var(--muted);
      }
      .pill.running {
        background: var(--blue-soft);
        color: var(--blue);
      }
      .pill.attention {
        background: var(--amber-soft);
        color: var(--amber);
      }
      .pill.completed {
        background: var(--green-soft);
        color: var(--green);
      }
      .pill.partial,
      .pill.cancelled {
        background: var(--red-soft);
        color: var(--red);
      }
      .btn {
        border: 1px solid var(--line);
        background: var(--surface);
        border-radius: 6px;
        min-height: 36px;
        padding: 7px 12px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        font-size: 13px;
        font-weight: 500;
        white-space: nowrap;
      }
      .btn:hover {
        background: #f6f8fc;
        border-color: #cad5e7;
      }
      .btn.primary {
        background: var(--blue);
        border-color: var(--blue);
        color: #fff;
      }
      .btn.primary:hover {
        background: var(--blue-hover);
        border-color: var(--blue-hover);
      }
      .btn.ghost {
        border-color: transparent;
        background: transparent;
        color: var(--muted);
      }
      .btn.ghost:hover {
        background: #edf1f7;
        color: var(--ink);
      }
      .btn.danger {
        color: var(--red);
      }
      .btn.icon-only {
        padding: 7px;
        width: 34px;
        min-height: 34px;
      }
      .text-link {
        color: var(--blue);
        font-size: 13px;
        font-weight: 500;
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }
      .text-link:hover {
        text-decoration: underline;
      }
      .empty {
        padding: 55px 20px;
        text-align: center;
        color: var(--muted);
      }
      .empty h3 {
        color: var(--ink);
        font-size: 16px;
        margin: 12px 0 7px;
      }
      .empty .btn {
        margin-top: 17px;
      }
      .skip {
        position: absolute;
        left: 12px;
        top: -60px;
        z-index: 100;
        background: white;
        padding: 10px;
      }
      .skip:focus {
        top: 12px;
      }
      .shell {
        display: grid;
        grid-template-columns: var(--rail) minmax(0, 1fr);
        min-height: 100vh;
      }
      .rail {
        position: sticky;
        top: 0;
        height: 100vh;
        background: var(--surface);
        border-right: 1px solid var(--line);
        padding: 27px 16px 18px;
        display: flex;
        flex-direction: column;
        z-index: 20;
      }
      .brand {
        display: flex;
        align-items: center;
        font-size: 20px;
        font-weight: 750;
        letter-spacing: -1px;
        padding: 0 12px;
      }
      .brand span {
        color: var(--blue);
      }
      .brand-mark {
        width: 7px;
        height: 7px;
        border-radius: 2px;
        background: var(--blue);
        margin-left: 3px;
        align-self: flex-start;
        margin-top: 9px;
      }
      .workspace-label {
        font-size: 12px;
        color: var(--muted);
        padding: 29px 13px 10px;
      }
      .nav {
        display: grid;
        gap: 5px;
      }
      .nav a {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 11px 13px;
        border-radius: 6px;
        color: #5a6980;
        font-size: 14px;
        font-weight: 500;
      }
      .nav a:hover {
        background: #f5f7fb;
        color: var(--ink);
      }
      .nav a.active {
        background: var(--blue-soft);
        color: var(--blue);
      }
      .nav-count {
        margin-left: auto;
        background: #dce9ff;
        color: var(--blue);
        min-width: 19px;
        text-align: center;
        padding: 0 5px;
        border-radius: 4px;
        font-size: 11px;
      }
      .rail-bottom {
        margin-top: auto;
      }
      .library-switch {
        display: flex;
        gap: 10px;
        align-items: center;
        border-top: 1px solid var(--line);
        padding: 18px 9px 4px;
      }
      .library-switch strong {
        font-size: 12px;
        font-weight: 600;
      }
      .library-switch small {
        display: block;
        color: var(--muted);
        font-size: 11px;
        margin-top: 2px;
      }
      .database-mark {
        background: #f0f4fa;
        padding: 8px;
        border-radius: 7px;
        color: #607594;
      }
      .main-shell {
        min-width: 0;
      }
      .topbar {
        min-height: 65px;
        background: var(--surface);
        border-bottom: 1px solid var(--line);
        padding: 0 34px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }
      .crumbs {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--muted);
        font-size: 12px;
        min-width: 0;
      }
      .crumbs strong {
        color: var(--ink);
        font-weight: 500;
      }
      .top-actions {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .preview-label {
        font-size: 11px;
        color: var(--muted);
        border: 1px solid var(--line);
        padding: 3px 7px;
        border-radius: 4px;
      }
      .avatar {
        width: 29px;
        height: 29px;
        border-radius: 50%;
        background: #e9f0fc;
        color: #4567a1;
        display: grid;
        place-items: center;
        font-size: 12px;
        font-weight: 600;
      }
      .menu-button {
        display: none;
      }
      .content {
        padding: 34px;
        max-width: 1580px;
        margin: auto;
      }
      .page-heading {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 23px;
      }
      .page-heading p {
        font-size: 13px;
        color: var(--muted);
        margin-top: 8px;
      }
      .page-heading > .btn {
        margin-top: 4px;
      }
      .summary-line {
        display: flex;
        gap: 20px;
        align-items: center;
        flex-wrap: wrap;
        margin-bottom: 25px;
        font-size: 12px;
        color: var(--muted);
      }
      .summary-line b {
        font-size: 14px;
        color: var(--ink);
        font-weight: 600;
        margin-right: 4px;
      }
      .summary-line .sep {
        width: 1px;
        height: 13px;
        background: #d2ddec;
      }
      .overview-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 282px;
        gap: 24px;
        align-items: start;
      }
      .panel {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        overflow: hidden;
      }
      .panel-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 19px 22px;
        border-bottom: 1px solid var(--line);
        gap: 12px;
      }
      .panel-header .muted {
        font-size: 12px;
      }
      .panel-footer {
        padding: 13px 22px;
        border-top: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 12px;
        color: var(--muted);
      }
      .section-label {
        font-size: 12px;
        color: var(--muted);
        font-weight: 500;
      }
      .task-head,
      .task-row {
        display: grid;
        grid-template-columns: minmax(180px, 1.6fr) minmax(
            112px,
            0.8fr
          ) 98px 18px;
        gap: 18px;
        align-items: center;
        padding: 11px 22px;
      }
      .task-head {
        font-size: 11px;
        color: #748198;
        background: #fbfcfe;
        border-bottom: 1px solid var(--line);
      }
      .task-row {
        padding-top: var(--row-pad);
        padding-bottom: var(--row-pad);
        border-bottom: 1px solid #edf1f7;
        transition: background 0.15s;
      }
      .task-row:last-child {
        border-bottom: 0;
      }
      .task-row:hover {
        background: #f8faff;
      }
      .task-title {
        font-weight: 600;
        font-size: 13px;
        line-height: 1.65;
        color: var(--ink);
        display: block;
      }
      .task-sub {
        display: block;
        font-size: 11px;
        color: var(--muted);
        margin-top: 5px;
      }
      .task-phase {
        font-size: 12px;
        color: var(--muted);
        margin-top: 5px;
      }
      .progress-value {
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        color: var(--muted);
        margin-bottom: 7px;
      }
      .progress-value b {
        font-size: 14px;
        color: var(--ink);
        font-weight: 550;
      }
      .track {
        height: 4px;
        border-radius: 10px;
        background: #edf1f7;
        overflow: hidden;
      }
      .track i {
        display: block;
        height: 100%;
        background: var(--blue);
        border-radius: 10px;
      }
      .attention-panel {
        padding: 22px;
      }
      .attention-icon {
        width: 31px;
        height: 31px;
        display: grid;
        place-items: center;
        background: var(--amber-soft);
        color: var(--amber);
        border-radius: 7px;
      }
      .attention-panel h3 {
        margin-top: 19px;
        font-size: 14px;
        line-height: 1.7;
      }
      .attention-panel p {
        margin-top: 7px;
        font-size: 12px;
        color: var(--muted);
        line-height: 1.8;
      }
      .attention-paper {
        font-size: 12px;
        line-height: 1.6;
        color: #4b5c75;
        background: #f7f9fd;
        padding: 11px 12px;
        border-radius: 5px;
        margin: 15px 0;
      }
      .attention-panel .btn {
        width: 100%;
        margin-top: 4px;
      }
      .side-section {
        padding: 4px 2px;
      }
      .side-section h2 {
        font-size: 14px;
        margin-bottom: 16px;
      }
      .recent-item {
        display: flex;
        gap: 11px;
        padding: 13px 0;
        border-bottom: 1px solid var(--line);
      }
      .recent-item:last-child {
        border-bottom: 0;
      }
      .file-mark {
        width: 31px;
        height: 35px;
        border: 1px solid var(--line);
        background: #fff;
        display: grid;
        place-items: center;
        border-radius: 5px;
        color: #7990af;
        flex: none;
      }
      .recent-item strong {
        font-size: 12px;
        font-weight: 550;
        display: block;
      }
      .recent-item small {
        font-size: 11px;
        display: block;
        color: var(--muted);
        margin-top: 3px;
      }
      .output-list {
        padding: 0 22px;
      }
      .output-row {
        display: flex;
        align-items: center;
        gap: 15px;
        padding: 18px 0;
        border-bottom: 1px solid #edf1f7;
      }
      .output-row:last-child {
        border-bottom: 0;
      }
      .output-row strong {
        font-size: 13px;
        font-weight: 550;
      }
      .output-row p {
        font-size: 12px;
        color: var(--muted);
        margin-top: 3px;
      }
      .result-icon {
        width: 36px;
        height: 36px;
        background: var(--blue-soft);
        color: var(--blue);
        border-radius: 8px;
        display: grid;
        place-items: center;
        flex: none;
      }
      .overview-note {
        margin-top: 20px;
        color: var(--muted);
        font-size: 11px;
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 15px;
        flex-wrap: wrap;
        margin-bottom: 20px;
      }
      .segments {
        display: flex;
        align-items: center;
        background: #eaf0f8;
        padding: 3px;
        border-radius: 7px;
        gap: 3px;
        flex-wrap: wrap;
      }
      .segments button {
        background: transparent;
        border: 0;
        padding: 7px 12px;
        border-radius: 5px;
        font-size: 12px;
        color: #63738b;
        min-height: 32px;
      }
      .segments button.active {
        background: #fff;
        color: var(--blue);
        box-shadow: 0 1px 3px #233c6b13;
      }
      .segments small {
        font-size: 11px;
        margin-left: 5px;
      }
      .search-field {
        display: flex;
        align-items: center;
        gap: 8px;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 7px 11px;
        background: #fff;
        color: #8796aa;
        min-width: 220px;
      }
      .search-field input {
        border: 0;
        outline: none;
        min-width: 0;
        width: 100%;
        background: transparent;
        font-size: 12px;
      }
      .search-field:focus-within {
        border-color: var(--blue);
      }
      .table-full .task-head,
      .table-full .task-row {
        grid-template-columns: minmax(220px, 1.7fr) 130px 130px 100px 18px;
      }
      .table-time {
        font-size: 12px;
        color: var(--muted);
      }
      .back-link {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 20px;
      }
      .back-link:hover {
        color: var(--blue);
      }
      .detail-heading {
        margin-bottom: 23px;
      }
      .detail-heading h1 {
        font-size: 25px;
      }
      .detail-meta {
        font-size: 12px;
        color: var(--muted);
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
        margin-top: 10px;
      }
      .detail-actions {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .detail-summary {
        display: flex;
        gap: 30px;
        padding: 18px 23px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 8px;
        margin-bottom: 26px;
        align-items: center;
        flex-wrap: wrap;
      }
      .summary-item {
        display: flex;
        gap: 10px;
        align-items: baseline;
      }
      .summary-item span {
        font-size: 12px;
        color: var(--muted);
      }
      .summary-item strong {
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.4px;
        font-variant-numeric: tabular-nums;
      }
      .detail-summary .summary-progress {
        margin-left: auto;
        min-width: 150px;
      }
      .tabs {
        display: flex;
        gap: 28px;
        border-bottom: 1px solid #dbe4f0;
        margin-bottom: 25px;
      }
      .tabs a {
        padding: 0 2px 12px;
        color: var(--muted);
        font-size: 13px;
        border-bottom: 2px solid transparent;
      }
      .tabs a.active {
        border-color: var(--blue);
        color: var(--blue);
        font-weight: 600;
      }
      .execution-layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 260px;
        gap: 23px;
        align-items: start;
      }
      .stage-line {
        display: flex;
        gap: 0;
        padding: 20px 23px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 8px;
        margin-bottom: 20px;
      }
      .stage {
        position: relative;
        flex: 1;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: var(--muted);
      }
      .stage:not(:last-child):after {
        content: "";
        height: 1px;
        flex: 1;
        background: var(--line);
        margin-right: 12px;
        margin-left: 4px;
      }
      .stage-dot {
        width: 21px;
        height: 21px;
        border: 1px solid var(--line);
        display: grid;
        place-items: center;
        border-radius: 50%;
        font-size: 11px;
        background: #f9fbfe;
      }
      .stage.done .stage-dot {
        background: var(--blue-soft);
        border-color: var(--blue-soft);
        color: var(--blue);
      }
      .stage.current {
        color: var(--blue);
        font-weight: 600;
      }
      .stage.current .stage-dot {
        background: var(--blue);
        border-color: var(--blue);
        color: white;
      }
      .browser-title {
        padding: 17px 20px;
        background: white;
        border-bottom: 1px solid var(--line);
        display: flex;
        gap: 12px;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
      }
      .browser-title strong {
        font-size: 13px;
      }
      .browser-location {
        padding: 9px 16px;
        background: #f3f6fb;
        display: flex;
        align-items: center;
        gap: 8px;
        color: #748198;
        font-size: 11px;
        border-bottom: 1px solid var(--line);
      }
      .browser-location code {
        font-family: inherit;
        overflow-wrap: anywhere;
      }
      .browser-canvas {
        padding: 25px 32px 28px;
        background: #fff;
        min-height: 290px;
      }
      .journal-head {
        display: flex;
        align-items: center;
        gap: 8px;
        color: #6c7c94;
        font-size: 10px;
        letter-spacing: 1.4px;
        padding-bottom: 13px;
        border-bottom: 2px solid #263f64;
      }
      .journal-head b {
        color: #263f64;
        letter-spacing: 0;
        font-family: Georgia, serif;
        font-size: 16px;
      }
      .article-type {
        margin-top: 20px;
        font-size: 10px;
        letter-spacing: 1.1px;
        color: #8190a5;
      }
      .browser-canvas h3 {
        font-family: Georgia, "Noto Serif CJK SC", serif;
        font-size: 22px;
        line-height: 1.45;
        max-width: 580px;
        margin: 9px 0 12px;
        color: #1d3150;
      }
      .browser-canvas .authors {
        font-size: 11px;
        color: #62748c;
        margin-bottom: 18px;
      }
      .paper-actions {
        display: flex;
        gap: 9px;
        margin-bottom: 22px;
        align-items: center;
        flex-wrap: wrap;
      }
      .article-copy {

        line-height: 1.8;
        font-size: 13px;
        color: #516079;
        max-width: 650px;
      }
      .browser-footer {
        padding: 11px 17px;
        border-top: 1px solid var(--line);
        background: #fbfcfe;
        font-size: 11px;
        color: var(--muted);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }
      .guidance {
        padding: 20px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 8px;
      }
      .guidance label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 9px;
      }
      .guidance p {
        font-size: 12px;
        color: var(--muted);
        line-height: 1.8;
        margin-bottom: 14px;
      }
      .guidance textarea {
        width: 100%;
        min-height: 100px;
        resize: vertical;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 10px;
        font-size: 12px;
        background: #fcfdff;
        line-height: 1.7;
      }
      .guidance .btn {
        margin-top: 12px;
        width: 100%;
      }
      .guidance-status {
        font-size: 11px;
        margin-top: 12px;
        color: var(--blue);
      }
      .facts {
        margin-top: 19px;
        padding: 0 3px;
      }
      .facts h3 {
        font-size: 12px;
        margin-bottom: 12px;
      }
      .fact-row {
        display: flex;
        justify-content: space-between;
        gap: 15px;
        padding: 8px 0;
        font-size: 12px;
        border-bottom: 1px solid #e6edf6;
      }
      .fact-row span:first-child {
        color: var(--muted);
      }
      .execution-message {
        padding: 45px 35px;
        background: #fff;
        text-align: center;
      }
      .execution-message .large-icon {
        width: 52px;
        height: 52px;
        background: var(--blue-soft);
        color: var(--blue);
        display: grid;
        place-items: center;
        border-radius: 12px;
        margin: 0 auto 20px;
      }
      .execution-message h3 {
        font-size: 17px;
        margin-bottom: 10px;
      }
      .execution-message p {
        font-size: 13px;
        color: var(--muted);
        max-width: 480px;
        margin: auto;
        line-height: 1.9;
      }
      .execution-message .track {
        max-width: 330px;
        margin: 23px auto 10px;
        height: 5px;
      }
      .execution-message .btn {
        margin-top: 20px;
      }
      .result-banner {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        background: var(--blue-soft);
        color: #365e99;
        border: 1px solid #d6e5fb;
        border-radius: 7px;
        padding: 15px 19px;
        margin-bottom: 21px;
        font-size: 13px;
      }
      .result-banner strong {
        display: block;
        font-weight: 600;
      }
      .result-banner p {
        margin-top: 3px;
        font-size: 12px;
      }
      .result-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
      }
      .result-table th {
        text-align: left;
        font-size: 11px;
        font-weight: 500;
        color: var(--muted);
        background: #fbfcfe;
        padding: 11px 20px;
        border-bottom: 1px solid var(--line);
      }
      .result-table td {
        padding: 18px 20px;
        border-bottom: 1px solid #edf1f7;
      }
      .result-table tr:last-child td {
        border-bottom: 0;
      }
      .result-table td:first-child {
        min-width: 220px;
      }
      .result-table strong {
        font-size: 13px;
        font-weight: 550;
        display: block;
      }
      .result-table small {
        display: block;
        color: var(--muted);
        font-size: 11px;
        margin-top: 4px;
      }
      .activity-list {
        padding: 5px 25px;
      }
      .activity-row {
        display: grid;
        grid-template-columns: 55px 16px 1fr;
        gap: 14px;
        padding: 22px 0;
        border-bottom: 1px solid #edf1f7;
        font-size: 13px;
      }
      .activity-row:last-child {
        border-bottom: 0;
      }
      .activity-row time {
        font-size: 11px;
        color: var(--muted);
      }
      .activity-row p {
        font-size: 12px;
        color: var(--muted);
        margin-top: 4px;
      }
      .activity-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--blue);
        margin-top: 8px;
      }
      .library-list {
        padding: 0 24px;
      }
      .literature-row {
        display: flex;
        align-items: flex-start;
        gap: 17px;
        padding: 23px 0;
        border-bottom: 1px solid var(--line);
      }
      .literature-row:last-child {
        border-bottom: 0;
      }
      .paper-number {
        width: 31px;
        height: 39px;
        background: #f3f7ff;
        border: 1px solid #d8e5fa;
        border-radius: 4px;
        display: grid;
        place-items: center;
        color: #7291c3;
        flex: none;
        margin-top: 3px;
      }
      .literature-row h3 {
        font-size: 14px;
        font-weight: 600;
        line-height: 1.65;
      }
      .literature-row p {
        font-size: 12px;
        color: var(--muted);
        margin: 6px 0 10px;
      }
      .resource-tags {
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
      }
      .resource-tag {
        font-size: 11px;
        border: 1px solid var(--line);
        padding: 2px 7px;
        border-radius: 4px;
        color: #61758e;
      }
      .resource-tag.available {
        border-color: #dae6fa;
        background: #f6f9ff;
        color: #4a72af;
      }
      .reader-layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 290px;
        gap: 25px;
        align-items: start;
      }
      .reading {
        padding: 36px 42px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 9px;
      }
      .reading h2 {
        font-size: 23px;
        line-height: 1.5;
        font-weight: 600;
        letter-spacing: -0.4px;
        margin: 15px 0 12px;
      }
      .reading .paper-meta {
        font-size: 12px;
        color: var(--muted);
        border-bottom: 1px solid var(--line);
        padding-bottom: 24px;
        margin-bottom: 26px;
      }
      .reading h3 {
        font-size: 17px;
        margin: 25px 0 12px;
      }
      .reading p {
        font-size: 16px;
        line-height: 1.95;
        color: #3c4d66;
        margin: 12px 0;
      }
      .reading .source-highlight {
        background: #edf4ff;
        box-shadow: 0 0 0 5px #edf4ff;
        border-radius: 1px;
      }
      .evidence-panel {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 22px;
      }
      .evidence-panel h3 {
        margin-bottom: 16px;
      }
      .claim {
        font-size: 13px;
        line-height: 1.9;
        color: #41516b;
        margin-bottom: 16px;
      }
      .citation {
        background: #edf4ff;
        color: var(--blue);
        border: 0;
        padding: 1px 5px;
        border-radius: 3px;
        font-size: 11px;
        margin-left: 4px;
        vertical-align: baseline;
      }
      .evidence-quote {
        font-size: 12px;
        color: #536781;
        line-height: 1.9;
        border-left: 2px solid #a8c9ff;
        padding-left: 12px;
        margin-top: 17px;
      }
      .evidence-panel .small {
        margin-top: 15px;
      }
      .reader-tools {
        display: flex;
        gap: 8px;
        margin-top: 22px;
        flex-wrap: wrap;
      }
      .settings-grid {
        display: grid;
        grid-template-columns: 180px minmax(0, 1fr);
        gap: 30px;
      }
      .settings-nav {
        display: grid;
        gap: 5px;
        align-content: start;
      }
      .settings-nav button {
        text-align: left;
        padding: 10px 13px;
        border: 0;
        border-radius: 5px;
        background: transparent;
        color: var(--muted);
        font-size: 13px;
      }
      .settings-nav button.active {
        background: #e7effd;
        color: var(--blue);
        font-weight: 550;
      }
      .settings-body {
        max-width: 790px;
        background: white;
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 28px 30px;
      }
      .settings-body > p {
        font-size: 12px;
        color: var(--muted);
        margin: 7px 0 25px;
      }
      .setting-row {
        padding: 19px 0;
        border-bottom: 1px solid var(--line);
        display: flex;
        justify-content: space-between;
        gap: 20px;
        align-items: center;
      }
      .setting-row:last-child {
        border-bottom: 0;
      }
      .setting-row h3 {
        font-size: 13px;
      }
      .setting-row p {
        font-size: 12px;
        color: var(--muted);
        margin-top: 4px;
      }
      .field {
        margin-bottom: 20px;
      }
      .field label,
      .field-label {
        display: block;
        font-size: 13px;
        font-weight: 500;
        margin-bottom: 7px;
      }
      .field input,
      .field select,
      .field textarea {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #d9e2f0;
        border-radius: 6px;
        background: #fff;
        line-height: 1.6;
        font-size: 13px;
      }
      .field input[readonly] {
        background: #f7f9fc;
        color: var(--muted);
      }
      .field small {
        font-size: 11px;
        color: var(--muted);
        display: block;
        margin-top: 6px;
      }
      .settings-actions {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        gap: 12px;
        margin-top: 24px;
      }
      .settings-actions p {
        font-size: 12px;
        color: var(--blue);
      }
      .check-row {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 11px 0;
        font-size: 13px;
      }
      .check-row input {
        accent-color: var(--blue);
        width: 15px;
        height: 15px;
      }
      .notice {
        background: #f6f9fe;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 12px 14px;
        font-size: 12px;
        color: var(--muted);
        line-height: 1.8;
      }
      .settings-notice {
        margin-top: 23px;
      }
      dialog {
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 0;
        width: min(530px, calc(100vw - 32px));
        max-height: calc(100vh - 48px);
        box-shadow: var(--shadow);
        color: var(--ink);
        background: #fff;
      }
      dialog::backdrop {
        background: #14244055;
        backdrop-filter: blur(2px);
      }
      .dialog-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 22px 25px 18px;
        border-bottom: 1px solid var(--line);
      }
      .dialog-head h2 {
        font-size: 18px;
      }
      .dialog-body {
        padding: 25px;
      }
      .dialog-foot {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        padding: 17px 25px;
        background: #f8faff;
        border-top: 1px solid var(--line);
      }
      .dialog-body > .muted {
        font-size: 13px;
        margin-bottom: 20px;
      }
      .operation-options {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 9px;
        margin-bottom: 22px;
      }
      .operation-option {
        border: 1px solid var(--line);
        border-radius: 7px;
        padding: 12px 8px;
        text-align: center;
        background: white;
        font-size: 12px;
        display: flex;
        flex-direction: column;
        gap: 7px;
        align-items: center;
      }
      .operation-option.active {
        border-color: #9ebffd;
        background: #f1f6ff;
        color: var(--blue);
      }
      .toast {
        position: fixed;
        bottom: 24px;
        left: calc(50% + 70px);
        transform: translateX(-50%);
        padding: 12px 18px;
        background: #192b47;
        color: #fff;
        box-shadow: 0 4px 18px #192b4729;
        border-radius: 8px;
        z-index: 90;
        font-size: 13px;
        max-width: min(520px, calc(100vw - 32px));
        display: flex;
        gap: 9px;
        align-items: center;
      }
      .design-popover {
        position: absolute;
        right: 24px;
        top: 56px;
        z-index: 50;
        width: 260px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 9px;
        box-shadow: var(--shadow);
        padding: 18px;
      }
      .design-popover h3 {
        margin-bottom: 15px;
      }
      .design-popover label {
        display: block;
        font-size: 12px;
        margin-top: 12px;
      }
      .design-popover select {
        display: block;
        width: 100%;
        margin-top: 6px;
        padding: 7px;
        border: 1px solid var(--line);
        border-radius: 5px;
        background: #fff;
        font-size: 12px;
      }
      .design-popover p {
        font-size: 11px;
        color: var(--muted);
        margin-top: 14px;
      }
      .mobile-backdrop {
        display: none;
      }
      .figure-placeholder {
        background: #f8faff;
        border: 1px solid var(--line);
        padding: 26px;
        text-align: center;
        color: #6b7e9a;
        margin-top: 25px;
        font-size: 12px;
      }
      .step-examples {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin-bottom: 22px;
      }
      .step-example {
        padding: 14px;
        background: #f7f9fd;
        border-radius: 6px;
      }
      .step-example b {
        font-size: 12px;
        font-weight: 550;
        display: block;
      }
      .step-example small {
        display: block;
        font-size: 11px;
        color: var(--muted);
        margin-top: 5px;
      }
      body[data-density="compact"] {
        --row-pad: 12px;
      }
      .content[data-layout="focus"] .overview-grid {
        grid-template-columns: 1fr;
      }
      .content[data-layout="focus"] .overview-side {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
      }
      .content[data-layout="focus"] .attention-panel h3 {
        margin-top: 12px;
      }
      .content[data-layout="focus"] .attention-paper {
        display: none;
      }
      .content[data-layout="focus"] .side-section {
        padding: 20px;
        border: 1px solid var(--line);
        background: white;
        border-radius: 10px;
      }
      @media (min-width: 1600px) {
        .content {
          padding: 38px 48px;
        }
        .overview-grid {
          grid-template-columns: minmax(0, 1fr) 310px;
        }
        .task-row {
          padding-top: 24px;
          padding-bottom: 24px;
        }
      }
      @media (max-width: 1250px) {
        :root {
          --rail: 190px;
        }
        .content {
          padding: 28px 25px;
        }
        .topbar {
          padding: 0 25px;
        }
        .overview-grid {
          grid-template-columns: minmax(0, 1fr) 250px;
          gap: 18px;
        }
        .task-head,
        .task-row {
          grid-template-columns: minmax(150px, 1fr) 110px 75px 14px;
          gap: 11px;
          padding-left: 17px;
          padding-right: 17px;
        }
        .table-full .task-head,
        .table-full .task-row {
          grid-template-columns: minmax(180px, 1fr) 125px 100px 90px 16px;
          gap: 14px;
        }
        .attention-panel {
          padding: 19px;
        }
        .execution-layout {
          grid-template-columns: minmax(0, 1fr) 238px;
          gap: 18px;
        }
        .browser-canvas {
          padding: 22px;
        }
        .reader-layout {
          grid-template-columns: minmax(0, 1fr) 260px;
          gap: 20px;
        }
        .reading {
          padding: 29px;
        }
        .brand {
          font-size: 18px;
        }
      }
      @media (max-width: 1050px) {
        .overview-grid {
          grid-template-columns: 1fr;
        }
        .overview-side {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 23px;
        }
        .attention-panel h3 {
          margin-top: 12px;
        }
        .side-section {
          padding: 18px 5px;
        }
        .execution-layout {
          grid-template-columns: 1fr;
        }
        .execution-side {
          display: grid;
          grid-template-columns: 1.15fr 1fr;
          gap: 20px;
        }
        .facts {
          margin-top: 4px;
        }
        .reader-layout {
          grid-template-columns: 1fr;
        }
        .evidence-panel {
          max-width: none;
        }
        .table-full .task-head,
        .table-full .task-row {
          grid-template-columns: minmax(150px, 1fr) 115px 90px 14px;
        }
        .table-time {
          display: none;
        }
      }
      @media (max-width: 760px) {
        .shell {
          display: block;
        }
        .rail {
          position: fixed;
          left: 0;
          top: 0;
          bottom: 0;
          width: 230px;
          height: 100dvh;
          transform: translateX(-100%);
          transition: transform 0.18s;
          z-index: 60;
        }
        .rail.open {
          transform: translateX(0);
        }
        .mobile-backdrop.visible {
          display: block;
          position: fixed;
          inset: 0;
          background: #14244055;
          z-index: 55;
        }
        .menu-button {
          display: inline-flex;
        }
        .topbar {
          padding: 10px 17px;
          min-height: 61px;
        }
        .top-actions {
          gap: 6px;
        }
        .preview-label {
          display: none;
        }
        .content {
          padding: 24px 18px;
        }
        .crumbs {
          gap: 7px;
        }
        .page-heading {
          gap: 12px;
        }
        .page-heading h1 {
          font-size: 25px;
        }
        .page-heading p {
          font-size: 12px;
        }
        .summary-line {
          gap: 12px;
        }
        .overview-grid {
          gap: 20px;
        }
        .overview-side {
          grid-template-columns: 1fr 1fr;
          gap: 18px;
        }
        .task-head,
        .task-row {
          grid-template-columns: minmax(130px, 1fr) 112px 64px 14px;
          gap: 10px;
          padding-left: 15px;
          padding-right: 15px;
        }
        .task-title {
          font-size: 13px;
        }
        .task-sub {
          font-size: 11px;
        }
        .panel-header {
          padding: 16px;
        }
        .panel-header h2 {
          font-size: 15px;
        }
        .detail-heading h1 {
          font-size: 23px;
        }
        .detail-heading {
          flex-direction: column;
          gap: 15px;
        }
        .detail-summary {
          gap: 15px 25px;
          padding: 16px;
        }
        .detail-summary .summary-progress {
          min-width: 100px;
        }
        .summary-item strong {
          font-size: 20px;
        }
        .stage-line {
          padding: 15px;
        }
        .stage {
          font-size: 11px;
          gap: 5px;
        }
        .stage:not(:last-child):after {
          margin-right: 7px;
          margin-left: 0;
        }
        .settings-grid {
          grid-template-columns: 1fr;
          gap: 20px;
        }
        .settings-nav {
          display: flex;
          flex-wrap: wrap;
          gap: 3px;
        }
        .settings-nav button {
          padding: 8px 11px;
          font-size: 12px;
        }
        .settings-body {
          padding: 22px;
        }
        .toast {
          left: 50%;
        }
        .design-popover {
          right: 14px;
          top: 54px;
        }
        .reading {
          padding: 25px;
        }
        .browser-canvas h3 {
          font-size: 20px;
        }
      }
      @media (max-width: 520px) {
        .overview-side,
        .content[data-layout="focus"] .overview-side {
          grid-template-columns: 1fr;
        }
        .side-section {
          padding: 6px 2px;
        }
        .summary-line .sep {
          display: none;
        }
        .summary-line {
          font-size: 11px;
          gap: 10px;
        }
        .summary-line b {
          font-size: 13px;
        }
        .task-head {
          display: none;
        }
        .task-row,
        .table-full .task-row {
          grid-template-columns: minmax(0, 1fr) auto;
          gap: 10px 13px;
          padding: 18px 16px;
        }
        .task-row > div:first-child {
          grid-column: 1/-1;
        }
        .task-row .row-chevron {
          display: none;
        }
        .task-row .task-state-cell {
          display: flex;
          align-items: center;
          gap: 9px;
          flex-wrap: wrap;
        }
        .task-row .task-phase {
          margin: 0;
          font-size: 11px;
        }
        .task-row .task-progress {
          width: 72px;
        }
        .task-row .progress-value {
          margin-bottom: 5px;
        }
        .task-title {
          font-size: 14px;
        }
        .task-sub {
          font-size: 11px;
        }
        .toolbar {
          gap: 13px;
        }
        .search-field {
          width: 100%;
          min-width: 0;
        }
        .segments {
          width: 100%;
          justify-content: space-between;
          gap: 0;
        }
        .segments button {
          padding: 7px 8px;
          font-size: 11px;
        }
        .output-row {
          flex-wrap: wrap;
        }
        .output-row > .text-link {
          margin-left: 51px;
          font-size: 12px;
        }
        .output-list {

        }
        function pdfOnlyPaper(p) {
          return `<a class="back-link" href="${esc(state.returnTo)}">${icon("back", true)}返回${state.returnTo.startsWith("#task/") ? "任务结果" : "文献库"}</a>${heading("材料与证据", "检查已保存的原始文件与当前内容缺口。", false)}<section class="panel"><div class="execution-message"><div class="large-icon">${icon("document")}</div><h3>${esc(p.subtitle)}</h3><p>示例 PDF 已保存，正文尚未解析。知识概要也尚未生成。阅读这个页面不会自动启动新的处理。</p><div><button class="btn primary" data-action="pdf-preview">${icon("document", true)}原始 PDF</button></div><p class="small muted" style="margin-top:15px">文件与阅读位置均为设计示意，未附带真实文件。</p></div></section>`;
        }
        function renderSettings(section = "general") {
          state.settingsTab = [
            "general",
            "sources",
            "models",
            "parser",
            "library",
          ].includes(section)
            ? section
            : "general";
          let body;
          if (state.settingsTab === "general")
            body = `<h2>工作区设置</h2><p>管理工作区名称与界面偏好。</p><form id="settings-form"><div class="field"><label for="workspace-name">文献库显示名称</label><input id="workspace-name" value="${esc(state.workspace)}" maxlength="30" required></div><div class="setting-row"><div><h3>任务优先</h3><p>首页展示活动任务、待处理事项和最近结果。</p></div><span class="pill running">当前布局</span></div><div class="setting-row"><div><h3>蓝白主题</h3><p>蓝色用于主要操作、当前选择和执行状态。</p></div><span class="pill">浅色</span></div><div class="settings-actions"><p id="save-status" role="status"></p><button class="btn primary" type="submit">保存设置</button></div></form>`;
          else if (state.settingsTab === "library")
            body = `<h2>当前文献库</h2><p>工作台、Agent 与命令行应使用同一组数据库和资产目录。</p><div class="field"><label for="catalog-example">数据库</label><input id="catalog-example" readonly value="/example/research/catalog.sqlite"><small>示例路径，未读取本机配置。</small></div><div class="field"><label for="artifacts-example">文献资产目录</label><input id="artifacts-example" readonly value="/example/research/artifacts"></div><div class="notice">当前为离线设计稿，未连接实际数据库。这里演示正式界面中“当前连接到哪个文献库”的展示位置。</div>`;
          else if (state.settingsTab === "sources")
            body = `<h2>文献来源</h2><p>来源设置归属具体检索与获取能力。</p><form id="sources-form">${["Crossref", "OpenAlex", "arXiv", "Europe PMC"].map((name) => `<label class="check-row"><input type="checkbox" name="source" value="${name}" ${state.sources.includes(name) ? "checked" : ""}>${name}</label>`).join("")}<div class="notice settings-notice">仅演示选中与保存反馈，不发起请求或写入真实配置。</div><div class="settings-actions"><p id="source-save-status" role="status"></p><button class="btn primary" type="submit">保存选择</button></div></form>`;
          else if (state.settingsTab === "models")
            body = `<h2>模型与分析</h2><p>模型连接与任务使用分开管理。</p><div class="setting-row"><div><h3>分析模型</h3><p>用于对已有正文生成知识结果。</p></div><span class="pill">示例 · 未连接</span></div><div class="setting-row"><div><h3>Browser 模型</h3><p>用于观察页面并决定下一步操作。</p></div><span class="pill">示例 · 未连接</span></div><div class="notice settings-notice">设计稿不接收或保存 API Key。正式配置能力沿用现有服务。</div>`;
          else
            body = `<h2>文档解析</h2><p>管理将原始 PDF 转为可读正文的解析服务。</p><div class="setting-row"><div><h3>MinerU</h3><p>由使用者管理的外部解析服务。</p></div><span class="pill">示例 · 未连接</span></div><div class="notice settings-notice">查看这个页面不会启动解析或调用外部服务。</div>`;
          return (
            heading("设置", "管理文献库和任务运行所需的条件。", false) +
            `<div class="settings-grid"><nav class="settings-nav" aria-label="设置分类">${[
              ["general", "工作区"],
              ["sources", "文献来源"],
              ["models", "模型与分析"],
              ["parser", "文档解析"],
              ["library", "当前文献库"],
            ]
              .map(
                ([value, label]) =>
                  `<button class="${state.settingsTab === value ? "active" : ""}" data-settings="${value}" ${state.settingsTab === value ? 'aria-current="page"' : ""}>${label}</button>`,
              )
              .join(
                "",
              )}</nav><section class="settings-body">${body}</section></div>`
          );
        }
        function render() {
          const parts = (location.hash.slice(1) || "overview").split("/");
          const route = parts[0];
          const section =
            route === "task" ? "tasks" : route === "paper" ? "library" : route;
          const navItems = [
            ["overview", "grid", "工作台"],
            ["tasks", "tasks", "任务"],
            ["library", "library", "文献库"],
            ["settings", "settings", "设置"],
          ];
          document.getElementById("navigation").innerHTML = navItems
            .map(
              ([key, symbol, label]) =>
                `<a href="#${key}" class="${section === key ? "active" : ""}" ${section === key ? 'aria-current="page"' : ""}>${icon(symbol)}${label}${key === "tasks" ? `<span class="nav-count">${tasks.filter(running).length}</span>` : ""}</a>`,
            )
            .join("");
          document.getElementById("workspace-label").textContent =
            state.workspace;
          document.getElementById("crumbs").innerHTML =
            `<span>${esc(state.workspace)}</span>${icon("chevron", true)}<strong>${navItems.find((n) => n[0] === section)?.[2] || "工作台"}</strong>${route === "task" ? `<span class="mono">/ ${esc(parts[1] || "")}</span>` : ""}`;
          page.dataset.layout = state.layout;
          document.body.dataset.density = state.density;
          page.innerHTML =
            route === "tasks"
              ? renderTasks()
              : route === "task"
                ? renderDetail(parts[1], parts[2])
                : route === "library"
                  ? renderLibrary()
                  : route === "paper"
                    ? renderPaper(parts[1])
                    : route === "settings"
                      ? renderSettings(parts[1])
                      : renderOverview();
          hydrate();
        }
        function syncNavigation() {
          const rail = document.getElementById("rail");
          rail.inert =
            window.matchMedia("(max-width:760px)").matches &&
            !rail.classList.contains("open");
        }
        function closeNavigation() {
          const rail = document.getElementById("rail");
          const restore =
            rail.contains(document.activeElement) &&
            window.matchMedia("(max-width:760px)").matches;
          rail.classList.remove("open");
          document
            .getElementById("mobile-backdrop")
            .classList.remove("visible");
          document
            .getElementById("menu-toggle")
            .setAttribute("aria-expanded", "false");
          if (restore)
            document
              .getElementById("menu-toggle")
              .focus({ preventScroll: true });
          syncNavigation();
        }
        function operationOptions() {
          document.getElementById("operation-options").innerHTML = [
            ["pdf", "download", "获取 PDF"],
            ["parse", "document", "解析正文"],
            ["analysis", "layers", "知识分析"],
          ]
            .map(
              ([value, symbol, label]) =>
                `<button type="button" class="operation-option ${state.operation === value ? "active" : ""}" data-operation="${value}" aria-pressed="${state.operation === value}">${icon(symbol)}${label}</button>`,
            )
            .join("");
        }
        function currentTask() {
          return tasks.find((t) => t.id === location.hash.split("/")[1]);
        }
        document.addEventListener("click", (event) => {
          const target = event.target instanceof Element ? event.target : null;
          if (!target) return;
          const paperLink = target.closest("[data-paper-link]");
          if (paperLink) {
            state.returnTo = location.hash.startsWith("#task/")
              ? location.hash
              : "#library";
            state.evidence = false;
          }
          const close = target.closest("[data-close-dialog]");
          if (close) document.getElementById(close.dataset.closeDialog).close();
          const filter = target.closest("[data-task-filter]");
          if (filter) {
            state.taskFilter = filter.dataset.taskFilter;
            render();
          }
          const libFilter = target.closest("[data-library-filter]");
          if (libFilter) {
            state.libraryFilter = libFilter.dataset.libraryFilter;
            render();
          }
          const settings = target.closest("[data-settings]");
          if (settings) navigate("#settings/" + settings.dataset.settings);
          const operation = target.closest("[data-operation]");
          if (operation) {
            state.operation = operation.dataset.operation;
            operationOptions();
            document.getElementById("new-title").value = {
              pdf: "补齐选中文献的 PDF",
              parse: "解析选中文献的全文",
              analysis: "生成选中文献的知识概要",
            }[state.operation];
          }
          const action = target.closest("[data-action]");
          if (!action) return;
          const t = tasks.find((item) => item.id === action.dataset.id);
          switch (action.dataset.action) {
            case "new-task":
              operationOptions();
              document.getElementById("new-task-dialog").showModal();
              break;
            case "assist":
              navigate("#task/" + action.dataset.id + "/execution");
              break;
            case "clear-task-filter":
              state.taskFilter = "all";
              state.taskQuery = "";
              render();
              break;
            case "clear-library-filter":
              state.libraryFilter = "all";
              state.libraryQuery = "";
              render();
              break;
            case "reconnect":
              state.scenario = "normal";
              document.getElementById("scenario").value = "normal";
              render();
              toast("示例连接已恢复");
              break;
            case "pause":
              if (t) {
                const paused = t.status === "paused";
                if (!paused)
                  t.beforePause = { status: t.status, stage: t.stage };
                t.status = paused
                  ? t.beforePause?.status || "running"
                  : "paused";
                t.stage = paused
                  ? t.beforePause?.stage || "处理文献"
                  : "等待继续";
                t.human = false;
                t.events.unshift({
                  time: "现在",
                  title: paused ? "继续任务" : "任务已暂停",
                  detail: "已有结果保持可用。",
                });
                render();
                toast(paused ? "示例任务已继续" : "示例任务已暂停");
              }
              break;
            case "cancel":
              state.cancelId = action.dataset.id;
              document.getElementById("cancel-dialog").showModal();
              break;
            case "takeover":
              if (t && !["cancelled", "paused"].includes(t.status)) {
                t.human = !t.human;
                t.events.unshift({
                  time: "现在",
                  title: t.human ? "人工接管当前文章" : "已交还 Agent",
                  detail: t.human
                    ? "页面操作由你控制。"
                    : "Agent 将重新观察当前页面。",
                });
                render();
                toast(
                  t.human
                    ? "已接管当前示例页面"
                    : "已交还；Agent 将重新观察当前页面",
                );
              }
              break;
            case "capture":
              if (
                t?.human &&
                !t.captured &&
                !["cancelled", "paused"].includes(t.status)
              ) {
                t.captured = true;
                t.done++;
                t.status = "running";
                papers.find((p) => p.id === "P-003").pdf = true;
                t.events.unshift({
                  time: "现在",
                  title: "示例 PDF 已保存",
                  detail: "可以前往结果页查看已有材料。",
                });
                render();
                toast("示例 PDF 已保存；已有结果不会因后续失败丢失");
              }
              break;
            case "evidence":
              state.evidence = !state.evidence;
              render();
              page
                .querySelector('[data-action="evidence"]')
                ?.focus({ preventScroll: true });
              break;
            case "pdf-preview":
              toast("原始 PDF 阅读位置示意；本设计稿未附带真实文件");
              break;
          }
        });
        document.addEventListener("input", (event) => {
          const target = event.target;
          if (target.id === "task-search") {
            state.taskQuery = target.value;
            document.getElementById("task-list").innerHTML = taskList();
          }
          if (target.id === "library-search") {
            state.libraryQuery = target.value;
            document.getElementById("library-list").innerHTML = libraryList();
          }
        });
        document.addEventListener("submit", (event) => {
          if (event.target.id === "new-task-form") {
            event.preventDefault();
            const title = document.getElementById("new-title").value.trim();
            if (!title) return;
            const count = Number(document.getElementById("new-scope").value);
            const id =
              "T-" +
              String(
                25 + tasks.filter((t) => t.createdInPreview).length,
              ).padStart(3, "0");
            tasks.unshift({
              id,
              title,
              kind: state.operation,
              status: "queued",
              stage: "等待开始",
              done: 0,
              total: count,
              time: "刚刚",
              source: "手动创建",
              human: false,
              captured: false,
              guidance: "",
              createdInPreview: true,
              events: [],
            });
            document.getElementById("new-task-dialog").close();
            state.scenario = "normal";
            document.getElementById("scenario").value = "normal";
            navigate("#task/" + id + "/execution");
            toast("示例任务已创建，刷新页面后重置");
          }
          if (event.target.id === "guidance-form") {
            event.preventDefault();
            const t = currentTask(),
              value = document.getElementById("guidance-input").value.trim();
            if (!t || !value || ["cancelled", "paused"].includes(t.status))
              return;
            t.guidance = value;
            t.events.unshift({
              time: "现在",
              title: "收到当前文章的指导",
              detail: "指导只绑定当前示例文章。",
            });
            render();
            toast("已收到示例指导，仅用于当前文章");
          }
          if (event.target.id === "settings-form") {
            event.preventDefault();
            const value = document
              .getElementById("workspace-name")
              .value.trim();
            if (!value) return;
            state.workspace = value;
            render();
            document.getElementById("save-status").textContent =
              "已保存到本页示例";
            toast("工作区显示名称已更新；未写入真实配置");
          }
          if (event.target.id === "sources-form") {
            event.preventDefault();
            state.sources = [
              ...event.target.querySelectorAll("input:checked"),
            ].map((input) => input.value);
            document.getElementById("source-save-status").textContent =
              "已保存到本页示例";
            toast("来源选择已确认；未连接外部服务");
          }
        });
        document
          .getElementById("confirm-cancel")
          .addEventListener("click", () => {
            const t = tasks.find((item) => item.id === state.cancelId);
            if (t) {
              t.status = "cancelled";
              t.stage = "处理已停止";
              t.human = false;
              t.events.unshift({
                time: "现在",
                title: "任务已取消",
                detail: "已完成材料和结果仍保留。",
              });
            }
            document.getElementById("cancel-dialog").close();
            render();
            toast("示例任务已取消，已有结果已保留");
          });
        document.getElementById("menu-toggle").addEventListener("click", () => {
          const open = !document
            .getElementById("rail")
            .classList.contains("open");
          document.getElementById("rail").classList.toggle("open", open);
          document
            .getElementById("mobile-backdrop")
            .classList.toggle("visible", open);
          document
            .getElementById("menu-toggle")
            .setAttribute("aria-expanded", String(open));
          syncNavigation();
          if (open)
            document
              .querySelector("#navigation a.active")
              ?.focus({ preventScroll: true });
        });
        document
          .getElementById("mobile-backdrop")
          .addEventListener("click", closeNavigation);
        document
          .getElementById("design-toggle")
          .addEventListener("click", () => {
            const popup = document.getElementById("design-options");
            popup.hidden = !popup.hidden;
            document
              .getElementById("design-toggle")
              .setAttribute("aria-expanded", String(!popup.hidden));
          });
        for (const key of ["density", "layout", "scenario"])
          document.getElementById(key).addEventListener("change", (event) => {
            state[key] = event.target.value;
            if (key === "scenario" && !location.hash.startsWith("#overview"))
              navigate("#overview");
            else render();
          });
        document.addEventListener("keydown", (event) => {
          if (event.key === "Escape") {
            closeNavigation();
            document.getElementById("design-options").hidden = true;
            document
              .getElementById("design-toggle")
              .setAttribute("aria-expanded", "false");
          }
        });
        window.addEventListener("hashchange", () => {
          render();
          closeNavigation();
          window.scrollTo({ top: 0, behavior: "instant" });
        });
        window.addEventListener("resize", syncNavigation);
        render();
        hydrate();
        syncNavigation();
      })();
    </script>
  </body>
</html>
