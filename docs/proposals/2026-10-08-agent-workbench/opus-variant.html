<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <!-- Design authored by Claude Code / claude-opus-5-5, effort xhigh. Codex reviewed prototype interactions; see comparison.md. -->
    <title>sci retriever · 工作台原型（合成示例）</title>
    <style>
      * {
        box-sizing: border-box;
      }
      :root {
        --bg: #f5f5f0;
        --ink: #263b33;
        --g: #386d50;
        --gl: #e3ebe4;
        --ln: #dcdcd2;
        --mut: #5d6a63;
        --cd: #fcfcf9;
        --am: #8f5508;
        --amb: #fbf2e1;
        --aml: #e6c690;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          14px/1.55 system-ui,
          -apple-system,
          "Segoe UI",
          "PingFang SC",
          "Microsoft YaHei",
          sans-serif;
        overflow-x: hidden;
        overflow-wrap: break-word;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
      }
      :focus-visible {
        outline: 2px solid var(--g);
        outline-offset: 2px;
      }
      h1 {
        font-size: 19px;
        margin: 0;
        outline: 0;
      }
      h2,
      .lh {
        font-size: 13px;
        margin: 0 0 8px;
        color: var(--mut);
        font-weight: 600;
        outline: 0;
        display: block;
      }
      p {
        margin: 0 0 8px;
      }
      .skip {
        position: absolute;
        left: -999px;
      }
      .skip:focus {
        left: 12px;
        top: 8px;
        z-index: 20;
        background: #fff;
        padding: 6px 10px;
      }
      .top {
        position: sticky;
        top: 0;
        z-index: 5;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 22px;
        padding: 9px 24px;
        background: #fbfbf7;
        border-bottom: 1px solid var(--ln);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 15px;
      }
      .mark {
        width: 18px;
        height: 18px;
        border-radius: 5px;
        background: var(--ink);
        display: grid;
        place-items: center;
      }
      .mark:after {
        content: "";
        width: 7px;
        height: 7px;
        border: 2px solid #a5c9b0;
        border-radius: 50%;
      }
      .tag {
        font-size: 12px;
        color: var(--am);
        background: var(--amb);
        border: 1px solid var(--aml);
        border-radius: 4px;
        padding: 0 6px;
      }
      nav {
        display: flex;
        gap: 2px;
      }
      nav button {
        border: 0;
        background: none;
        padding: 6px 12px;
        border-radius: 6px;
        color: var(--mut);
        font-size: 14px;
      }
      nav button[aria-current] {
        background: var(--gl);
        color: var(--ink);
        font-weight: 600;
      }
      .tools {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .seg {
        display: flex;
        align-items: center;
        border: 1px solid var(--ln);
        border-radius: 7px;
        background: #fff;
        font-size: 12px;
        overflow: hidden;
      }
      .seg > span {
        padding: 0 8px;
        color: var(--mut);
      }
      .seg button {
        border: 0;
        border-left: 1px solid var(--ln);
        background: none;
        padding: 4px 9px;
        font-size: 12px;
      }
      .seg button[aria-pressed="true"] {
        background: var(--ink);
        color: #fff;
      }
      .btn {
        border: 1px solid #cfd0c4;
        background: #fff;
        border-radius: 7px;
        padding: 6px 12px;
        font-size: 14px;
        line-height: 1.35;
      }
      .btn:hover {
        border-color: var(--g);
      }
      .pri {
        background: var(--g);
        border-color: var(--g);
        color: #fff;
      }
      .amb {
        background: var(--am);
        border-color: var(--am);
        color: #fff;
      }
      .warn {
        color: #8a3527;
      }
      .dng {
        background: #8a3527;
        border-color: #8a3527;
        color: #fff;
      }
      .btn:disabled {
        opacity: 0.5;
        cursor: default;
      }
      body.off .net {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .chip {
        display: inline-block;
        font-size: 12px;
        line-height: 18px;
        padding: 0 7px;
        border-radius: 9px;
        background: var(--gl);
        color: var(--g);
        white-space: nowrap;
        vertical-align: middle;
      }
      .c-h {
        background: var(--amb);
        color: var(--am);
        border: 1px solid var(--aml);
      }
      .c-p {
        background: #e6edf1;
        color: #2f5670;
      }
      .c-q,
      .c-queue,
      .c-x,
      .c-cancel {
        background: #ebebe4;
        color: var(--mut);
      }
      .ban {
        background: #f4e4df;
        color: #7a2f24;
        border-bottom: 1px solid #e6c7be;
        padding: 8px 24px;
        font-size: 13px;
      }
      .ban:empty {
        display: none;
      }
      main {
        max-width: 1260px;
        margin: 0 auto;
        padding: 18px 24px 64px;
        outline: 0;
      }
      .phead {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 14px;
        margin-bottom: 14px;
      }
      .sub {
        color: var(--mut);
        font-size: 13px;
      }
      .lbl {
        display: block;
        font-size: 12px;
        color: var(--mut);
      }
      .note {
        font-size: 12px;
        color: var(--am);
      }
      .strip {
        display: flex;
        flex-wrap: wrap;
        gap: 2px 16px;
        font-size: 13px;
        background: #fff;
        border: 1px solid var(--ln);
        border-radius: 8px;
        padding: 4px 12px;
        color: var(--mut);
        margin: 0;
      }
      .strip b {
        color: var(--ink);
      }
      .strip i {
        display: inline-block;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        margin-right: 6px;
        background: var(--g);
        vertical-align: 1px;
      }
      .strip .q i {
        background: #a3a79a;
      }
      .strip .h i {
        background: #c3801f;
      }
      .cols {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 280px;
        gap: 24px;
        align-items: start;
      }
      section {
        margin-bottom: 18px;
      }
      .help {
        background: var(--amb);
        border: 1px solid var(--aml);
        border-left: 4px solid #c3801f;
        border-radius: 10px;
        padding: 14px 18px;
        margin-bottom: 8px;
      }
      .help h3 {
        font-size: 17px;
        line-height: 1.35;
        margin: 6px 0;
      }
      .acts {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
      .trow {
        display: grid;
        grid-template-columns: minmax(0, 1.6fr) minmax(
            0,
            1.3fr
          ) 140px 118px 104px;
        gap: 16px;
        align-items: center;
        background: var(--cd);
        border: 1px solid var(--ln);
        border-radius: 10px;
        padding: 12px 16px;
        margin-bottom: 8px;
      }
      .tlink {
        border: 0;
        background: none;
        padding: 0;
        font-weight: 600;
        font-size: 15px;
        text-align: left;
        color: var(--ink);
      }
      .tlink:hover,
      .rb:hover {
        text-decoration: underline;
      }
      .trow .sub {
        margin: 2px 0 0;
      }
      .bar {
        height: 6px;
        background: #e4e4db;
        border-radius: 3px;
        overflow: hidden;
        margin-bottom: 4px;
      }
      .bar i {
        display: block;
        height: 100%;
        background: var(--g);
      }
      .thumb {
        position: relative;
        width: 104px;
        height: 66px;
        border: 1px solid #cfd0c4;
        border-radius: 6px;
        background: #fff;
        padding: 7px 8px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        overflow: hidden;
      }
      .thumb .l {
        display: block;
        height: 4px;
        border-radius: 2px;
        background: #d7dbd3;
      }
      .thumb em {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        font: normal 12px/18px system-ui;
        background: rgba(38, 59, 51, 0.85);
        color: #fff;
        text-align: center;
      }
      .card {
        background: var(--cd);
        border: 1px solid var(--ln);
        border-radius: 10px;
        padding: 14px 16px;
        margin-bottom: 14px;
      }
      .dgrid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 340px;
        gap: 20px;
        align-items: start;
      }
      .back {
        border: 0;
        background: none;
        color: var(--g);
        padding: 4px 0;
        margin-bottom: 6px;
        font-size: 14px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
      }
      th,
      td {
        text-align: left;
        padding: 8px 6px;
        border-top: 1px solid var(--ln);
        vertical-align: top;
        font-size: 13px;
      }
      th {
        font-size: 12px;
        color: var(--mut);
        font-weight: 600;
        border-top: 0;
      }
      tr.on td {
        background: var(--gl);
      }
      .rb {
        border: 0;
        background: none;
        padding: 0;
        text-align: left;
        font-size: 14px;
        font-weight: 500;
        color: var(--ink);
        line-height: 1.4;
      }
      .log {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .log li {
        display: flex;
        gap: 10px;
        padding: 5px 0;
        border-top: 1px dashed var(--ln);
        font-size: 13px;
      }
      .log li:first-child {
        border-top: 0;
      }
      .log time {
        color: var(--mut);
        flex: none;
        width: 40px;
      }
      .at {
        font-size: 16px;
        line-height: 1.35;
        margin: 4px 0 6px;
      }
      #ad .btn {
        margin: 4px 6px 0 0;
      }
      .scope {
        font-size: 13px;
        background: #fff;
        border: 1px solid var(--ln);
        border-left: 3px solid var(--g);
        border-radius: 6px;
        padding: 7px 12px;
        margin-bottom: 14px;
      }
      .bgrid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 320px;
        gap: 18px;
        align-items: start;
      }
      .frame {
        border: 1px solid #c9cbbf;
        border-radius: 10px;
        overflow: hidden;
        background: #fff;
      }
      .chrome {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        padding: 7px 10px;
        background: #ebebe4;
        border-bottom: 1px solid #d6d6cc;
        font-size: 12px;
      }
      .url {
        flex: 1 1 200px;
        min-width: 0;
        background: #fff;
        border-radius: 5px;
        padding: 2px 8px;
        color: var(--mut);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .page {
        position: relative;
      }
      .pin {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 170px;
        gap: 26px;
        padding: 22px 28px 30px;
        font-family: Georgia, "Times New Roman", serif;
        color: #1e2622;
        min-height: 500px;
      }
      .pin small {
        font: 12px system-ui;
        color: #28466b;
        letter-spacing: 0.04em;
      }
      .pin h3 {
        font-size: 23px;
        line-height: 1.3;
        margin: 6px 0 8px;
        font-weight: 600;
      }
      .pin h4 {
        font-size: 14px;
        margin: 14px 0 4px;
      }
      .ln {
        height: 8px;
        border-radius: 4px;
        background: #e5e7e1;
        margin: 10px 0;
      }
      .fig {
        height: 120px;
        border: 1px solid #e1e3dc;
        border-radius: 4px;
        background: repeating-linear-gradient(
          45deg,
          #f6f7f3 0 8px,
          #eef0ea 8px 16px
        );
        display: grid;
        place-items: center;
        font: 12px system-ui;
        color: var(--mut);
        margin-top: 16px;
      }
      .pside {
        font: 13px system-ui;
      }
      .pside details {
        border: 1px solid #d6dae2;
        border-radius: 6px;
        padding: 8px 10px;
        margin-bottom: 10px;
      }
      .pside summary {
        cursor: pointer;
        font-weight: 600;
        color: #28466b;
      }
      .dl {
        display: block;
        width: 100%;
        margin-top: 8px;
        background: #28466b;
        color: #fff;
        border: 0;
        border-radius: 5px;
        padding: 8px;
      }
      .ov {
        position: absolute;
        inset: 0;
        background: rgba(245, 245, 240, 0.5);
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding-top: 18px;
      }
      .ov span {
        background: var(--ink);
        color: #fff;
        font-size: 13px;
        padding: 5px 12px;
        border-radius: 14px;
        margin: 0 12px;
        text-align: center;
      }
      .sess {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .sess button {
        border: 1px solid var(--ln);
        background: #fff;
        border-radius: 8px;
        padding: 7px 10px;
        text-align: left;
        font-size: 13px;
        line-height: 1.35;
      }
      .sess button[aria-current] {
        border-color: var(--g);
        background: var(--gl);
      }
      textarea,
      input[type="search"],
      input[type="text"],
      select {
        width: 100%;
        border: 1px solid #cfd0c4;
        border-radius: 7px;
        padding: 7px 9px;
        background: #fff;
      }
      textarea {
        min-height: 70px;
        resize: vertical;
        margin: 2px 0 8px;
      }
      .lgrid {
        display: grid;
        grid-template-columns: 330px minmax(0, 1fr);
        gap: 20px;
        align-items: start;
      }
      .llist {
        list-style: none;
        padding: 0;
        margin: 10px 0 0;
      }
      .llist button {
        display: block;
        width: 100%;
        text-align: left;
        background: var(--cd);
        border: 1px solid var(--ln);
        border-radius: 8px;
        padding: 9px 12px;
        margin-bottom: 6px;
        font-size: 14px;
        line-height: 1.4;
      }
      .llist button[aria-current] {
        border-color: var(--g);
        background: var(--gl);
      }
      .pdfph {
        border: 1px dashed #b9bcae;
        border-radius: 8px;
        background: #fff;
        padding: 16px;
        margin-top: 12px;
      }
      .sgrid {
        display: grid;
        grid-template-columns: 190px minmax(0, 1fr);
        gap: 20px;
        align-items: start;
      }
      .stabs {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .stabs button {
        border: 1px solid transparent;
        background: none;
        border-radius: 7px;
        padding: 7px 12px;
        text-align: left;
        font-size: 14px;
      }
      .stabs button[aria-current] {
        background: #fff;
        border-color: var(--ln);
        font-weight: 600;
      }
      .srow {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px 12px;
        padding: 10px 0;
        border-top: 1px solid var(--ln);
      }
      .srow > div {
        flex: 1 1 220px;
        min-width: 0;
      }
      .sw {
        flex: none;
        width: 38px;
        height: 22px;
        border-radius: 11px;
        border: 0;
        background: #c5c8bc;
        position: relative;
      }
      .sw:after {
        content: "";
        position: absolute;
        top: 3px;
        left: 3px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #fff;
        transition: left 0.15s;
      }
      .sw[aria-pressed="true"] {
        background: var(--g);
      }
      .sw[aria-pressed="true"]:after {
        left: 19px;
      }
      dialog {
        border: 1px solid var(--ln);
        border-radius: 12px;
        padding: 20px 22px;
        width: min(440px, calc(100vw - 32px));
        background: var(--cd);
        color: var(--ink);
      }
      dialog::backdrop {
        background: rgba(38, 59, 51, 0.35);
      }
      dialog h2 {
        font-size: 16px;
        color: var(--ink);
        margin-bottom: 12px;
      }
      dialog label {
        display: block;
        font-size: 13px;
        margin-bottom: 12px;
      }
      dialog label > * {
        margin-top: 4px;
      }
      .err {
        color: #8a3527;
        font-size: 13px;
      }
      .err:empty {
        display: none;
      }
      #toast {
        position: fixed;
        left: 50%;
        bottom: 22px;
        transform: translate(-50%, 20px);
        max-width: calc(100vw - 32px);
        background: var(--ink);
        color: #fff;
        padding: 9px 16px;
        border-radius: 9px;
        font-size: 13px;
        opacity: 0;
        pointer-events: none;
        transition: 0.2s;
        z-index: 30;
      }
      #toast.on {
        opacity: 1;
        transform: translate(-50%, 0);
      }
      @media (max-width: 980px) {
        .cols,
        .dgrid,
        .bgrid,
        .lgrid,
        .sgrid {
          grid-template-columns: minmax(0, 1fr);
        }
        .trow {
          grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        }
      }
      @media (max-width: 600px) {
        .top {
          padding: 8px 14px;
          gap: 8px;
        }
        .tools {
          margin-left: 0;
        }
        main {
          padding: 14px 14px 60px;
        }
        .trow {
          grid-template-columns: minmax(0, 1fr);
        }
        .pin {
          grid-template-columns: minmax(0, 1fr);
          padding: 16px;
          min-height: 0;
        }
        .pin h3 {
          font-size: 19px;
        }
        .hm {
          display: none;
        }
        .stabs {
          flex-direction: row;
          flex-wrap: wrap;
        }
        .ban {
          padding: 8px 14px;
        }
      }
    </style>
  </head>
  <body>
    <a class="skip" href="#main">跳到主要内容</a>
    <header class="top">
      <div class="brand">
        <span class="mark" aria-hidden="true"></span><b>sci retriever</b
        ><span class="tag">合成示例原型</span>
      </div>
      <nav aria-label="主导航">
        <button data-go="home">工作台</button
        ><button data-go="tasks">任务</button
        ><button data-go="lib">文献库</button
        ><button data-go="set">设置</button>
      </nav>
      <div class="tools">
        <div class="seg" role="group" aria-label="评审状态模拟">
          <span>评审</span><button data-act="mode" data-m="run">运行</button
          ><button data-act="mode" data-m="ok">正常无需协助</button
          ><button data-act="mode" data-m="off">断连</button>
        </div>
        <button class="btn pri" data-act="new">新建任务</button>
      </div>
    </header>
    <div class="ban" id="ban" role="status"></div>
    <main id="main" tabindex="-1"></main>
    <dialog id="dlgNew" aria-labelledby="nh">
      <form id="fNew" novalidate>
        <h2 id="nh">新建任务</h2>
        <label
          >名称<input
            type="text"
            name="nm"
            maxlength="60"
            placeholder="例如：有机光催化 · 发现文献"
        /></label>
        <label
          >操作类型<select name="op">
            <option>发现文献</option>
            <option>获取 PDF</option>
            <option>解析已有材料</option>
            <option>分析已有材料</option>
          </select></label
        >
        <label
          >范围（示例）<select name="sc">
            <option value="lib">文献库中的 4 篇合成示例文章</option>
            <option value="q">示例检索式“C–H activation”的 24 篇</option>
            <option value="one">选中的 1 篇：Flow chemistry approaches…</option>
          </select></label
        >
        <p class="sub">
          每种操作独立发起，完成后不会自动开始下一阶段。任务仅保存在本页内存，刷新后重置。
        </p>
        <p class="err" id="nErr" role="alert"></p>
        <div class="acts" style="justify-content: flex-end">
          <button type="button" class="btn" data-close>取消</button
          ><button type="submit" class="btn pri net">提交任务</button>
        </div>
      </form>
    </dialog>
    <dialog id="dlgC" aria-labelledby="chd">
      <h2 id="chd">取消本任务？</h2>
      <p id="cTxt"></p>
      <p class="err" role="alert"></p>
      <div class="acts" style="justify-content: flex-end">
        <button class="btn" data-close>保留任务</button
        ><button class="btn dng net" data-act="cok">确认取消</button>
      </div>
    </dialog>
    <div id="toast" role="status" aria-live="polite"></div>
    <script>
      const $ = (s) => document.querySelector(s),
        E = (s) =>

            ["同时会话上限", "2（示例）"],
          ],
          "接管和指导只作用于当前会话绑定的文章。",
        ],
        prs: [
          "解析",
          [
            ["MinerU 解析服务", "由运维方管理 · 未接入（示例）"],
            ["输出", "可读文档与证据定位（示例）"],
          ],
          "解析需单独发起，下载完成后不会自动开始。",
          1,
        ],
        agt: [
          "Agent 接入",
          [
            ["CLI / MCP 接入", "示例 · 未接入"],
            ["访问令牌", "原型不生成、不显示令牌"],
            ["与人类共享文献库", "固定原则：Agent 与你读取同一份知识事实"],
          ],
          "",
        ],
      };
      function vSet() {
        const p = SET[S.st];
        return `<div class="phead"><h1 tabindex="-1">设置</h1><span class="sub">示例配置 · 修改只保存在本页内存</span></div><div class="sgrid"><div class="stabs" role="group" aria-label="设置分组">${Object.keys(
          SET,
        )
          .map(
            (k) =>
              `<button data-act="stab" data-k="${k}" ${k === S.st ? 'aria-current="true"' : ""}>${SET[k][0]}</button>`,
          )
          .join("")}</div>
<section class="card" aria-labelledby="sh"><h2 id="sh">${p[0]}</h2>${p[1].map((r) => `<div class="srow"><div><b>${r[0]}</b><span class="lbl">${E(r[1])}${r[2] ? ` · ${S.sw[r[2]] ? "已开启" : "已关闭"}` : ""}</span></div>${r[2] ? `<button class="sw net" data-act="sw" data-k="${r[2]}" aria-pressed="${!!S.sw[r[2]]}" aria-label="${r[0]}"></button>` : ch("q", r[1].includes("未接入") ? "未接入" : "只读")}</div>`).join("")}${p[2] ? `<p class="sub" style="margin-top:8px">${p[2]}</p>` : ""}${p[3] ? '<button class="btn" data-act="test">测试连接</button>' : ""}</section></div>`;
      }
      const V = {
        home: vHome,
        tasks: vTasks,
        task: vTask,
        br: vBr,
        lib: vLib,
        set: vSet,
      };
      function render(f) {
        $("#main").innerHTML = V[S.v]();
        const nv = { task: "tasks", br: "tasks" }[S.v] || S.v;
        document
          .querySelectorAll("nav button")
          .forEach((b) =>
            b.dataset.go === nv
              ? b.setAttribute("aria-current", "page")
              : b.removeAttribute("aria-current"),
          );
        document
          .querySelectorAll(".seg button")
          .forEach((b) => b.setAttribute("aria-pressed", b.dataset.m === S.m));
        document
          .querySelectorAll(".net")
          .forEach((b) =>
            S.m === "off"
              ? b.setAttribute("aria-disabled", "true")
              : b.removeAttribute("aria-disabled"),
          );
        $("#ban").textContent =
          S.m === "off"
            ? "连接已断开（模拟）· 显示 10:42 最后同步的结果。提交、取消、接管、指导、下载和设置修改都不会执行。"
            : "";
        if (f !== 0) {
          const el = $(f || "main h1");
          if (el) el.focus();
          if (!f) scrollTo(0, 0);
        }
      }
      function go(v, t, a) {
        if (t) S.t = t;
        if (v === "art") {
          v = "task";
          S.a = a;
        } else if (v === "task") S.a = null;
        if (v === "br") S.a = a;
        if (v === "lib" && a) S.la = a;
        S.v = v;
        render(v === "task" && S.a ? "#adh" : undefined);
      }
      let tt, lf;
      function toast(m) {
        const el = $("#toast");
        el.textContent = m;
        el.classList.add("on");
        clearTimeout(tt);
        tt = setTimeout(() => el.classList.remove("on"), 3400);
      }
      function openD(d) {
        lf = document.activeElement;
        d.querySelectorAll(".err").forEach((e) => (e.textContent = ""));
        d.showModal();
      }
      document.querySelectorAll("dialog").forEach((d) =>
        d.addEventListener("close", () => {
          const el = lf && lf.isConnected ? lf : $("main h1");
          el && el.focus();
        }),
      );
      const ACT = {
        new: () => openD($("#dlgNew")),
        sel: (b) => {
          S.a = b.dataset.a;
          render("#adh");
        },
        cancel: () => {
          const t = tk(S.t);
          $("#cTxt").textContent =
            `将停止「${t.n}」中处理中和排队中的部分。已保存的 ${t.c ? t.c.s : t.done} 项结果保留，可在文献库继续查看。`;
          openD($("#dlgC"));
        },
        cok: () => {
          const t = tk(S.t);
          t.st = "cancel";
          t.rows.forEach((r) => {
            if ("pqh".includes(r[1])) {
              r[1] = "x";
              r[2] = "随任务取消而停止";
            }
          });
          if (t.c) {
            t.c.x = t.c.p + t.c.q + t.c.h;
            t.c.p = t.c.q = t.c.h = 0;
          }
          t.log.push([now(), "取消", "由你取消；已保存结果保留"]);
          $("#dlgC").close();
          render();
          toast(`已取消「${t.n}」。已保存结果保留，可在文献库查看。`);
        },
        sess: (b) => {
          S.a = b.dataset.a;
          render(".sess [aria-current]");
        },
        take: () => {
          const s = SS[S.a];
          s.ctl = "me";
          s.log.push([now(), "你", "接管页面（模拟）"]);
          render(".bside .btn");
          toast(
            `已接管「${sh(S.a)}」的页面。Agent 在这一篇上暂停，其他会话不受影响。`,
          );
        },
        give: () => {
          const s = SS[S.a];
          s.ctl = "ag";
          s.log.push([now(), "你", "交还 Agent（模拟）"]);
          s.log.push([now(), "Agent", "重新观察当前页面（模拟）"]);
          render(".bside .btn");
          toast(`已把「${sh(S.a)}」交还 Agent。`);
        },
        send: () => {
          const id = S.a,
            s = SS[id],
            v = s.d.trim();
          if (!v) {
            toast("请先输入指导内容。");
            $("#gd").focus();
            return;
          }
          s.log.push([now(), "你", v]);
          s.d = "";
          render("#gd");
          toast(`指导已送达「${sh(id)}」的会话（模拟）。`);
          setTimeout(() => {
            s.log.push([
              now(),
              "Agent",
              tk("t1").st === "cancel"
                ? "任务已取消，这条指导已过期。"
                : "收到（模拟）：只在这一篇文章的页面上执行。",
            ]);
            if (S.v === "br" && S.a === id) $("#slog").innerHTML = lg(s.log);
          }, 1300);
        },
        dl: () => {
          const id = S.a,
            a = A[id],
            t = tk(S.t),
            r = t.rows.find((x) => x[0] === id);
          if (a.pdf) {
            toast("PDF 已在库中；已入库文件不会被覆盖。");
            return;
          }
          a.pdf = a.sim = 1;
          if (r[1] !== "s" && t.c[r[1]] != null) {
            t.c[r[1]]--;
            t.c.s++;
          }
          r[1] = "s";
          r[2] = "PDF 已保存（模拟入库）· sha256 7c1e…（合成）";
          SS[id].log.push([
            now(),
            "你",
            "点击 Download PDF，文件已入库（模拟）",
          ]);
          t.log.push([now(), "入库", sh(id) + " PDF 已保存（模拟）"]);
          render(".bside .btn");
          toast("PDF 已入库（模拟）：未访问真实站点，也没有真实文件。");
        },
        pick: (b) => {
          S.la = b.dataset.a;
          render("#rh");
        },
        stab: (b) => {
          S.st = b.dataset.k;
          render(".stabs [aria-current]");
        },
        sw: (b) => {
          const k = b.dataset.k;
          S.sw[k] = !S.sw[k];
          render(`.sw[data-k="${k}"]`);
          toast(
            `${b.getAttribute("aria-label")}：已${S.sw[k] ? "开启" : "关闭"}（仅本页内存，未写入配置）`,
          );
        },
        test: () => toast("原型不连接外部服务，状态保持“未接入”。"),
        mode: (b) => {
          S.m = b.dataset.m;
          document.body.classList.toggle("off", S.m === "off");
          render(0);
          toast(
            {
              run: "评审：运行中。",
              ok: "评审：正常运行，无需协助。",
              off: "评审：已断连。已有结果仍可查看，提交与控制不会执行。",
            }[S.m],
          );
        },
      };
      document.addEventListener("click", (e) => {
        const b = e.target.closest("[data-go],[data-act],[data-close]");
        if (!b) return;
        if (b.disabled) return;
        if (
          ["take", "give", "send", "dl"].includes(b.dataset.act) &&
          tk(S.t).st === "cancel"
        ) {
          toast("当前任务已取消，不能继续控制会话。");
          return;
        }
        if (b.hasAttribute("data-close")) return b.closest("dialog").close();
        if (b.dataset.go) return go(b.dataset.go, b.dataset.t, b.dataset.a);
        if (S.m === "off" && b.classList.contains("net")) {
          const d = b.closest("dialog"),
            er = d && d.querySelector(".err");
          if (er) er.textContent = "连接已断开：请求未发送，任务状态不变。";
          else toast("连接已断开：操作未执行。已有结果仍可查看。");
          return;
        }
        ACT[b.dataset.act](b);
      });
      document.addEventListener("input", (e) => {
        const x = e.target;
        if (x.id === "q") {
          S.q = x.value;
          $("#ll").innerHTML = libList();
        } else if (x.id === "gd") SS[x.dataset.a].d = x.value;
      });
      $("#fNew").addEventListener("submit", (e) => {
        e.preventDefault();
        const f = e.target,
          er = $("#nErr");
        if (S.m === "off") {
          er.textContent = "连接已断开：任务未提交。恢复连接后重试。";
          return;
        }
        const n = f.nm.value.trim();
        if (!n) {
          er.textContent = "请填写任务名称。";
          f.nm.focus();
          return;
        }
        const op = f.op.value,
          sc = f.sc.selectedOptions[0].text;
        T.push({
          id: "u" + T.length,
          n,
          goal: `${op} · ${sc}`,
          st: "queue",
          tot: { lib: 4, q: 24, one: 1 }[f.sc.value],
          done: 0,
          step: "排队中，等待开始",
          scope: `范围：${sc}（示例）。只执行「${op}」，完成后不会自动开始下一阶段。`,
          log: [[now(), "创建", "由你手动提交（仅内存，刷新后重置）"]],
          rows: [],
        });
        render(0);
        $("#dlgNew").close();
        f.reset();
        toast(`已提交「${n}」，排队中（仅内存，刷新后重置）。`);
      });
      render(0);
    </script>
  </body>
</html>
