<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>SciRetriever 库界面原型</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Noto+Serif+SC:wght@600&display=swap">
<style>
/* 设计规范
   主题：科研文献库。一切结论都能回到原文证据。
   颜色：白纸 #ffffff、侧栏 #f4f5f3、墨黑 #1d2125、墨蓝 #2f4ba8（主操作）、荧光笔黄 #fbe7a1（只用于证据与高亮）。
   字体：文献标题、页面标题、正文阅读用 Source Serif 4 / 思源宋体；界面用 Source Sans 3。
   版式：侧边导航树 + 标签栏 + 页面；文献信息按参考文献格式排版（作者，期刊斜体，年份），不用中点拼接。
   原则：唯一的大胆之处是"证据荧光笔"，其余保持安静。 */
:root{
  --bg:#ffffff; --side:#f4f5f3; --fg:#1d2125; --fg2:#5f6670; --fg3:#959ba3;
  --line:rgba(29,33,37,.09); --line2:rgba(29,33,37,.17); --hover:rgba(29,33,37,.05); --sel:rgba(47,75,168,.09); --sel-line:rgba(47,75,168,.45);
  --blue:#2f4ba8; --blue-fg:#ffffff; --callout:#f4f5f3; --pdfbg:#eceeeb; --hl:rgba(247,205,40,.42); --mark:#fbe7a1; --mark-fg:#5a4505;
  --t-gray-bg:#e3e2e0; --t-gray:#5a5955; --t-brown-bg:#eee0da; --t-brown:#64473a;
  --t-yellow-bg:#fdecc8; --t-yellow:#89632a; --t-blue-bg:#d3e5ef; --t-blue:#28456c;
  --t-green-bg:#dbeddb; --t-green:#2b593f; --t-red-bg:#ffe2dd; --t-red:#a03a33; --t-purple-bg:#e8deee; --t-purple:#492f64;
  --c-green:#448361; --c-red:#d44c47; --c-blue:#337ea9; --c-yellow:#cb912f; --c-gray:#9b9a97; --c-purple:#9065b0;
  --shadow:rgba(15,15,15,.05) 0 0 0 1px, rgba(15,15,15,.1) 0 3px 6px, rgba(15,15,15,.2) 0 9px 24px;
  --sans:"Source Sans 3",-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --mono:"SFMono-Regular",Menlo,Consolas,"PT Mono","Liberation Mono",Courier,monospace;
  --serif:"Source Serif 4","Noto Serif SC","Songti SC",Georgia,serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17191c; --side:#1d2024; --fg:#e3e5e8; --fg2:#9aa1a9; --fg3:#6b727a;
  --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.16); --hover:rgba(255,255,255,.05); --sel:rgba(142,162,240,.16); --sel-line:rgba(142,162,240,.55);
  --blue:#8ea2f0; --blue-fg:#11141b; --callout:#1f2226; --pdfbg:#111315; --hl:rgba(247,205,40,.32); --mark:rgba(247,213,71,.22); --mark-fg:#f3df8a;
  --t-gray-bg:#373737; --t-gray:rgba(255,255,255,.81); --t-brown-bg:#4a3228; --t-brown:#e3c6b8;
  --t-yellow-bg:#59482a; --t-yellow:#f2d79e; --t-blue-bg:#28456c; --t-blue:#cfe3f5;
  --t-green-bg:#2b593f; --t-green:#cfe8d6; --t-red-bg:#6e3630; --t-red:#ffd5cf; --t-purple-bg:#492f64; --t-purple:#e5d6f2;
  --c-green:#529e72; --c-red:#e16f64; --c-blue:#5e9fd0; --c-yellow:#d6a346; --c-gray:#7f7f7f; --c-purple:#a782c3;
  --shadow:rgba(15,15,15,.1) 0 0 0 1px, rgba(15,15,15,.2) 0 3px 6px, rgba(15,15,15,.4) 0 9px 24px; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#17191c; --side:#1d2024; --fg:#e3e5e8; --fg2:#9aa1a9; --fg3:#6b727a;
  --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.16); --hover:rgba(255,255,255,.05); --sel:rgba(142,162,240,.16); --sel-line:rgba(142,162,240,.55);
  --blue:#8ea2f0; --blue-fg:#11141b; --callout:#1f2226; --pdfbg:#111315; --hl:rgba(247,205,40,.32); --mark:rgba(247,213,71,.22); --mark-fg:#f3df8a;
  --t-gray-bg:#373737; --t-gray:rgba(255,255,255,.81); --t-brown-bg:#4a3228; --t-brown:#e3c6b8;
  --t-yellow-bg:#59482a; --t-yellow:#f2d79e; --t-blue-bg:#28456c; --t-blue:#cfe3f5;
  --t-green-bg:#2b593f; --t-green:#cfe8d6; --t-red-bg:#6e3630; --t-red:#ffd5cf; --t-purple-bg:#492f64; --t-purple:#e5d6f2;
  --c-green:#529e72; --c-red:#e16f64; --c-blue:#5e9fd0; --c-yellow:#d6a346; --c-gray:#7f7f7f; --c-purple:#a782c3;
  --shadow:rgba(15,15,15,.1) 0 0 0 1px, rgba(15,15,15,.2) 0 3px 6px, rgba(15,15,15,.4) 0 9px 24px; color-scheme:dark;
}
/* 图表 tokens：单系列用 --s1；分类色按固定顺序 --cat1..5（已通过配色校验）；网格与坐标轴保持弱化 */
:root{--s1:#3b57b8;--cat1:#2a78d6;--cat2:#eb6834;--cat3:#1baf7a;--cat4:#eda100;--cat5:#e87ba4;--cat0:#a5a29b;--grid:#ecebe8;--axis:#d3d1cb}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--s1:#8ea2f0;--cat1:#3987e5;--cat2:#d95926;--cat3:#199e70;--cat4:#c98500;--cat5:#d55181;--cat0:#6b6b68;--grid:#2c2c2a;--axis:#383835}}
:root[data-theme="dark"]{--s1:#8ea2f0;--cat1:#3987e5;--cat2:#d95926;--cat3:#199e70;--cat4:#c98500;--cat5:#d55181;--cat0:#6b6b68;--grid:#2c2c2a;--axis:#383835}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14.5px;line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sel-line);outline-offset:1px}
.mono{font-variant-numeric:tabular-nums;letter-spacing:.01em}
.code-id{font-family:var(--mono);font-size:12.5px}
.f2{color:var(--fg2)} .f3{color:var(--fg3)}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
svg.i.s{width:14px;height:14px}

.app{height:100%;display:grid;grid-template-columns:240px minmax(0,1fr)}

/* 侧边栏 */
.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;font-size:14px;color:var(--fg2)}
.ws{display:flex;align-items:center;gap:8px;padding:12px 12px 6px 14px;color:var(--fg);font-weight:600}
.ws{font-family:var(--serif);font-size:16px;letter-spacing:-.005em}
.ws .logo{width:22px;height:22px;border-radius:3px;background:var(--mark);color:var(--mark-fg);display:grid;place-items:center;font-size:14px;font-weight:600;transform:rotate(-4deg)}
.ws small{font-weight:400;color:var(--fg3);font-size:11.5px;margin-left:auto}
.sscroll{flex:1;overflow:auto;padding:4px 6px 10px}
.si{display:flex;align-items:center;gap:8px;width:100%;min-height:30px;padding:3px 8px;border:0;background:none;border-radius:6px;text-align:left;color:var(--fg2);font-weight:500}
.si:hover{background:var(--hover)}
.si.on{background:var(--hover);color:var(--fg)}
.si .lb{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.si .ct{font-size:12px;color:var(--fg3);font-weight:400;font-variant-numeric:tabular-nums}
.si .car{width:16px;height:16px;display:grid;place-items:center;color:var(--fg3);border-radius:3px;margin-left:-4px;transition:transform .15s}
.si .car.open{transform:rotate(90deg)}
.si .live{width:7px;height:7px;border-radius:50%;background:var(--c-blue)}
.kids{padding-left:18px}
.kids .si{font-weight:400;min-height:28px}
.kh{font-size:11.5px;color:var(--fg3);padding:8px 8px 2px;font-weight:500}
.sgap{height:12px}
.sfoot{padding:6px;border-top:1px solid var(--line)}

/* 主区 */
.main{display:grid;grid-template-rows:40px minmax(0,1fr);min-width:0;min-height:0}
.tbar{display:flex;align-items:center;gap:6px;padding:0 10px;border-bottom:1px solid var(--line);min-width:0}
.menu{display:none}
.tabs{display:flex;gap:2px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none;height:100%;align-items:center}
.tab{display:flex;align-items:center;gap:6px;height:28px;padding:0 8px 0 10px;border:0;background:none;border-radius:6px;color:var(--fg2);white-space:nowrap;max-width:220px;font-size:13.5px}
.tab span{overflow:hidden;text-overflow:ellipsis}
.tab:hover{background:var(--hover)}
.tab.on{background:var(--hover);color:var(--fg)}
.tab .x{width:18px;height:18px;display:inline-grid;place-items:center;border-radius:4px;color:var(--fg3);font-size:11px}
.tab .x:hover{background:var(--hover);color:var(--fg)}
.btn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border:1px solid var(--line2);background:var(--bg);border-radius:6px;white-space:nowrap;font-size:13.5px;color:var(--fg)}
.btn:hover{background:var(--hover)}
.btn.blue{background:var(--blue);border-color:var(--blue);color:var(--blue-fg);font-weight:500}
.btn.blue:hover{filter:brightness(.94)}
.btn.q{border-color:transparent;background:none;color:var(--fg2)}
.btn.q:hover{background:var(--hover);color:var(--fg)}
.btn.sm{height:24px;padding:0 7px;font-size:12.5px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.actpill{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border:0;border-radius:6px;background:none;color:var(--fg2);font-size:13px;white-space:nowrap}
.actpill:hover{background:var(--hover)}
.actpill .d{width:7px;height:7px;border-radius:50%;background:var(--c-blue);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
.view{min-height:0;min-width:0;height:100%}

/* 页面 */
.pg{height:100%;overflow:auto}
.pgin{padding:28px 48px 60px}
.crumb{font-size:13px;color:var(--fg2);display:flex;gap:6px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.crumb button{border:0;background:none;color:var(--fg2);padding:1px 4px;border-radius:4px}
.crumb button:hover{background:var(--hover)}
.ptitle{font-family:var(--serif);font-size:34px;font-weight:600;line-height:1.2;margin:0 0 8px;letter-spacing:-.005em;text-wrap:balance}
.pdesc{color:var(--fg2);margin:0 0 18px;max-width:44em}
.vtabs{display:flex;align-items:center;gap:4px;margin-bottom:14px;flex-wrap:wrap}
.vt{border:0;background:none;height:28px;padding:0 10px;color:var(--fg2);white-space:nowrap;font-size:13.5px;border-radius:14px}
.vt:hover{background:var(--hover);color:var(--fg)}
.vt.on{color:var(--fg);background:var(--hover);font-weight:500;box-shadow:inset 0 0 0 1px var(--line2)}
.ctabs .vt{border-radius:6px}
.vtools{margin-left:auto;display:flex;align-items:center;gap:4px;padding:3px 0;flex-wrap:wrap}
.tsearch{display:flex;align-items:center;gap:4px;height:28px;padding:0 6px;border-radius:6px;color:var(--fg2)}
.tsearch input{border:0;outline:0;background:none;width:150px;font-size:13.5px}
.tsel{height:28px;border:0;background:none;color:var(--fg2);border-radius:6px;padding:0 4px;font-size:13.5px}
.tsel:hover{background:var(--hover)}
.tsel.set{color:var(--blue)}
.callout{display:flex;gap:10px;background:var(--callout);border-radius:6px;padding:12px 14px;font-size:13.5px;color:var(--fg);margin:12px 0}
.callout .ci{flex:none;color:var(--fg2);margin-top:1px}
h3.h{font-family:var(--serif);font-size:19px;font-weight:600;margin:28px 0 8px}
h4.h{font-size:15px;font-weight:600;margin:20px 0 6px}

/* 通用表格（记录类）：无竖线、轻表头，悬停只改背景 */
.tw{overflow-x:auto;margin:0 -4px;padding:0 4px}
table.nt{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.nt th{text-align:left;font-weight:500;color:var(--fg3);font-size:12px;padding:0 10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.nt td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
.nt tr.r{cursor:pointer}
.nt tr.r:hover td{background:var(--hover)}
.nt tr.r.on td{background:var(--sel)}
input[type=checkbox]{accent-color:var(--blue);width:14px;height:14px;margin:0}

/* 文献列表：固定行结构；悬停只改背景和透明度，不改尺寸 */
.lhead{display:grid;grid-template-columns:28px minmax(0,1fr) auto;align-items:center;gap:10px;padding:0 10px 8px;color:var(--fg3);font-size:12.5px}
.lhead .sort{display:flex;align-items:center;gap:4px}
.plist{display:flex;flex-direction:column;gap:2px}
.prow{display:grid;grid-template-columns:28px minmax(0,1fr) 104px 28px;align-items:center;gap:10px;padding:10px;border-radius:8px;position:relative;cursor:pointer;transition:background .12s}
.prow::after{content:"";position:absolute;left:48px;right:10px;bottom:-1px;height:1px;background:var(--line)}
.prow:last-child::after{display:none}
.prow:hover{background:var(--hover)}
.prow:hover::after,.prow.on::after{opacity:0}
.prow.on{background:var(--sel)}
.prow.drop{background:var(--sel);box-shadow:inset 0 0 0 1.5px var(--sel-line)}
.prow .ck{display:grid;place-items:center;opacity:0;transition:opacity .12s}
.prow:hover .ck,.prow .ck.on,.plist.selecting .ck{opacity:1}
.prow .pt{font-family:var(--serif);font-size:16px;font-weight:600;letter-spacing:-.003em;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-wrap:pretty}
.prow .pm{font-size:13.5px;color:var(--fg2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .pm .yr{font-variant-numeric:tabular-nums}
.jn{font-family:var(--serif);font-style:italic}
.cites{color:var(--fg3);margin-left:12px;font-variant-numeric:tabular-nums}
.prow .st{justify-self:end}
.prow .pv{width:28px;height:28px;display:grid;place-items:center;border:0;border-radius:6px;background:none;color:var(--fg2);opacity:0;transition:opacity .12s}
.prow:hover .pv,.prow.on .pv{opacity:1}
.prow .pv:hover{background:var(--hover);color:var(--fg)}
.cnt{color:var(--fg3);font-size:12.5px;padding:12px 10px}

/* 标签 */
.tag{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 6px;border-radius:3px;font-size:12.5px;line-height:1;white-space:nowrap;background:var(--t-gray-bg);color:var(--t-gray)}
.tag .dt{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.7}
.tag.gray{background:var(--t-gray-bg);color:var(--t-gray)} .tag.brown{background:var(--t-brown-bg);color:var(--t-brown)}
.tag.yellow{background:var(--t-yellow-bg);color:var(--t-yellow)} .tag.blue{background:var(--t-blue-bg);color:var(--t-blue)}
.tag.green{background:var(--t-green-bg);color:var(--t-green)} .tag.red{background:var(--t-red-bg);color:var(--t-red)}
.tag.purple{background:var(--t-purple-bg);color:var(--t-purple)}
.tag.run .dt{animation:pulse 1.4s ease-in-out infinite;opacity:1}

/* 浮动选择条 */
.selbar{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);display:flex;align-items:center;gap:2px;background:var(--bg);box-shadow:var(--shadow);border-radius:8px;padding:4px;z-index:10;max-width:calc(100% - 32px);overflow-x:auto}
.selbar b{font-weight:500;color:var(--blue);padding:0 10px;white-space:nowrap;font-size:13.5px}
.selbar .sep{width:1px;height:18px;background:var(--line2);margin:0 4px;flex:none}

/* 侧边预览 / 属性 */
.libwrap{display:grid;grid-template-columns:minmax(0,1fr);height:100%;position:relative}
.libwrap.peek{grid-template-columns:minmax(0,1fr) 420px}
.peekp{border-left:1px solid var(--line);overflow:auto;background:var(--bg);box-shadow:-6px 0 18px -14px rgba(0,0,0,.3)}
.peekbar{display:flex;align-items:center;gap:4px;padding:8px 10px;position:sticky;top:0;background:var(--bg);z-index:2}
.peekin{padding:6px 28px 40px}
.peekin h2{font-family:var(--serif);font-size:23px;font-weight:600;line-height:1.3;margin:6px 0 14px;text-wrap:balance}
.props{display:grid;grid-template-columns:120px minmax(0,1fr);row-gap:2px;font-size:13.5px}
.props .k{display:flex;align-items:center;gap:6px;color:var(--fg2);min-height:30px;padding:4px 0}
.props .v{min-height:30px;padding:5px 6px;border-radius:4px;min-width:0;overflow-wrap:anywhere}
.props .v:hover{background:var(--hover)}
.hr{height:1px;background:var(--line);margin:16px 0}
.summ{font-family:var(--serif);font-size:15px;line-height:1.75}
.ev{display:inline-flex;align-items:center;height:20px;padding:0 6px;border-radius:2px 5px 3px 4px;border:0;background:var(--mark);color:var(--mark-fg);font-family:var(--sans);font-size:12px;font-weight:500;font-variant-numeric:tabular-nums;margin:0 2px;vertical-align:1px;cursor:pointer;transition:box-shadow .12s}
.ev:hover{box-shadow:0 0 0 1.5px var(--mark-fg)}
.lk{border:0;background:none;padding:0;color:var(--fg);text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:3px;cursor:pointer;text-align:left;font-size:inherit}
.lk:hover{text-decoration-color:var(--fg)}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
details.tg{margin:6px 0}
details.tg summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:6px;padding:4px 2px;border-radius:4px;font-weight:500}
details.tg summary::-webkit-details-marker{display:none}
details.tg summary::before{content:"";width:0;height:0;border-left:5px solid var(--fg2);border-top:4px solid transparent;border-bottom:4px solid transparent;transition:transform .15s}
details.tg[open] summary::before{transform:rotate(90deg)}
details.tg summary:hover{background:var(--hover)}
details.tg .tgb{padding:4px 0 4px 16px;font-size:13.5px}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:12px 1fr;gap:8px;padding:3px 0;font-size:13px}
.tl li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--fg3);margin-top:7px}

/* 阅读页 */
.reader{display:grid;grid-template-columns:minmax(0,1fr) 340px;height:100%}
.viewer{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--pdfbg)}
.vbar{display:flex;align-items:center;gap:6px;padding:6px 12px;border-bottom:1px solid var(--line);background:var(--bg);font-size:13px;color:var(--fg2);flex-wrap:wrap}
.vbar .sp{flex:1}
.vscroll{flex:1;overflow:auto;padding:22px 18px 40px}
.pdfpage{width:min(720px,100%);aspect-ratio:1/1.414;margin:0 auto 18px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12),0 4px 14px rgba(0,0,0,.06);position:relative;color:#222;font-family:var(--serif);padding:6.5% 7.5%;overflow:hidden}
.pdfpage .hd{font-family:var(--sans);font-size:10px;color:#777;display:flex;justify-content:space-between;border-bottom:1px solid #ddd;padding-bottom:4px;margin-bottom:14px}
.pdfpage h1{font-size:20px;line-height:1.25;margin:0 0 8px;font-weight:700}
.pdfpage .au{font-size:12px;color:#444;margin-bottom:12px}
.pdfpage .abs{background:#f4f4f2;padding:10px 12px;font-size:11px;line-height:1.55;margin-bottom:14px}
.pdfpage .abs b{font-family:var(--sans);font-size:10px;letter-spacing:.06em}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}

const STATUS_C=['var(--c-gray)','var(--c-yellow)','var(--c-blue)','var(--c-green)'];
const statusKey=p=>p.failed?['无法获取','var(--c-red)']:p.running?['处理中','var(--c-purple)']:[['仅元数据','有 PDF','已解析','已分析'][p.stage],STATUS_C[p.stage]];
function colorOf(p){
  if(S.mapColor==='batch'){const i=batches.findIndex(b=>b.id===p.batch);return['var(--cat'+(i+1)+')',batches[i].name]}
  if(S.mapColor==='status'){const [l,c]=statusKey(p);return[c,l]}
  const top=allTags().slice(0,4).map(x=>x[0]);const t=tagsOf(p).find(x=>top.includes(x));
  return t?['var(--cat'+(top.indexOf(t)+1)+')',t]:['var(--cat0)','其他'];
}
function legendItems(ps){
  const seen=new Map();ps.forEach(p=>{const [c,l]=colorOf(p);if(!seen.has(l))seen.set(l,c)});
  let order=[...seen.entries()];
  if(S.mapColor==='batch')order.sort((a,b)=>batches.findIndex(x=>x.name===a[0])-batches.findIndex(x=>x.name===b[0]));
  if(S.mapColor==='tag'){const top=allTags().slice(0,4).map(x=>x[0]);const k=l=>{const i=top.indexOf(l);return i<0?99:i};order.sort((a,b)=>k(a[0])-k(b[0]))}
  return order;
}
let netCache=null;
function netLayout(){
  if(netCache)return netCache;
  const ids=papers.map(p=>p.id),pos={};
  ids.forEach((id,i)=>{const a=i/ids.length*Math.PI*2;pos[id]={x:Math.cos(a)*120,y:Math.sin(a)*120,vx:0,vy:0}});
  for(let it=0;it<400;it++){
    ids.forEach(a=>ids.forEach(b=>{if(a>=b)return;const dx=pos[a].x-pos[b].x,dy=pos[a].y-pos[b].y,d2=Math.max(dx*dx+dy*dy,25),f=2600/d2,d=Math.sqrt(d2);
      pos[a].vx+=f*dx/d;pos[a].vy+=f*dy/d;pos[b].vx-=f*dx/d;pos[b].vy-=f*dy/d}));
    EDGES.forEach(([a,b])=>{const dx=pos[b].x-pos[a].x,dy=pos[b].y-pos[a].y,d=Math.sqrt(dx*dx+dy*dy)||1,f=(d-90)*0.02;pos[a].vx+=f*dx/d;pos[a].vy+=f*dy/d;pos[b].vx-=f*dx/d;pos[b].vy-=f*dy/d});
    ids.forEach(i=>{pos[i].vx-=pos[i].x*0.01;pos[i].vy-=pos[i].y*0.01;pos[i].x+=pos[i].vx*0.5;pos[i].y+=pos[i].vy*0.5;pos[i].vx*=0.6;pos[i].vy*=0.6});
  }
  const xs=ids.map(i=>pos[i].x),ys=ids.map(i=>pos[i].y),mnx=Math.min(...xs),mxx=Math.max(...xs),mny=Math.min(...ys),mxy=Math.max(...ys);
  netCache={};ids.forEach(i=>{netCache[i]={x:60+(pos[i].x-mnx)/(mxx-mnx||1)*600,y:40+(pos[i].y-mny)/(mxy-mny||1)*320}});
  return netCache;
}

      ${card('mat','材料覆盖','各篇文献目前的状态',`<div class="stack">${Object.entries(stc).map(([l,{n,c}])=>`<i style="width:${n/ps.length*100}%;background:${c}" data-tip="<b>${l}</b><br>${n} 篇"></i>`).join('')}</div><div class="legend">${Object.entries(stc).map(([l,{n,c}])=>`<span><i style="background:${c}"></i>${l} ${n}</span>`).join('')}</div>`,tbl(['状态','篇数'],Object.entries(stc).map(([l,{n}])=>[l,n])))}
    </div>`;
  } else {
    const W=720,H=400,L=46,R=16,T=18,B=34;
    const net=S.mapLayout==='net'?netLayout():null;
    const xy=p=>{if(net)return[net[p.id].x,net[p.id].y];
      const jit=((p.id*37)%17-8)*3.2;return[L+(p.year-2018.5)/7*(W-L-R)+jit,H-B-Math.log10(p.cited+1)/3.3*(H-T-B)]};
    const rad=p=>Math.min(22,Math.max(5,Math.sqrt(p.cited)*0.62));
    const sel=S.mapSel,has=sel.size>0;
    const grid=net?'':[10,100,1000].map(v=>{const y=H-B-Math.log10(v+1)/3.3*(H-T-B);return`<line class="grid" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text class="axis" x="${L-8}" y="${y+4}" text-anchor="end">${v}</text>`}).join('')
      +`<line class="base" x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}"/>`+[2019,2020,2021,2022,2023,2024,2025].map(y=>`<text class="axis" x="${L+(y-2018.5)/7*(W-L-R)}" y="${H-B+18}" text-anchor="middle">${y}</text>`).join('')
      +`<text class="axis" x="${L-8}" y="${T-4}" text-anchor="end">被引</text>`;
    const edges=net?EDGES.filter(([a,b])=>ids.includes(a)&&ids.includes(b)).map(([a,b])=>{const [x1,y1]=xy(byId(a)),[x2,y2]=xy(byId(b));return`<line class="edge ${has&&!(sel.has(a)&&sel.has(b))?'dim':''}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`}).join(''):'';
    const order=[...ps].sort((a,b)=>b.cited-a.cited);
    const pts=order.map(p=>{const [x,y]=xy(p),[c,l]=colorOf(p);return`<circle class="pt ${has&&!sel.has(p.id)?'dim':''}" data-pt="${p.id}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${rad(p).toFixed(1)}" fill="${c}" data-tip="<b>${esc(p.title)}</b><br>${esc(short(p))} · ${esc(p.venue)}<br>被引 ${p.cited} · ${esc(l)}<br><span style='color:var(--fg3)'>点击打开 · 拖动圈选</span>"/>`}).join('');
    const labels=order.slice(0,3).map(p=>{const [x,y]=xy(p);return`<text class="lbl" x="${x+rad(p)+4}" y="${y+4}">${esc(short(p))}</text>`}).join('');
    const lg=legendItems(ps);
    body=`<div class="mapctl"><span>布局</span><div class="seg inl">${[['year','年份 × 被引'],['net','引用网络'],['topic','主题地图']].map(([k,l])=>`<button class="${S.mapLayout===k?'on':''}" data-ml="${k}" ${k==='topic'?'disabled title="需要 embedding 能力，单独设计"':''}>${l}</button>`).join('')}</div>
        <span style="margin-left:8px">颜色</span><select class="tsel" id="mapColor" aria-label="颜色"><option value="batch" ${S.mapColor==='batch'?'selected':''}>入库批次</option><option value="tag" ${S.mapColor==='tag'?'selected':''}>来源标签</option><option value="status" ${S.mapColor==='status'?'selected':''}>状态</option></select>
        <span class="f3">点大小 = 被引数</span><span style="flex:1"></span><button class="btn q sm" id="mapTbl">${S.mapTable?'地图':'表格'}</button></div>
      <div class="mapwrap">${S.mapTable?tbl(['文献','年份','被引','分组'],order.map(p=>[`<button class="lk" data-open="${p.id}">${esc(short(p))}</button>`,p.year,p.cited,esc(colorOf(p)[1])])):`
        <div class="legend" style="margin:0 0 6px">${lg.map(([l,c])=>`<span><i style="background:${c}"></i>${esc(l)}</span>`).join('')}</div>
        <svg class="mapsvg" id="mapsvg" viewBox="0 0 ${W} ${H}" role="img" aria-label="领域地图：${ps.length} 篇文献">${grid}${edges}${pts}${labels}<rect class="brush" id="brush" x="0" y="0" width="0" height="0" visibility="hidden"/></svg>`}
        ${has?`<div class="mapsel"><b>已圈选 ${sel.size} 篇</b><span class="f2" style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${[...sel].map(i=>esc(short(byId(i)))).join('、')}</span><button class="btn blue sm" id="selCap">${ic('spark','i s')}用这些文献做… ▾</button><button class="btn sm" id="selLib">在文献库中查看</button><button class="btn q sm" id="selClr">清除</button></div>`:''}
      </div>
      <p class="f3" style="font-size:12.5px;margin-top:10px">${S.mapLayout==='net'?'连线 = 库内已确认的引用关系；只显示范围内两端都在的关系。':'纵轴为对数刻度。同一年的点左右错开以免重叠。'}被引数来自 OpenAlex 10-12 观测，不同来源的数字会不同。</p>`;
  }
  $('#main').innerHTML=`<div class="pg"><div class="pgin">
    <h1 class="ptitle">洞察</h1><p class="pdesc">看清这批文献的分布：时间、主题、期刊、被引和材料状态。全部来自库内已有数据，只读。</p>
    <div class="opts" style="margin-bottom:10px"><span class="chipsel">范围<select id="insScope" aria-label="范围">${scopeOptions(S.insScope)}</select></span><button class="btn q sm" id="insCap">${ic('spark','i s')}用这些文献做…</button></div>
    <p class="statline">这里有 <b>${ps.length}</b> 篇文献，发表于 <b>${Math.min(...ps.map(p=>p.year))}–${Math.max(...ps.map(p=>p.year))}</b> 年，来自 <b>${Object.keys(ven).length}</b> 种期刊；被引中位数 <b>${median}</b>，其中 <b>${ps.filter(p=>p.stage>=3).length}</b> 篇已经分析。</p>
    <div class="vtabs"><button class="vt ${S.insTab==='overview'?'on':''}" data-it="overview">统计</button><button class="vt ${S.insTab==='map'?'on':''}" data-it="map">领域地图</button></div>
    ${body}
  </div></div>`;
  $$('[data-it]').forEach(b=>b.onclick=()=>{S.insTab=b.dataset.it;renderMain()});
  $('#insScope').onchange=e=>{S.insScope=e.target.value;S.mapSel=new Set();renderMain()};
  $('#insCap').onclick=()=>capMenu(ids,$('#insCap'));
  $$('[data-tbl]').forEach(b=>b.onclick=()=>{S.tbl[b.dataset.tbl]=!S.tbl[b.dataset.tbl];renderMain()});
  const toLib=o=>{S.checked=new Set(ids);go('lib',Object.assign({scope:S.insScope==='sel'?'all':S.insScope.startsWith('b:')?S.insScope:'all',vt:'all',peek:null,q:'',tagF:'',yrEq:0},o))};
  $$('[data-yr]').forEach(b=>b.onclick=()=>toLib({yrEq:+b.dataset.yr,checked:new Set()}));
  $$('[data-tagbar]').forEach(b=>b.onclick=()=>toLib({tagF:b.dataset.tagbar,checked:new Set()}));
  $$('[data-anabar]').forEach(b=>b.onclick=()=>toLib({tagF:b.dataset.anabar.split(' · ')[1],checked:new Set()}));
  $$('[data-venbar]').forEach(b=>b.onclick=()=>toLib({q:b.dataset.venbar,checked:new Set()}));
  $$('[data-ml]').forEach(b=>b.onclick=()=>{S.mapLayout=b.dataset.ml;renderMain()});
  const mc=$('#mapColor');if(mc)mc.onchange=e=>{S.mapColor=e.target.value;renderMain()};
  const mt=$('#mapTbl');if(mt)mt.onclick=()=>{S.mapTable=!S.mapTable;renderMain()};
  const sc=$('#selCap');if(sc)sc.onclick=()=>capMenu([...S.mapSel],sc);
  const sl=$('#selLib');if(sl)sl.onclick=()=>{S.checked=new Set(S.mapSel);go('lib',{scope:'all',vt:'all',tagF:'',yrEq:0,q:''})};
  const sx=$('#selClr');if(sx)sx.onclick=()=>{S.mapSel=new Set();renderMain()};
  const svg=$('#mapsvg');
  if(svg){
    const pt=e=>{const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())};
    let st=null,moved=false;const br=$('#brush');
    svg.onpointerdown=e=>{st=pt(e);st.hit=e.target.closest&&e.target.closest('[data-pt]');moved=false;svg.setPointerCapture(e.pointerId)};
    svg.onpointermove=e=>{if(!st)return;const p=pt(e);if(Math.abs(p.x-st.x)+Math.abs(p.y-st.y)>4)moved=true;if(!moved)return;
      br.setAttribute('x',Math.min(p.x,st.x));br.setAttribute('y',Math.min(p.y,st.y));br.setAttribute('width',Math.abs(p.x-st.x));br.setAttribute('height',Math.abs(p.y-st.y));br.setAttribute('visibility','visible')};
    svg.onpointerup=e=>{if(!st)return;const p=pt(e),s0=st;st=null;
      if(!moved){const c=s0.hit;if(c){$('#tip').hidden=true;openPaper(c.dataset.pt)}else if(S.mapSel.size){S.mapSel=new Set();renderMain()}return}
      const x1=Math.min(p.x,s0.x),x2=Math.max(p.x,s0.x),y1=Math.min(p.y,s0.y),y2=Math.max(p.y,s0.y);
      S.mapSel=new Set($$('circle.pt',svg).filter(c=>{const cx=+c.getAttribute('cx'),cy=+c.getAttribute('cy');return cx>=x1&&cx<=x2&&cy>=y1&&cy<=y2}).map(c=>+c.dataset.pt));
      renderMain()};
  }
}

/* ---------- 提取 ---------- */
function renderExt(){
  const specOf=id=>specs.find(s=>s.id===id);
  if(S.extNew){

      <div class="composer"><div class="form">
        <div class="row2"><label>提取规范<select id="exSpec">${specs.map(s=>`<option value="${s.id}" ${S.extSpec===s.id?'selected':''}>${esc(s.name)} · ${s.ver}</option>`).join('')}</select></label>
          <label>范围<select id="exScope">${scopeOptions(S.extScope)}</select></label></div>
        <div class="row2"><label>执行方<input type="text" value="内置 Agent · DSH" readonly></label><label>模型<select><option>分析角色（设置中配置）</option></select></label></div>
        <div class="callout" style="margin:0"><span class="ci">${ic('bulb','i s')}</span><span>范围内 ${ids.length} 篇，其中 ${ready} 篇已有解析文档可以读取。其余文献会在覆盖里标为「未处理」，不会自动获取或解析。</span></div>
        <div class="ft"><span>Agent 只能读取材料、定位证据和提交候选记录，不能访问外部网络或改动文献。</span><button class="btn" id="exCancel">取消</button><button class="btn blue" id="exGo" ${ready?'':'disabled'}>开始提取</button></div></div></div>
    </div></div>`;
    $('#bk').onclick=$('#exCancel').onclick=()=>{S.extNew=false;renderMain()};
    $('#exSpec').onchange=e=>{S.extSpec=e.target.value;renderMain()};
    $('#exScope').onchange=e=>{S.extScope=e.target.value;renderMain()};
    $('#exGo').onclick=()=>{const t={id:100+tasks.length,type:'提取',scope:specOf(S.extSpec).name,total:ready,done:0,state:'run',by:'Web',start:now().slice(0,5)};tasks.unshift(t);simulate(t);S.extNew=false;toast('已开始提取 · 进度在「任务」中');renderMain()};
    return;
  }
  if(S.extRun){
    const r=xruns.find(x=>x.id===S.extRun),sp=specOf(r.spec),flds=sp.fields;
    const cnt={rec:0,zero:0,fail:0,todo:0};Object.values(r.cov).forEach(([k])=>cnt[k]++);
    const covTag={rec:'<span class="tag green">有记录</span>',zero:'<span class="tag gray">零记录</span>',fail:'<span class="tag red">失败</span>',todo:'<span class="tag yellow">未处理</span>'};
    const cell=(rec,f)=>{const v=rec.v[f[0]];const ev=rec.ev[f[0]];return v==null?'<span class="f3">—</span>':`<span class="val">${esc(v)}${ev?`<button class="ev" data-open="${rec.p}" data-pg="${ev[1]}" data-y="${ev[2]}" title="跳到原文">${ev[0]}</button>`:''}</span>`};
    let tab='';
    if(S.extRunTab==='rec')tab=`<div class="tw"><table class="nt"><thead><tr>${flds.map(f=>`<th>${f[1]}<span class="f3" style="font-weight:400"> ${f[2].includes('·')?f[2].split('·')[1]:''}</span></th>`).join('')}<th>来源文献</th><th>检查</th></tr></thead>
      <tbody>${r.recs.map(rec=>`<tr class="${rec.ok[1]?'':'warnc'}">${flds.map(f=>`<td>${cell(rec,f)}</td>`).join('')}<td><button class="lk" data-open="${rec.p}">${esc(short(byId(rec.p)))}</button></td>
        <td style="white-space:nowrap"><span class="tag green" title="符合规范 ${sp.ver}">结构 ✓</span> ${rec.ok[1]?'<span class="tag green">证据 ✓</span>':'<span class="tag yellow" title="证据位置只能定位到图注">证据 ⚠</span>'}</td></tr>`).join('')}</tbody></table></div>`;
    else if(S.extRunTab==='cov')tab=Object.entries(r.cov).map(([pid,[k,why]])=>`<div class="covrow"><span><button class="lk" data-open="${pid}">${esc(byId(pid).title)}</button><br><span class="f2" style="font-size:12.5px">${esc(why)}</span></span>${covTag[k]}</div>`).join('');
    else if(S.extRunTab==='chart'){
      const num=flds.find(f=>f[2].startsWith('number'));const rows=r.recs.map(rec=>[rec.v[flds[0][0]]+' · '+short(byId(rec.p)),rec.v[num[0]]]).sort((a,b)=>b[1]-a[1]);const mx=Math.max(...rows.map(x=>x[1]));
      tab=`<div class="ccard" style="max-width:720px"><div class="chd"><h4>${num[1]}${num[2].includes('·')?'（'+num[2].split('·')[1].trim()+'）':''}</h4></div><div class="cs">来自运行 ${r.id} · 规范「${esc(sp.name)}」${r.ver} · 候选数据，未经领域接纳</div>
        <div class="hbars" style="grid-template-columns:minmax(0,220px) minmax(0,1fr) 44px">${rows.map(([l,n])=>`<span class="l" title="${esc(l)}">${esc(l)}</span><span class="t" data-tip="<b>${esc(l)}</b><br>${n}"><i style="width:${n/mx*100}%"></i></span><span class="n">${n}</span>`).join('')}</div></div>`;
    } else tab=`<p class="f2" style="font-size:13px;margin:0 0 8px">内置 Agent（DSH）实际调用的工具，按顺序记录。耗时 ${r.dur} · 用量 ${r.tok} tokens（本系统观测）。</p><ul class="trace">${r.trace.map(([fn,d])=>`<li><span class="fn">${fn}</span><span>${esc(d)}</span></li>`).join('')}</ul>`;
    $('#main').innerHTML=`<div class="pg"><div class="pgin">

      <div class="props" style="max-width:640px;margin:10px 0 6px">

        <span class="k">${ic('spark','i s')}执行方</span><span class="v">内置 Agent · DSH <span class="f3">· 分析角色模型</span></span>
        <span class="k">${ic('stat','i s')}结果</span><span class="v">${r.recs.length} 条候选记录 · ${covTag.rec} ${cnt.rec} ${cnt.zero?covTag.zero+' '+cnt.zero:''} ${cnt.fail?covTag.fail+' '+cnt.fail:''} ${cnt.todo?covTag.todo+' '+cnt.todo:''}</span>
        <span class="k">${ic('cal','i s')}时间</span><span class="v">${r.date} · ${r.dur}</span>
      </div>
      <div class="callout"><span class="ci">${ic('bulb','i s')}</span><span>这些是<b>候选记录</b>，没有经过领域接纳。结构和证据检查通过，只说明格式正确、证据能定位，不代表数值正确。</span></div>
      <div class="vtabs" style="margin-top:14px">${[['rec','记录'],['cov','覆盖'],['chart','图表'],['trace','执行记录']].map(([k,l])=>`<button class="vt ${S.extRunTab===k?'on':''}" data-xt="${k}">${l}</button>`).join('')}
        <div class="vtools"><button class="btn sm" id="exCsv">导出 CSV</button><button class="btn sm" id="exJson">导出 JSON</button><button class="btn q sm" id="exRe">用新版本规范重新运行</button></div></div>
      ${tab}
    </div></div>`;
    $('#bk').onclick=()=>go('ext',{extRun:null});
    $$('[data-xt]').forEach(b=>b.onclick=()=>{S.extRunTab=b.dataset.xt;renderMain()});
    $('#exCsv').onclick=$('#exJson').onclick=()=>toast('原型中不生成文件');
    $('#exRe').onclick=()=>toast('原型：创建新的提取运行，旧结果保留');
    return;
  }
  const sp=specOf(S.extSpec);
  $('#main').innerHTML=`<div class="pg"><div class="pgin">
    <h1 class="ptitle">提取</h1><p class="pdesc">按你定义的记录结构，从文献中提取带证据的候选数据。由内置 Agent（DSH）执行；领域上是否接纳，由下游决定。</p>
    <div class="vtabs"><button class="vt ${S.extTab==='runs'?'on':''}" data-et="runs">提取运行</button><button class="vt ${S.extTab==='specs'?'on':''}" data-et="specs">提取规范</button>
      <div class="vtools">${S.extTab==='specs'?'<button class="btn sm" id="newSpec">新建规范</button>':''}<button class="btn blue sm" id="newRun">${ic('plus','i s')}新建提取</button></div></div>
    ${S.extTab==='runs'?`<div class="tw"><table class="nt"><thead><tr><th>规范</th><th>范围</th><th>记录</th><th class="hide-sm">覆盖</th><th>状态</th><th class="hide-sm">时间</th></tr></thead><tbody>
      ${xruns.map(r=>{const c={rec:0,zero:0,fail:0,todo:0};Object.values(r.cov).forEach(([k])=>c[k]++);const n=r.papers.length;return`<tr class="r" data-goext="${r.id}"><td style="font-weight:500">${esc(specOf(r.spec).name)} <span class="f3">${r.ver}</span></td><td>${esc(r.scope)}</td><td>${r.recs.length}</td>
        <td class="hide-sm" style="min-width:140px"><div class="stack" style="height:8px" data-tip="有记录 ${c.rec} · 零记录 ${c.zero} · 失败 ${c.fail} · 未处理 ${c.todo}">${c.rec?`<i style="width:${c.rec/n*100}%;background:var(--c-green)"></i>`:''}${c.zero?`<i style="width:${c.zero/n*100}%;background:var(--c-gray)"></i>`:''}${c.fail?`<i style="width:${c.fail/n*100}%;background:var(--c-red)"></i>`:''}${c.todo?`<i style="width:${c.todo/n*100}%;background:var(--c-yellow)"></i>`:''}</div></td>

    :`<div style="display:grid;grid-template-columns:minmax(0,240px) minmax(0,1fr);gap:20px">
      <div>${specs.map(s=>`<button class="si ${S.extSpec===s.id?'on':''}" data-sp="${s.id}" style="min-height:44px"><span class="lb">${esc(s.name)}<br><span class="f3" style="font-weight:400;font-size:12px">${s.ver} · ${s.fields.length} 个字段 · ${s.updated} 更新</span></span></button>`).join('')}</div>

    <div class="vtabs">${[['all','全部'],['run','进行中'],['att','部分完成'],['end','已结束']].map(([k,l])=>`<button class="vt ${S.taskF===k?'on':''}" data-tf="${k}">${l} <span class="f3">${tasks.filter(F[k]).length}</span></button>`).join('')}</div>

      <tbody>${list.map(x=>`<tr class="r ${t&&x.id===t.id?'on':''}" data-task="${x.id}" style="cursor:pointer"><td style="white-space:nowrap;font-weight:500">${x.type}</td><td>${esc(x.scope)}</td><td class="hide-sm"><span class="tag ${x.by.startsWith('Agent')?'purple':x.by==='CLI'?'brown':'gray'}">${x.by}</span></td>
        <td><div class="prog"><span class="pbar"><i style="width:${x.done/x.total*100}%;${x.state==='part'?'background:var(--c-red)':x.state==='ok'?'background:var(--c-green)':''}"></i></span><span class="f3" style="font-size:12px">${x.done}/${x.total}</span></div></td>
        <td style="white-space:nowrap">${tstate(x.state)}${x.watch&&x.state==='run'?' <button class="btn q sm" data-watch="'+x.id+'">观看</button>':''}</td><td class="hide-sm mono f3" style="white-space:nowrap">${x.start}</td></tr>`).join('')}</tbody></table></div>
  </div></div>${detail}</div>`;
  $$('[data-tf]').forEach(b=>b.onclick=()=>{S.taskF=b.dataset.tf;renderMain()});
  $$('[data-task]').forEach(b=>b.onclick=()=>{S.task=+b.dataset.task;renderMain()});
  const tcl=$('#tClose');if(tcl)tcl.onclick=()=>{S.task=null;renderMain()};
  const tp=$('#tPause');if(tp)tp.onclick=()=>{t.state=t.state==='pause'?'run':'pause';renderMain()};
  const tc=$('#tCancel');if(tc)tc.onclick=()=>{t.state='part';t.note='已取消 · 已完成的 '+t.done+' 项保留';renderMain()};
  const tr=$('#tRetry');if(tr)tr.onclick=()=>toast('原型：只重试符合恢复规则的失败项');
}

      <button class="card" data-watch="${s.task}"><div class="thumb"><div class="u">${esc(s.url)}</div><span class="lv">Agent 操作中</span>
        <div class="p"><b>${esc(p.title)}</b><div class="ln" style="width:60%"></div><span class="bx"></span><div class="ln"></div><div class="ln" style="width:90%"></div><div class="ln" style="width:75%"></div></div></div>
        <div class="cb"><span class="ct">${esc(p.title)}</span><span class="f2">${t.type} · 第 ${s.n} 篇</span><span style="display:flex;gap:6px;flex-wrap:wrap"><span class="tag blue run"><span class="dt"></span>${s.step}</span><span class="tag ${t.by.startsWith('Agent')?'purple':'gray'}">${t.by}</span></span></div></button>`}).join('')}
      ${Array.from({length:slots-sessions.length}).map(()=>`<div class="card idle"><div class="idlebox">空闲</div><div class="cb"><span class="f3">没有正在使用的会话</span></div></div>`).join('')}
    </div>
    <h3 class="h">最近结束</h3>
    <div class="tw"><table class="nt"><thead><tr><th>文献</th><th>结果</th><th class="hide-sm">耗时</th><th class="hide-sm">结束</th></tr></thead><tbody>
      <tr><td><button class="lk" data-open="5">${esc(byId(5).title)}</button></td><td style="white-space:nowrap"><span class="tag red">无法获取</span> <span class="f2">需要机构登录</span></td><td class="hide-sm mono">4:12</td><td class="hide-sm mono f3">14:21</td></tr>
      <tr><td><button class="lk" data-open="4">${esc(byId(4).title)}</button></td><td style="white-space:nowrap"><span class="tag green">已入库</span> <span class="f2">2.1 MB</span></td><td class="hide-sm mono">1:38</td><td class="hide-sm mono f3">14:16</td></tr>
      <tr><td><button class="lk" data-open="10">${esc(byId(10).title)}</button></td><td style="white-space:nowrap"><span class="tag green">已入库</span> <span class="f2">人工协助</span></td><td class="hide-sm mono">3:05</td><td class="hide-sm mono f3">昨天</td></tr>

/* ---------- 设置 ---------- */
function renderSettings(){
  const secs=[['paths','文献库位置'],['sources','文献来源'],['models','模型'],['parser','解析服务'],['cred','凭据'],['adv','高级']];
  const c={paths:`<p class="pdesc">当前进程实际使用的位置。修改后重启生效，已有资料不会自动搬迁。</p>
      <div class="field"><label for="catp">数据库</label><input id="catp" class="inp mono" value="~/.sciretriever/catalog.sqlite"></div>
      <div class="field"><label for="artp">资产目录</label><input id="artp" class="inp mono" value="~/.sciretriever/artifacts/"></div><div class="acts"><button class="btn blue">保存</button></div>`,
    sources:'<p class="pdesc">元数据来源与 PDF 获取来源分开设置；每个来源可以单独测试。</p>',models:'<p class="pdesc">Provider、Model，以及 Browser / 解析 / 分析各自使用哪个模型。</p>',
    parser:'<p class="pdesc">MinerU 服务地址与连通性测试。</p>',cred:'<p class="pdesc">保存后不回显。</p>',
    adv:'<p class="pdesc">提取交付、重建检索索引、提交 JSON 加工请求。主要给 Agent 与调试使用。</p>'};
  $('#main').innerHTML=`<div class="pg"><div class="pgin" style="max-width:900px"><h1 class="ptitle">设置</h1>
    <div class="vtabs">${secs.map(([k,l])=>`<button class="vt ${S.setSec===k?'on':''}" data-sec="${k}">${l}</button>`).join('')}</div>
    <div style="margin-top:14px">${c[S.setSec]}</div></div></div>`;
  $$('[data-sec]').forEach(b=>b.onclick=()=>{S.setSec=b.dataset.sec;renderMain()});

/* ---------- 活动抽屉 ---------- */
function updateAct(){const n=tasks.filter(t=>t.state==='run').length;$('#actTxt').textContent=n?n+' 个任务进行中':'没有进行中的任务';$('#actBtn').querySelector('.d').style.display=n?'':'none'}
function openActivity(){
  const run=tasks.filter(t=>t.state==='run'||t.state==='pause'),end=tasks.filter(t=>!(t.state==='run'||t.state==='pause')).slice(0,3);
  const row=t=>`<div class="task"><div class="top"><span><b style="font-weight:500">${t.type}</b> <span class="f2">· ${esc(t.scope)}</span></span>${tstate(t.state)}</div>
    ${t.state==='run'||t.state==='pause'?`<div class="prog" style="margin-top:8px"><span class="pbar"><i style="width:${t.done/t.total*100}%"></i></span><span class="f3" style="font-size:12px">${t.done}/${t.total}</span>${t.watch?`<button class="btn q sm" data-watch="${t.id}">观看</button>`:''}</div>`:`<div class="meta">${esc(t.note||'')}</div>`}</div>`;
  $('#overlay').innerHTML=`<div class="scrim" id="scrim"></div><aside class="drawer" role="dialog" aria-label="活动"><div class="dh"><h3>活动</h3><button class="btn q sm" id="cA" aria-label="关闭">${ic('x','i s')}</button></div>
    <div class="db"><h4 class="h" style="font-size:13px;color:var(--fg2);margin-top:4px">进行中</h4>${run.map(row).join('')||'<p class="f3">没有进行中的任务</p>'}<h4 class="h" style="font-size:13px;color:var(--fg2)">最近结束</h4>${end.map(row).join('')}</div>
    <div class="dfoot"><button class="btn sm" id="toTasks">打开任务页</button></div></aside>`;
  $('#scrim').onclick=$('#cA').onclick=()=>closeOverlay();
  $('#toTasks').onclick=()=>go('task');
  $$('#overlay [data-watch]').forEach(b=>b.onclick=()=>openWatch(+b.dataset.watch));
  S.overlay='activity';renderNotes();
}
$('#actBtn').onclick=openActivity;
function closeOverlay(silent){$('#overlay').innerHTML='';S.overlay=null;clearInterval(S.ptrTimer);if(!silent)renderNotes()}

/* ---------- 操作与任务 ---------- */
const OPS={acquire:['获取 PDF',p=>p.stage<1&&!p.running&&!p.failed,'已有 PDF 或正在获取','依次尝试开放获取来源、出版社 API 和 Browser。获取到的 PDF 直接入库并标记「身份未验证」；所有途径都失败的标记为「无法获取」。'],
  parse:['解析',p=>p.stage===1&&!p.failed,'没有 PDF 或已解析','调用 MinerU 解析已有 PDF，生成新的解析版本，不改动原始 PDF。'],
  analyze:['分析',p=>p.stage===2,'未解析或已分析','生成单篇知识，每条结论绑定证据位置。'],
  export:['导出',()=>true,'','导出所选文献的书目信息。']};
function startOp(op,ids){
  const [name]=OPS[op];const t={id:100+tasks.length,type:name,scope:ids.length===1?short(byId(ids[0])):'已选 '+ids.length+' 篇',total:ids.length,done:0,state:'run',by:'Web',start:now().slice(0,5),items:ids,op};
  ids.forEach(i=>byId(i).running=true);tasks.unshift(t);simulate(t);toast('已创建任务「'+name+'」');renderMain();
}
function opModal(op){
  const sel=papers.filter(p=>S.checked.has(p.id));const [name,ok,skip,note]=OPS[op];
  const okL=sel.filter(ok),n=okL.length,sk=sel.length-n;
  $('#overlay').innerHTML=`<div class="scrim" id="scrim"></div><div class="modal" role="dialog" aria-label="${name}"><div class="mh">${name} · ${n} 篇</div>
    <div class="mb"><div class="props" style="grid-template-columns:90px 1fr"><span class="k">范围</span><span class="v">已选 ${sel.length} 篇${sk?`，其中 ${sk} 篇${skip}，将跳过`:''}</span>
    ${op==='acquire'?'<span class="k">每篇最多</span><span class="v">3 条途径 · Browser 单篇 6 分钟</span>':''}${op==='export'?'<span class="k">格式</span><span class="v"><select class="inp" aria-label="格式"><option>BibTeX</option><option>RIS</option><option>CSL JSON</option></select></span>':''}</div>
    <div class="callout"><span class="ci">${ic('bulb','i s')}</span><span>${note}</span></div></div>
    <div class="mf"><button class="btn" id="mC">取消</button><button class="btn blue" id="mG" ${n?'':'disabled'}>${op==='export'?'导出':'创建并开始'}</button></div></div>`;
  $('#scrim').onclick=$('#mC').onclick=()=>closeOverlay();
  $('#mG').onclick=()=>{closeOverlay(true);if(op==='export'){toast('原型中不生成文件');return}S.checked.clear();startOp(op,okL.map(p=>p.id))};
  S.overlay='op';renderNotes();
}
function simulate(t){
  const iv=setInterval(()=>{
    if(t.state==='pause')return;if(t.state!=='run'){clearInterval(iv);return}
    const id=t.items&&t.items[t.done];
    if(id){const p=byId(id);p.running=false;if(t.op==='acquire'){if(t.done%3===2)p.failed=true;else p.stage=1}else if(t.op==='parse')p.stage=2;else if(t.op==='analyze'){p.stage=3;if(!know[p.id])know[p.id]=[['结论','（示例）自动生成的单篇结论。',[['§3',3,30]]]]}}
    t.done++;
    if(t.syn){const y=syntheses.find(x=>x.id===t.syn);if(y)y.done=t.done}
    if(t.done>=t.total){t.state=t.op==='acquire'&&t.items.some(i=>byId(i).failed)?'part':'ok';
      t.note=t.op==='acquire'?`${t.items.filter(i=>!byId(i).failed).length} 篇入库 · ${t.items.filter(i=>byId(i).failed).length} 篇无法获取`:t.total+' 项完成';
      if(t.syn){const y=syntheses.find(x=>x.id===t.syn);if(y){y.state='ok';y.date='刚刚'}}clearInterval(iv);}
    const typing=document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
    const reading=S.active!=='mod'&&$('#vs');
    if(!S.overlay&&!typing&&!reading)renderMain();else{updateAct();renderSide();if(S.overlay==='activity')openActivity()}
  },1600);
}

/* ---------- 观看 ---------- */
const wlogs={};
function openWatch(tid){
  const s=sessions.find(x=>x.task===tid)||sessions[0];const p=byId(s.paper),t=tasks.find(x=>x.id===s.task);
  const log=wlogs[s.task]=wlogs[s.task]||[['14:31:02','打开 DOI 链接'],['14:31:05','跳转到出版社文章页'],['14:31:09','关闭 Cookie 提示'],['14:31:12',s.step]];
  S.control='agent';
  const render=()=>{const human=S.control==='human';
    $('#overlay').innerHTML=`<div class="watch" role="dialog" aria-label="观看">
      <div class="wh"><button class="btn q sm" id="wX" aria-label="返回">${ic('x','i s')}</button>
        <div class="wt"><b style="font-weight:600">${t.type}</b> <span class="f2">· 第 ${s.n} 篇 · ${esc(p.title)}</span></div>
        ${human?'<span class="tag gray" style="height:24px">你正在操作 · Agent 已暂停</span><button class="btn blue sm" id="wB">交还给 Agent</button>':'<span class="tag blue run" style="height:24px"><span class="dt"></span>Agent 正在操作，点击画面即可接手</span>'}</div>
      <div class="wb"><div class="stage"><div class="frame ${human?'human':''}" id="frame">
        <div class="url"><span>https://${esc(s.url)}</span></div>
        <div class="art"><div class="jn">${esc(p.venue.toUpperCase())} · RESEARCH ARTICLE · 示例页面</div><h2>${esc(p.title)}</h2><div class="au">${esc(p.authors)}</div>
          <span class="pdfbtn" id="pdfBtn">Download PDF</span>
          <p>Sulfide solid electrolytes offer high ionic conductivity, yet lithium filament growth limits the critical current density. Here we vary stack pressure between 1 and 50 MPa and track the onset of short circuits using operando impedance…</p>
          <p>We find that the critical current density scales sub-linearly with pressure until creep of lithium into grain boundaries becomes dominant…</p></div>
        ${human?'':'<span class="ptr" id="ptr" style="left:40%;top:30%"></span>'}</div></div>
        <aside class="log"><b style="font-size:13px;font-weight:600">步骤</b><ol>${log.map(([tm,x])=>`<li class="${/^人工|^交还/.test(x)?'h':''}"><span class="tm">${tm}</span><span>${esc(x)}</span></li>`).join('')}</ol></aside></div></div>`;
    $('#wX').onclick=()=>{if(S.control==='human'){log.push([now(),'交还 · 离开观看界面时自动交还']);toast('已离开观看界面，控制权交还给 Agent')}closeOverlay();renderMain()};
    const wb=$('#wB');if(wb)wb.onclick=()=>{S.control='agent';log.push([now(),'交还 · Agent 重新观察页面']);render()};
    $('#frame').onclick=e=>{const pdf=e.target.id==='pdfBtn';
      if(S.control==='agent'){S.control='human';log.push([now(),'人工接手 · Agent 暂停'])}
      if(pdf){log.push([now(),'人工点击 Download PDF → 1.8 MB 已入库，身份未验证']);p.stage=Math.max(p.stage,1);p.failed=false;p.running=false}
      render()};
    clearInterval(S.ptrTimer);
    if(!human){const pos=[[40,30],[22,45],[30,52],[60,24]];let i=0;S.ptrTimer=setInterval(()=>{const pt=$('#ptr');if(!pt)return;i=(i+1)%pos.length;pt.style.left=pos[i][0]+'%';pt.style.top=pos[i][1]+'%'},1800)}
  };
  render();S.overlay='watch';renderNotes();
}
const now=()=>new Date().toTimeString().slice(0,8);

/* ---------- 提示与讨论点 ---------- */
let tt;function toast(m){clearTimeout(tt);let el=$('.toast');if(!el){el=document.createElement('div');el.className='toast';el.setAttribute('role','status');document.body.appendChild(el)}el.textContent=m;tt=setTimeout(()=>el.remove(),3200)}
const NOTES={
  ins:['<b>统计</b>：年份、来源标签、分析标签、标签共现、期刊、被引、材料覆盖。每张卡都能切到表格；点柱子会带着筛选跳到文献库。','<b>领域地图</b>：点大小 = 被引数，颜色可按批次、来源标签或状态。布局有「年份 × 被引」和「引用网络」；「主题地图」需要 embedding，先置灰预留。','在地图上<b>拖动圈选</b>一片点，就可以「用这些文献做…」，或者在文献库里查看。','所有数据来自库内已有事实，只读，不新增存储。'],
  ext:['<b>提取运行</b>和<b>提取规范</b>分开。规范由你定义（字段、类型、说明，可看 JSON Schema），修改即出新版本。','点进一个运行：记录表的每个值旁边有证据标记，点一下跳到 PDF 原文高亮。证据只能定位到图注的记录标黄。','「覆盖」区分有记录、零记录、失败和未处理；「执行记录」列出内置 Agent（DSH）实际调用的工具。','页面始终注明这些是候选记录；领域接纳由下游决定。'],
  cap:['<b>用这些文献做…</b> 是统一入口：文献库的选择条和视图、洞察的范围和圈选都会打开它。','上半部分是现在就能用的能力，下半部分是预留项，以后通过能力接口挂入（包括外部 Agent 用 MCP 注册的能力）。'],
  lib:['<b>文献列表</b>不再是数据表：每篇是一行固定结构，标题（最多两行）+ 作者 · 期刊 · 年份，右侧是状态。','<b>悬停不改变尺寸</b>：只改背景，复选框和预览按钮从透明变为可见，位置一直预留着。','<b>点一行</b>直接打开阅读页（默认 PDF）；点右侧的预览按钮，从右侧滑出预览。','状态标签：灰=仅元数据、黄=有 PDF、蓝=已解析、绿=已分析、红=无法获取、紫=处理中。','勾选后底部浮出操作条。'],
  reader:['<b>打开文献默认显示 PDF</b>，右侧栏是文献信息。','右侧栏顶部用 <b>PDF / 全文 / 总结</b> 切换主区内容；没有对应内容的按钮带一个小灰点。','在「总结」里点证据标记（比如 §3.2 · p.3），会切回 PDF、滚到那一页并高亮对应位置。','缺材料时右侧栏显示对应按钮（获取 PDF / 上传 PDF / 解析 / 分析），点了会创建任务。'],
  disc:['发现页：上方发起，下方发现记录；右侧面板是选中那次发现的各来源结果。'],
  ask:['检索页：大输入框，范围与内容用胶囊选择器；结果用左侧色条区分原文（灰）和知识（紫）。','点结果里的文献标题，会打开 PDF 并高亮对应位置。','右侧是上下文篮子。'],
  syn:['综合的每一份都是侧边栏下的一个子页面，和 Notion 页面一样：标题、属性、正文。','根页面用画廊视图列出所有综合。'],
  task:['任务页：表格加右侧预览；发起方用彩色标签区分 Web / CLI / Agent。','活动记录收在折叠块里。'],
  web:['浏览器页用画廊视图展示并行会话，点卡片进入全屏观看。'],
  set:['设置先只列分区，具体字段沿用现有实现。'],
  activity:['右上角「N 个任务进行中」打开活动抽屉，只做快速查看。'],
  watch:['点一下画面就会接手；点「交还给 Agent」或者直接关闭都会把控制权交回去。'],
  op:['确认面板写明范围、跳过多少篇和副作用。'],
};
function renderNotes(){
  const key=S.overlay&&NOTES[S.overlay]?S.overlay:S.active!=='mod'?'reader':S.mod;
  $('#notes').innerHTML=`<h4>这一屏的讨论点</h4><ol>${NOTES[key].map(n=>`<li>${n}</li>`).join('')}</ol>`;
}
$('#notesBtn').onclick=()=>{$('#notes').hidden=!$('#notes').hidden};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.overlay){closeOverlay();renderMain()}});

renderMain();
})();
