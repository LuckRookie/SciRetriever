# SciRetriever 完整注释配置模板。
# 这份配置覆盖 strict parser 的全部字段；默认启用部分不包含账号、密钥或私有
# 服务地址，可以直接体验 metadata 检索、本地文献库查询和无需凭据的公开全文获取。
# PDF 分析暂未启用，因为它还需要独立运行的 MinerU 服务和 LLM API。
#
# 推荐流程按三个独立命令分步运行。当前文件未启用 analysis，完成第 3 步后，
# 应先配置 MinerU 和 LLM，再运行 analyze：
#   1. sciretriever --config docs/guides/config.toml config check
#   2. sciretriever --config docs/guides/config.toml catalog create
#   3. sciretriever --config docs/guides/config.toml search "solid-state electrolytes" --level metadata
#   4. sciretriever --config docs/guides/config.toml download --all-missing
#   5. sciretriever --config docs/guides/config.toml analyze --all-pending
#
# 启用 Crossref 联系邮箱、Semantic Scholar 和 Elsevier：
#   1. 取消 discovery.crossref_mailto 与 search.crossref_mailto 的注释并填写邮箱；
#   2. 在 shell 中 export SCIRETRIEVER_SEMANTIC_SCHOLAR_API_KEY="真实值"；
#   3. 在 shell 中 export SCIRETRIEVER_ELSEVIER_API_KEY="真实值"；
#   4. 用各 section 下方的完整列表替换 discovery.sources、search.providers 和
#      search.precedence；需要全文时再替换 acquisition.providers；
#   5. 重新运行 config check，确认 status 为 ready 后再 search/download。
#
# 阅读方式：每个已启用字段都直接给出试用值；每个未启用字段都以
# “# field = example”形式给出可取消注释的示例。完整说明和场景配置见：
# configuration.md

# 配置格式版本；当前只能填写 1。
schema_version = 1

# 相邻且确实需要 acquisition 的 WorkVersion 启动间隔（秒）。内置默认值和硬下限
# 都是 30；小于 30 的值会被拒绝。它不限制 metadata、analysis、资产复用或同一
# WorkVersion 内的候选请求。
document_start_interval_seconds = 30.0

# 本地数据路径。相对路径以 config.toml 所在目录为基准。
# 数据目录放在仓库同级位置，避免 CLI 的 staged-repository 写入保护拒绝操作。
[paths]
# SQLite 文献库文件。已经为你创建仓库外的 SciRetriever-runtime 目录。
catalog = "../../../SciRetriever-runtime/catalog.sqlite"
# PDF/XML/HTML 和处理产物的不可变存储根目录。
storage_root = "../../../SciRetriever-runtime/storage"

# Provider 凭据优先通过环境变量提供，不把真实秘密写入这个文件：
# export SCIRETRIEVER_SEMANTIC_SCHOLAR_API_KEY="..."
# export SCIRETRIEVER_ELSEVIER_API_KEY="..."
# export SCIRETRIEVER_SPRINGER_API_KEY="..."
# export SCIRETRIEVER_WILEY_API_KEY="..."
# export SCIRETRIEVER_UNPAYWALL_EMAIL="you@example.org"
#
# 如果必须从 TOML 读取，也可以取消下面字段的注释并填写真实值。
# 含真实凭据的配置必须保持 0600 权限，且不得提交到版本控制。
[credentials]
# Unpaywall 要求的联系邮箱；也可使用 SCIRETRIEVER_UNPAYWALL_EMAIL。
# unpaywall_email = "you@example.org"
# Semantic Scholar API key；也可使用 SCIRETRIEVER_SEMANTIC_SCHOLAR_API_KEY。
# semantic_scholar_api_key = "..."
# Elsevier API key；metadata 与全文接口共用，也可使用 SCIRETRIEVER_ELSEVIER_API_KEY。
# elsevier_api_key = "..."
# Wiley TDM token；也可使用 SCIRETRIEVER_WILEY_API_KEY。
# wiley_api_key = "..."
# Springer Nature API key；也可使用 SCIRETRIEVER_SPRINGER_API_KEY。
# springer_api_key = "..."

# discover 命令的默认设置。discover 生成 JSONL 清单，但不会把结果写成 Work。
[discovery]
# 默认查询三个无需 API key 的 metadata 来源。
sources = ["crossref", "europe-pmc", "arxiv"]
# 可用的完整 metadata 列表如下。配置 Elsevier、Springer 凭据后，可用这一行
# 替换上面的 sources；Semantic Scholar 的 key 可选但建议配置。
# sources = ["crossref", "europe-pmc", "arxiv", "openalex", "semantic-scholar", "elsevier", "springer"]
# Metadata 合并上限；与 search 的内置默认值一致。
limit = 1000
# 单个 provider 的请求超时（秒）。
timeout = 30.0
# discover 清单中标签体系的名称和版本；它们只是本地分类标识。
taxonomy = "literature-topic"
taxonomy_version = "1"
# Crossref 不使用 API key；建议取消注释并填写请求联系邮箱。
# crossref_mailto = "you@example.org"

# discover 的默认年份过滤条件。
[discovery.filters]
# 只保留 2020 年及以后的文献；不需要时可删除这一行或整个 section。
year_from = 2020
# 可选结束年份，必须不早于 year_from，范围均为 1 到 9999。
# year_to = 2026

# 可选确定性标签规则：section 中的 key 是标签，数组是任一命中即添加标签的词。
# [discovery.label_rules]
# battery = ["electrolyte", "lithium"]

# search 命令的默认设置。search 会把规范化后的 Work/WorkVersion 写入 catalog。
[search]
# metadata 表示只检索并入库，不自动下载 PDF 或执行分析。
# 需要全文时可在命令行临时使用 --level download。
level = "metadata"
# Metadata 入库上限。需要小批量试用时可在命令行显式传更小的 --limit。
limit = 1000
# 只有显式使用 --level download 或 --level analyze 时，最多把前 100 个本次结果
# 交给下游 completion。它不减少已经入库的 metadata 数量。
completion_limit = 100
# 当前启用的 metadata provider，均无需强制凭据。
providers = ["crossref", "europe-pmc", "arxiv"]
# 多来源字段冲突时的优先顺序；必须与 providers 包含完全相同的名称。
precedence = ["crossref", "europe-pmc", "arxiv"]
# 启用完整 metadata 列表时，同时用下面两行替换上面的 providers 和 precedence。
# providers = ["crossref", "europe-pmc", "arxiv", "openalex", "semantic-scholar", "elsevier", "springer"]
# precedence = ["crossref", "europe-pmc", "arxiv", "openalex", "semantic-scholar", "elsevier", "springer"]
# 每个 provider 的独立超时（秒）。
provider_timeout = 30.0
# 最多同时运行 3 个 metadata provider 请求。
max_concurrency = 3
# Crossref search 使用独立的联系邮箱字段；建议与 discovery 中保持一致。
# crossref_mailto = "you@example.org"

# 普通 search 使用与 discover 相同的年份过滤语义；其它 filter 会被拒绝。
# [search.filters]
# year_from = 2020
# year_to = 2026

# expand 命令的引用图设置。
[expansion]
# 默认沿参考文献向外扩展；也可选 cited-by 或 both。
direction = "references"
# 0 表示默认只核对种子、不访问图 provider。试用扩展时在命令行传 --depth 1。
depth = 0
# Semantic Scholar 可匿名试用，但匿名请求可能受到更严格的限流。
providers = ["semantic-scholar"]
# 一次扩展最多调用 provider 5 次，每页最多取 50 条。
max_provider_calls = 5
page_size = 50

# download 和 search --level download 使用的全文获取策略。
[acquisition]
# 只启用无需强制凭据的来源：
# direct 使用 catalog 中已有的 HTTPS 地址，其余三个按文献标识符寻找公开 PDF。
providers = ["direct", "arxiv", "crossref", "europe-pmc"]
# 配好对应凭据后，可用下面一行替换 providers 以启用全部已实现的第一层来源。
# OpenAlex 当前 parser 尚未接入官方 key，匿名访问可能不稳定。
# providers = ["direct", "arxiv", "crossref", "unpaywall", "europe-pmc", "openalex", "semantic-scholar", "elsevier", "wiley", "springer"]
# 如果还要启用 operator 授权的 Sci-Hub endpoint，在上面完整列表末尾加入 "sci-hub"，
# 并同时取消 [acquisition.sci_hub] 模板的注释。
# 单次 provider 操作超时（秒）。
timeout = 30.0
# 全局 provider 并发数和同一主机并发数。
provider_concurrency = 3
host_concurrency = 2
# 同一主机两次请求启动之间至少等待 0.5 秒。
host_min_interval = 0.5
# 单个资产最大 100 MiB，超过后拒绝读取和保存。
max_asset_bytes = 104857600
# 可选本地 URL 禁止清单。只有先创建该普通文本文件后才取消注释；每行一个 URL。
# forbidden_urls = "./forbidden_urls.txt"
# XML 和 HTML 是可选补充，不能替代 primary PDF；试用阶段默认不获取。
include_xml = false
include_html = false

# preflight 只读检查的资源和网络策略。
[acquisition.preflight]
# storage 所在磁盘至少保留 1 GiB 可用空间。
min_free_bytes = 1073741824
# preflight 使用与 acquisition 相同的 100 MiB 资产上限。
max_asset_bytes = 104857600
# none 表示 preflight 不联网；改成 headers 后只对显式 --url 做 HEAD readiness。
readiness = "none"
# Headers readiness 的超时（秒）。
timeout = 10.0

# 以下 acquisition capability 默认关闭。只有实际具备已授权 endpoint、规则或
# 浏览器 profile 时才取消注释；详细安全约束见 configuration.md。

# Sci-Hub 没有默认 endpoint。providers 包含 sci-hub 时 enabled 必须为 true，反之亦然。
# [acquisition.sci_hub]
# enabled = true
# 只接受 operator 明确授权的 HTTPS 固定入口。
# base_url = "https://authorized-endpoint.example"
# 可选 PDF 下载主机白名单；填写精确 hostname，不含 scheme、端口或路径。
# allowed_pdf_hosts = ["authorized-pdf-host.example"]

# 静态 landing-page translator 是第一层 provider 耗尽后的第二层，不执行页面脚本。
# [acquisition.translator]
# enabled = true
# 每个 [[rules]] 定义一种 publisher landing page；启用时至少需要一条。
# [[acquisition.translator.rules]]
# 唯一小写规则名，只能使用字母、数字和连字符，最长 32 字符。
# name = "example-publisher"
# HTTPS 模板必须且只能包含一个 {doi} 或 {doi_path} 占位符。
# landing_url_template = "https://landing.example/article?doi={doi}"
# 可选 landing 跳转与最终 PDF 精确主机白名单。
# allowed_landing_hosts = ["redirect.example"]
# allowed_pdf_hosts = ["pdf.example"]

# Browser fallback 是 translator 之后的第三层，默认关闭且不支持交互登录或 CAPTCHA。
# [acquisition.browser]
# enabled = true
# 由 operator 预先准备的 profile；必须存在、非符号链接、owner-only 0700，且在 storage 外。
# profile_dir = "./private-browser-profile"
# 每次复制 profile 时允许的最大总字节数，默认 512 MiB，上限 4 GiB。
# max_profile_bytes = 536870912
# 每次复制 profile 时允许的最大文件数，默认 20000，上限 100000。
# max_profile_files = 20000
# 启用 browser 时至少需要一条规则，而且每个字段都必须填写。
# [[acquisition.browser.rules]]
# name = "example-publisher"
# landing_url_template = "https://landing.example/article?doi={doi}"
# 允许的 landing、PDF 与页面运行期网络主机，均填写精确 hostname。
# allowed_landing_hosts = ["landing.example"]
# allowed_pdf_hosts = ["pdf.example"]
# allowed_network_hosts = ["landing.example", "pdf.example", "assets.example"]

# PDF analysis 需要同时启用 MinerU 与 LLM；只取消一侧不会形成可运行的 analysis。
# Loopback MinerU 示例。远程模式必须改用 HTTPS、设置 auth_env 且 remote_upload = true。
# [analysis.mineru]
# mode 可选 disabled、loopback、remote；省略整个 section 时为 disabled。
# mode = "loopback"
# loopback 只允许 http://localhost 或 loopback IP；remote 只允许默认 443 端口 HTTPS origin。
# endpoint = "http://127.0.0.1:8000"
# remote 模式使用的认证环境变量名；loopback 模式禁止设置。
# auth_env = "SCIRETRIEVER_MINERU_TOKEN"
# 明确确认 remote 模式会上传 PDF；remote 必须为 true，loopback 必须为 false。
# remote_upload = false
# 当前协议固定值，修改任何一项都会被 parser 拒绝。
# service_version = "3.4.4"
# api_protocol = 2
# backend = "vlm-engine"
# Operator 部署的精确模型标识，启用 MinerU 时必填。
# model = "operator/model@revision"
# 单次解析总 deadline 与轮询间隔（秒）；poll_interval 不得超过 overall_deadline。
# overall_deadline = 900.0
# poll_interval = 2.0
# MinerU archive/JSON、页、block、span、文本与图片的接收上限。
# max_archive_bytes = 536870912
# max_json_bytes = 134217728
# max_pages = 2000
# max_blocks = 500000
# max_spans = 2000000
# max_text_characters = 100000000
# max_image_bytes = 67108864
# 解压防护：文件数、总解压字节、单文件字节和压缩比上限。
# max_archive_files = 10000
# max_extracted_bytes = 1073741824
# max_file_bytes = 268435456
# max_compression_ratio = 200
# 解析结果中图片、JSON 深度、元素和单字符串字符上限。
# max_images = 5000
# max_json_depth = 100
# max_json_elements = 2000000
# max_json_string_characters = 100000000
# 远程上传字节上限，以及同一 deterministic run 允许的最大 attempt 数。
# max_upload_bytes = 104857600
# max_attempts = 3

# OpenAI-compatible LLM。endpoint、model、credential_env 必须一起填写。
# [analysis.llm]
# 只接受使用 DNS hostname、默认 443 端口且不含 query/fragment 的安全 HTTPS base URL。
# endpoint = "https://llm.example.org/v1"
# Provider 对应的模型 ID。
# model = "analysis-model"
# 保存环境变量名称而非 secret；运行时从该变量读取 API key。
# credential_env = "SCIRETRIEVER_LLM_API_KEY"
# 单次请求 timeout（秒），必须大于 0 且不超过 600。
# timeout = 120.0
# 输出 token、送入模型的字符和 source unit 数量上限。
# max_output_tokens = 16384
# max_input_characters = 200000
# max_source_units = 5000

# 发布 DocumentPackageVersion 时的输入和结构安全上限。
# 一般试用无需修改；这些限制用于拒绝异常大或异常深的输入。
[package]
# 最大输入 64 MiB。
max_input_bytes = 67108864
# 最多 2000 页、100000 个结构单元。
max_pages = 2000
max_structural_units = 100000
# JSON/结构树最大深度和元素数量。
max_depth = 256
max_elements = 500000
# 规范化文本最多 2000 万字符。
max_text_characters = 20000000

# 当前未启用的能力：
# - Unpaywall、Elsevier、Wiley、Springer 的凭据入口和完整 provider 列表已在上方保留；
# - Semantic Scholar 可匿名运行，但建议配置 API key 以获得更稳定的限流额度；
# - OpenAlex 官方当前要求 API key，但本项目 parser 尚未接入，不能通过本配置提供；
# - [analysis.mineru] 和 [analysis.llm] 需要真实服务及运行时凭据。
# 准备好这些条件后，按上方模板和 configuration.md 启用，不要填写假值。
