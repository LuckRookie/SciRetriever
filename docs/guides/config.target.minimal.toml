# 下一版 runtime.config 的最小离线解析模板；当前 CLI 尚不读取此文件。
schema_version = 2

[paths]
catalog = "~/.sciretriever/catalog.sqlite"
storage_root = "~/.sciretriever-assets"

[collection]
citation_providers = ["openalex", "semantic-scholar"]

[sources]
providers = ["crossref", "europe-pmc", "arxiv"]

[assets]
providers = ["direct", "arxiv", "crossref", "europe-pmc"]

[parsing]
protocol = "loopback"
base_url = "http://127.0.0.1:8000"
model = "mineru-3.4.4"

[analysis]
protocol = "openai"
base_url = "https://api.openai.com/v1"
model = "gpt-5.1"
secret_ref = "env:SCIRETRIEVER_ANALYSIS_API_KEY"

[execution]
[library]
[access]
[credentials]
