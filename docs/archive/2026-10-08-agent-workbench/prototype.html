<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>SciRetriever · Agent 工作台设计原型 v0</title>
    <style>
      /* DESIGN TOKENS — edit here to change the whole prototype. No external assets. */
      :root {
        --canvas: #f5f5f0;
        --surface: #fff;
        --sidebar: #edeee7;
        --ink: #263b33;
        --muted: #637167;
        --line: #dfe4da;
        --green: #386d50;
        --green-deep: #254f39;
        --green-soft: #eaf0e6;
        --amber: #8a6129;
        --amber-soft: #f7f0e1;
        --danger: #a15042;
        --shadow: 0 16px 55px #263b3314;
        --radius: 12px;
        --sans:
          "Avenir Next", "Segoe UI", "Noto Sans CJK SC", "Microsoft YaHei",
          sans-serif;
        --serif:
          "Iowan Old Style", "Palatino Linotype", Georgia, "Noto Serif CJK SC",
          serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--canvas);
        color: var(--ink);
        font: 14px/1.6 var(--sans);
        -webkit-font-smoothing: antialiased;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      button,
      a,
      input,
      select,
      textarea {
        touch-action: manipulation;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      button,
      a {
        transition:
          background 0.16s,
          color 0.16s,
          border-color 0.16s;
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible {
        outline: 3px solid var(--green);
        outline-offset: 3px;
      }
      a {
        color: inherit;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
        text-wrap: pretty;
      }
      h1 {
        font-size: 28px;
        letter-spacing: -1px;
        line-height: 1.4;
      }
      h2 {
        font-size: 17px;
        letter-spacing: -0.3px;
      }
      h3 {
        font-size: 15px;
      }
      small,
      .muted {
        color: var(--muted);
      }
      small {
        font-size: 12px;
      }
      [hidden] {
        display: none !important;
      }
      .icon {
        width: 18px;
        height: 18px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.65;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex: none;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .between {
        justify-content: space-between;
      }
      .wrap {
        flex-wrap: wrap;
      }
      .stack {
        display: grid;
        gap: 16px;
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
        font-size: 12px;
      }
      .eyebrow {
        font-size: 10px;
        letter-spacing: 1.8px;
        font-weight: 700;
        color: var(--muted);
        text-transform: uppercase;
      }
      .dot {
        width: 7px;
        height: 7px;
        background: var(--green);
        border-radius: 50%;
        display: inline-block;
        flex: none;
      }
      .dot.amber {
        background: var(--amber);
      }
      .pill {
        display: inline-flex;
        gap: 6px;
        align-items: center;
        font-size: 11px;
        white-space: nowrap;
        padding: 3px 9px;
        border-radius: 5px;
        background: var(--green-soft);
        color: var(--green-deep);
        font-weight: 600;
      }
      .pill.wait {
        color: var(--amber);
        background: var(--amber-soft);
      }
      .pill.neutral {
        color: var(--muted);
        background: var(--canvas);
      }
      .pill.error {
        color: var(--danger);
        background: #faeeea;
      }
      .btn {
        display: inline-flex;
        justify-content: center;
        align-items: center;
        gap: 7px;
        min-height: 36px;
        border: 1px solid var(--line);
        background: var(--surface);
        border-radius: 7px;
        padding: 7px 12px;
        font-weight: 600;
        font-size: 12px;
        text-decoration: none;
      }
      .btn:hover {
        background: var(--green-soft);
        border-color: #b8c9b9;
      }
      .btn.primary {
        background: var(--green-deep);
        border-color: var(--green-deep);
        color: white;
      }
      .btn.primary:hover {
        background: var(--green);
      }
      .btn.subtle {
        background: transparent;
      }
      .btn.danger {
        color: var(--danger);
      }
      .text-btn {
        border: 0;
        background: transparent;
        color: var(--green);
        padding: 4px 0;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 12px;
        font-weight: 600;
      }
      .text-btn:hover {
        text-decoration: underline;
      }
      .icon-btn {
        border: 0;
        background: transparent;
        border-radius: 5px;
        display: grid;
        place-items: center;
        padding: 7px;
      }
      .icon-btn:hover {
        background: var(--green-soft);
      }
      .proto-bar {
        height: 34px;
        background: var(--ink);
        color: #f1f3e9;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 22px;
        font-size: 11px;
        gap: 12px;
        position: fixed;
        z-index: 20;
        inset: 0 0 auto;
      }
      .proto-bar strong {
        font-weight: 600;
      }
      .proto-bar a {
        color: #e4efbd;
        text-decoration: none;
      }
      .proto-bar .mono {
        font-size: 10px;
        color: #ccd8c8;
      }
      .sidebar {
        position: fixed;
        top: 34px;
        bottom: 0;
        left: 0;
        width: 208px;
        background: var(--sidebar);
        border-right: 1px solid var(--line);
        padding: 31px 18px 18px;
        display: flex;
        flex-direction: column;
        z-index: 10;
      }
      .wordmark {
        font-size: 23px;
        letter-spacing: -1.1px;
        font-weight: 700;
        line-height: 1.1;
        margin: 0 8px 31px;
      }
      .wordmark span {
        font-weight: 400;
      }
      .wordmark i {
        display: inline-block;
        width: 5px;
        height: 5px;
        margin-left: 3px;
        background: var(--green);
        border-radius: 50%;
      }
      .workspace {
        display: flex;
        align-items: center;
        gap: 10px;
        border: 1px solid #d7ddcf;
        border-radius: 8px;
        padding: 11px;
        margin-bottom: 30px;
        background: #ffffff48;
      }
      .workspace-mark {
        flex: none;
        width: 30px;
        height: 30px;
        border-radius: 7px;
        background: var(--green-deep);
        color: white;
        font-family: var(--serif);
        font-size: 20px;
        text-align: center;
      }
      .workspace b {
        font-size: 12px;
        display: block;
      }
      .workspace small {
        font-size: 10px;
      }
      .nav-label {
        padding: 0 10px;
        margin-bottom: 10px;
      }
      .nav {
        display: grid;
        gap: 5px;
      }
      .nav button {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 11px 13px;
        text-align: left;
        background: transparent;
        border: 0;
        border-radius: 7px;
        color: var(--muted);
        font-size: 13px;
      }
      .nav button:hover {
        background: #ffffff8c;
      }
      .nav button.active {
        color: var(--green-deep);
        background: #dfe8d8;
        font-weight: 700;
      }
      .nav .count {
        margin-left: auto;
        font-size: 10px;
        padding: 0 6px;
        background: #ffffff82;
        border-radius: 4px;
      }
      .sidebar-bottom {
        margin-top: auto;
        padding: 20px 8px 0;
      }
      .sidebar-bottom p {
        font-size: 12px;
        margin: 7px 0 2px;
      }
      .sidebar-bottom small {
        font-size: 10px;
      }
      .sidebar-bottom .version {
        border-top: 1px solid #d7ddcf;
        margin-top: 20px;
        padding-top: 15px;
        display: flex;
        justify-content: space-between;
        font-size: 10px;
        color: var(--muted);
      }
      .shell {
        margin-left: 208px;
        padding-top: 34px;
        min-height: 100vh;
      }
      .topbar {
        height: 65px;
        padding: 0 34px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: var(--canvas);
        gap: 14px;
      }
      .crumb {
        font-size: 12px;
        color: var(--muted);
      }
      .crumb b {
        color: var(--ink);
        font-weight: 500;
      }
      .divider {
        display: inline-block;
        height: 16px;
        width: 1px;
        background: var(--line);
        margin: 0 3px;
      }
      .avatar {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: var(--green-soft);
        border: 1px solid var(--line);
        display: grid;
        place-items: center;
        font-family: var(--serif);
        font-weight: 600;
      }
      .connection {
        font-size: 11px;
        color: var(--muted);
      }
      .main {
        padding: 28px 34px 70px;
        max-width: 1720px;
        margin: auto;
      }
      .page-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 25px;
      }
      .page-head p {
        color: var(--muted);
        font-size: 12px;
        margin-top: 5px;
      }
      .page-head .eyebrow {
        margin-bottom: 7px;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--surface);
        margin-bottom: 25px;
      }
      .stat {
        padding: 16px 21px;
      }
      .stat + .stat {
        border-left: 1px solid var(--line);
      }
      .stat-label {
        font-size: 11px;
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .stat-number {
        font-size: 29px;
        line-height: 1.3;
        letter-spacing: -1px;
        margin-top: 4px;
        font-weight: 500;
        font-variant-numeric: tabular-nums;
      }
      .stat-number small {
        font-size: 11px;
        letter-spacing: 0;
        margin-left: 8px;
        font-weight: 400;
      }
      .dashboard-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 292px;
        gap: 23px;
        align-items: start;
      }
      .dashboard-primary {
        display: flex;
        flex-direction: column;
        gap: 23px;
        min-width: 0;
      }
      .section-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
        gap: 8px;
      }
      .section-heading h2 {
        display: flex;
        align-items: center;
        gap: 9px;
      }
      .section-heading h2 small {
        font-size: 11px;
        font-weight: 400;
      }
      .panel {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        overflow: hidden;
      }
      .task-feature {
        padding: 20px 22px;
      }
      .task-feature .task-title {
        display: block;
        background: none;
        border: 0;
        padding: 0;
        text-align: left;
        font-size: 18px;
        font-weight: 600;
        margin: 12px 0 7px;
        letter-spacing: -0.3px;
      }
      .task-feature .task-title:hover {
        color: var(--green);
      }
      .task-meta {
        font-size: 11px;
        color: var(--muted);
      }
      .progress {
        height: 5px;
        background: var(--green-soft);
        border-radius: 4px;
        overflow: hidden;
        margin: 16px 0 8px;
      }
      .progress span {
        display: block;
        height: 100%;
        background: var(--green);
        border-radius: 4px;
      }
      .progress-label {
        font-size: 11px;
        display: flex;
        justify-content: space-between;
        gap: 10px;
      }
      .task-footer {
        border-top: 1px solid var(--line);
        background: #fafbf7;
        padding: 11px 22px;
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: center;
        font-size: 11px;
      }
      .task-footer span {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .mini-task {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 16px 21px;
        background: var(--surface);
        border-top: 1px solid var(--line);
      }
      .mini-task b {
        font-size: 12px;
        display: block;
      }
      .mini-task small {
        font-size: 10px;
      }
      .stage-mark {
        width: 31px;
        height: 31px;
        border: 1px solid var(--line);
        background: var(--canvas);
        border-radius: 7px;
        display: grid;
        place-items: center;
        color: var(--green);
      }
      .sessions-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }
      .session {
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--surface);
        overflow: hidden;
        text-align: left;
        cursor: pointer;
        padding: 0;
        width: 100%;
        color: inherit;
      }
      .session:hover {
        border-color: #96af98;
        box-shadow: 0 3px 12px #263b330a;
      }
      .session-top {
        padding: 10px 12px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 10px;
        border-bottom: 1px solid var(--line);
      }
      .session-top .icon {
        width: 13px;
        height: 13px;
      }
      .session-screen {
        height: 145px;
        background: #f0f1eb;
        padding: 15px 24px;
        position: relative;
        overflow: hidden;
      }
      .paper-mini {
        height: 151px;
        background: white;
        border: 1px solid #e3e5df;
        box-shadow: 0 4px 8px #263b3308;
        padding: 13px 16px;
        text-align: left;
        color: #33423b;
      }
      .paper-mini .journal {
        font-family: var(--serif);
        font-size: 10px;
        border-bottom: 1px solid #dfe4da;
        padding-bottom: 4px;
      }
      .paper-mini h3 {
        font-family: var(--serif);
        font-size: 13px;
        line-height: 1.25;
        margin: 7px 0;
      }
      .paper-mini .lines {
        height: 22px;
        background: repeating-linear-gradient(
          to bottom,
          #e7eae4 0,
          #e7eae4 2px,
          transparent 2px,
          transparent 7px
        );
        width: 91%;
        margin-top: 8px;
      }
      .pdf-mini {
        float: right;
        color: white;
        background: var(--green);
        font-size: 7px;
        padding: 3px 6px;
        border-radius: 2px;
      }
      .session-state {
        position: absolute;
        bottom: 11px;
        left: 12px;
        background: #fffffff5;
        border: 1px solid var(--line);
        border-radius: 5px;
        padding: 4px 7px;
        font-size: 9px;
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .session-bottom {
        padding: 11px 12px;
        font-size: 11px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 6px;
      }
      .attention {
        padding: 18px;
        background: var(--amber-soft);
        border: 1px solid #e8dbc3;
        border-radius: var(--radius);
      }
      .attention h2 {
        font-size: 14px;
        display: flex;
        align-items: center;
        gap: 8px;
        color: #765222;
      }
      .attention .pill {
        margin-left: auto;
        background: #eadab9;
      }
      .attention h3 {
        margin-top: 17px;
        font-size: 13px;
      }
      .attention p {
        font-size: 11px;
        color: #7a6648;
        line-height: 1.8;
        margin: 7px 0 14px;
      }
      .attention .btn {
        background: #fffaf1;
        border-color: #dfcfaf;
        color: #765222;
      }
      .aside-section {
        padding: 20px 2px;
        border-bottom: 1px solid var(--line);
      }
      .activity {
        list-style: none;
        margin: 14px 0 0;
        padding: 0;
      }
      .activity li {
        position: relative;
        padding: 0 0 17px 17px;
        border-left: 1px solid var(--line);
        margin-left: 3px;
      }
      .activity li:before {
        content: "";
        position: absolute;
        top: 6px;
        left: -3px;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #91a98e;
      }
      .activity li:last-child {
        padding-bottom: 0;
        border-left-color: transparent;
      }
      .activity b {
        font-size: 11px;
        font-weight: 500;
        display: block;
      }
      .activity small {
        font-size: 10px;
        display: block;
        margin-top: 3px;
      }
      .connection-card {
        padding: 16px;
        border: 1px dashed #bccabb;
        border-radius: 9px;
        margin-top: 20px;
      }
      .connection-card p {
        font-size: 11px;
        color: var(--muted);
        margin: 8px 0;
      }
      .latest-table {
        width: 100%;
        border-collapse: collapse;
        text-align: left;
      }
      .latest-table th {
        font-size: 10px;
        font-weight: 500;
        color: var(--muted);
        padding: 10px 16px;
        border-bottom: 1px solid var(--line);
        background: #fafbf7;
      }
      .latest-table td {
        font-size: 11px;
        padding: 13px 16px;
        border-bottom: 1px solid var(--line);
      }
      .latest-table tr:last-child td {
        border-bottom: 0;
      }
      .latest-table .title-link {
        border: 0;
        padding: 0;
        background: transparent;
        text-align: left;
        font: inherit;
        color: var(--ink);
        max-width: 100%;
        line-height: 1.6;
      }
      .title-link:hover {
        color: var(--green) !important;
        text-decoration: underline;
      }
      .subnav {
        display: flex;
        gap: 23px;
        border-bottom: 1px solid var(--line);
        margin-bottom: 22px;
        overflow-x: auto;
      }
      .subnav button {
        border: 0;
        border-bottom: 2px solid transparent;
        background: transparent;
        padding: 10px 0;
        color: var(--muted);
        font-size: 12px;
        white-space: nowrap;
      }
      .subnav button.active {
        border-bottom-color: var(--green);
        color: var(--green);
        font-weight: 700;
      }
      .detail-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 270px;
        gap: 22px;
      }
      .detail-panel {
        padding: 22px;
      }
      .step-list {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin: 20px 0;
      }
      .step {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 14px;
        font-size: 12px;
      }
      .step.active {
        border-color: #a6b99d;
        background: var(--green-soft);
      }
      .step small {
        display: block;
        font-size: 10px;
        margin-top: 6px;
      }
      .step strong {
        display: block;
        margin-top: 5px;
      }
      .step .number {
        font-size: 10px;
        color: var(--muted);
      }
      .key-values {
        margin: 15px 0 0;
        display: grid;
        gap: 13px;
      }
      .key-values div {
        display: grid;
        grid-template-columns: 73px 1fr;
        font-size: 11px;
        gap: 7px;
      }
      .key-values dt {
        color: var(--muted);
      }
      .key-values dd {
        margin: 0;
        overflow-wrap: anywhere;
      }
      .callout {
        border: 1px solid var(--line);
        background: var(--green-soft);
        padding: 12px 15px;
        border-radius: 8px;
        font-size: 11px;
        line-height: 1.8;
      }
      .task-list {
        display: grid;
        gap: 12px;
      }
      .task-list .panel {
        padding: 20px;
      }
      .task-list h2 {
        font-size: 16px;
        margin: 8px 0;
      }
      .filters {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 18px;
        flex-wrap: wrap;
      }
      input,
      select,
      textarea {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 7px;
        padding: 9px 11px;
        min-height: 38px;
        font-size: 12px;
      }
      textarea {
        resize: vertical;
        width: 100%;
        line-height: 1.8;
      }
      .search {
        flex: 1;
        min-width: 180px;
        max-width: 420px;
      }
      .filter-btn {
        padding: 6px 10px;
        border: 1px solid var(--line);
        background: var(--surface);
        border-radius: 6px;
        font-size: 11px;
      }
      .filter-btn.active {
        background: var(--green-soft);
        color: var(--green);
        border-color: #b6c8b0;
      }
      .browser-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 280px;
        gap: 20px;
      }
      .browser-frame {
        border: 1px solid var(--line);
        border-radius: 10px;
        overflow: hidden;
        background: var(--surface);
      }
      .browser-toolbar {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 11px 13px;
        background: var(--sidebar);
        font-size: 10px;
        border-bottom: 1px solid var(--line);
      }
      .window-dots {
        display: flex;
        gap: 4px;
      }
      .window-dots i {
        width: 6px;
        height: 6px;
        border: 1px solid #8f9d8d;
        border-radius: 50%;
      }
      .address {
        flex: 1;
        min-width: 0;
        padding: 4px 9px;
        border: 1px solid var(--line);
        border-radius: 4px;
        background: var(--surface);
        color: var(--muted);
        overflow-wrap: anywhere;
      }
      .browser-paper {
        margin: 24px;
        min-height: 340px;
        padding: 28px 34px;
        border: 1px solid var(--line);
        background: white;
        color: #293b32;
      }
      .browser-paper .journal {
        font-family: var(--serif);
        font-size: 19px;
        padding-bottom: 14px;
        border-bottom: 2px solid #385d45;
      }
      .browser-paper .paper-tag {
        font-size: 9px;
        letter-spacing: 1.2px;
        color: #738071;
        margin-top: 20px;
      }
      .browser-paper h2 {
        font: 26px/1.25 var(--serif);
        max-width: 570px;
        margin: 10px 0 14px;
        color: #263b33;
      }
      .browser-paper p {
        font: 12px/1.9 var(--serif);
        color: #58685b;
        margin: 16px 0;
      }
      .browser-paper .authors {
        font: 11px var(--sans);
        color: #677466;
      }
      .browser-paper .access {
        font: 10px var(--sans);
        background: #eaf0e6;
        color: #386d50;
        padding: 7px 10px;
        border-radius: 4px;
      }
      .browser-caption {
        padding: 12px 16px;
        border-top: 1px solid var(--line);
        display: flex;
        justify-content: space-between;
        gap: 10px;
        font-size: 10px;
      }
      .browser-controls {
        display: grid;
        gap: 16px;
        align-content: start;
      }
      .control-panel {
        padding: 18px;
      }
      .control-panel h3 {
        margin: 12px 0 5px;
      }
      .control-panel p {
        font-size: 11px;
        color: var(--muted);
        margin-bottom: 14px;
      }
      .control-panel .btn {
        width: 100%;
        margin-top: 8px;
      }
      .control-panel label {
        display: block;
        font-size: 11px;
        margin: 19px 0 7px;
      }
      .guide-log {
        margin-top: 15px;
        font-size: 11px;
        color: var(--green);
        padding: 10px;
        background: var(--green-soft);
        border-radius: 6px;
        overflow-wrap: anywhere;
      }
      .library-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 340px;
        gap: 20px;
      }
      .literature-row {
        width: 100%;
        border: 0;
        border-bottom: 1px solid var(--line);
        padding: 17px 20px;
        background: var(--surface);
        text-align: left;
        display: block;
      }
      .literature-row:last-child {
        border-bottom: 0;
      }
      .literature-row:hover,
      .literature-row.selected {
        background: var(--green-soft);
      }
      .literature-row h3 {
        font-size: 13px;
        margin: 7px 0;
      }
      .literature-row p {
        font-size: 11px;
        color: var(--muted);
      }
      .literature-detail {
        padding: 22px;
      }
      .literature-detail h2 {
        font: 24px/1.35 var(--serif);
        margin: 16px 0 10px;
      }
      .literature-detail p {
        font-size: 12px;
        line-height: 1.9;
        color: var(--muted);
        margin: 12px 0;
      }
      .settings-grid {
        display: grid;
        grid-template-columns: 170px minmax(0, 1fr);
        gap: 24px;
      }
      .settings-nav {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .settings-nav button {
        text-align: left;
        padding: 10px 12px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        font-size: 12px;
      }
      .settings-nav button.active {
        background: var(--green-soft);
        color: var(--green);
        font-weight: 600;
      }
      .setting-row {
        padding: 20px 0;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
      }
      .setting-row:last-child {
        border: 0;
      }
      .setting-row p {
        font-size: 11px;
        color: var(--muted);
        margin-top: 4px;
      }
      .setting-row select {
        max-width: 220px;
      }
      .toggle {
        position: relative;
        width: 34px;
        height: 20px;
        border: 0;
        border-radius: 15px;
        background: #bbc5b5;
        padding: 0;
        flex: none;
      }
      .toggle[aria-checked="true"] {
        background: var(--green);
      }
      .toggle:after {
        content: "";
        position: absolute;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: white;
        left: 3px;
        top: 3px;
        transition: left 0.15s;
      }
      .toggle[aria-checked="true"]:after {
        left: 17px;
      }
      .empty {
        text-align: center;
        padding: 70px 24px;
        background: var(--surface);
        border: 1px dashed var(--line);
        border-radius: 12px;
      }
      .empty .icon {
        width: 32px;
        height: 32px;
        margin-bottom: 12px;
        color: var(--green);
      }
      .empty p {
        font-size: 12px;
        color: var(--muted);
        margin: 9px 0 20px;
      }
      .notice {
        padding: 10px 16px;
        font-size: 12px;
        border: 1px solid #e8dbc3;
        background: var(--amber-soft);
        color: var(--amber);
        border-radius: 7px;
        margin-bottom: 20px;
      }
      .toast {
        position: fixed;
        left: calc(50% + 100px);
        bottom: 26px;
        transform: translateX(-50%);
        background: var(--ink);
        color: white;
        padding: 12px 20px;
        border-radius: 8px;
        box-shadow: var(--shadow);
        z-index: 100;
        font-size: 12px;
        max-width: calc(100vw - 40px);
      }
      dialog {
        border: 1px solid var(--line);
        border-radius: 15px;
        padding: 0;
        background: var(--surface);
        color: var(--ink);
        box-shadow: var(--shadow);
        width: min(510px, calc(100vw - 28px));
        max-height: 88vh;
      }
      dialog::backdrop {
        background: #18332742;
        backdrop-filter: blur(3px);
      }
      .modal-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid var(--line);
        padding: 18px 22px;
      }
      .modal-body {
        padding: 22px;
      }
      .modal-body label {
        font-size: 12px;
        display: block;
        margin-bottom: 6px;
      }
      .field {
        margin-bottom: 17px;
      }
      .field input,
      .field select {
        width: 100%;
      }
      .modal-footer {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        padding: 16px 22px;
        border-top: 1px solid var(--line);
      }
      .tweaks-launch {
        position: fixed;
        right: 20px;
        bottom: 20px;
        border: 1px solid var(--line);
        border-radius: 30px;
        padding: 11px 15px;
        background: var(--surface);
        box-shadow: var(--shadow);
        font-size: 11px;
        display: flex;
        align-items: center;
        gap: 7px;
        z-index: 30;
      }
      .tweaks {
        position: fixed;
        right: 20px;
        bottom: 73px;
        width: 300px;
        max-width: calc(100vw - 30px);
        max-height: calc(100vh - 130px);
        overflow: auto;
        background: var(--surface);
        box-shadow: var(--shadow);
        border: 1px solid var(--line);
        border-radius: 12px;
        z-index: 31;
        padding: 18px;
      }
      .tweaks label {
        font-size: 11px;
        display: block;
        margin: 16px 0 6px;
      }
      .tweaks select {
        width: 100%;
      }
      .tweaks p {
        font-size: 10px;
        color: var(--muted);
        margin-top: 9px;
      }
      .tweaks textarea {
        font-size: 11px;
      }
      .annotation {
        font-size: 9px;
        letter-spacing: 0.5px;
        border: 1px dashed var(--line);
        padding: 2px 5px;
        color: var(--muted);
        border-radius: 3px;
        margin-right: 5px;
        display: none;
      }
      body[data-labels="true"] .annotation {
        display: inline-block;
      }
      .footer-note {
        margin-top: 24px;
        color: var(--muted);
        font-size: 10px;
      }
      .help-grid {
        display: grid;
        gap: 14px;
      }
      .help-grid p {
        font-size: 12px;
        color: var(--muted);
      }
      .kbd {
        font:
          10px ui-monospace,
          monospace;
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 1px 5px;
      }
      .layout-monitor .live-section {
        order: -1;
      }
      .layout-monitor .session-screen {
        height: 205px;
      }
      .layout-monitor .paper-mini {
        height: 220px;
      }
      .layout-dense .stat {
        padding: 10px 18px;
      }
      .layout-dense .task-feature {
        padding: 14px 18px;
      }
      .layout-dense .session-screen {
        height: 112px;
      }
      .layout-dense .mini-task {
        padding: 11px 18px;
      }
      .layout-dense .dashboard-primary {
        gap: 15px;
      }
      .layout-dense .main {
        padding-top: 20px;
      }
      .layout-dense .page-head {
        margin-bottom: 17px;
      }
      .layout-dense .stats {
        margin-bottom: 18px;
      }
      @media (min-width: 1550px) {
        .dashboard-grid {
          grid-template-columns: minmax(0, 1fr) 330px;
        }
        .session-screen {
          height: 180px;
        }
        .paper-mini {
          height: 190px;
        }
      }
      @media (max-width: 1150px) {
        .sidebar {
          width: 180px;
          padding: 25px 12px 16px;
        }
        .wordmark {
          font-size: 21px;
        }
        .shell {
          margin-left: 180px;
        }
        .main {
          padding: 24px 23px 75px;
        }
        .topbar {
          padding: 0 23px;
        }
        .dashboard-grid {
          grid-template-columns: minmax(0, 1fr) 250px;
          gap: 18px;
        }
        .task-feature {
          padding: 18px;
        }
        .session-screen {
          padding: 14px;
        }
        .task-footer {
          padding: 11px 18px;
        }
        .detail-grid,
        .browser-grid {
          grid-template-columns: minmax(0, 1fr) 240px;
        }
        .library-grid {
          grid-template-columns: minmax(0, 1fr) 280px;
        }
      }
      @media (max-width: 950px) {
        .dashboard-grid {
          grid-template-columns: 1fr;
        }
        .dashboard-aside {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 18px;
        }
        .connection-card {
          display: none;
        }
        .aside-section {
          padding: 5px 0;
          border: 0;
        }
        .detail-grid,
        .browser-grid {
          grid-template-columns: 1fr;
        }
        .browser-controls {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 16px;
        }
        .library-grid {
          grid-template-columns: 1fr;
        }
        .literature-detail {
          margin-top: 0;
        }
        .session-screen {
          height: 170px;
        }
        .paper-mini {
          height: 190px;
        }
        .stat {
          padding: 15px;
        }
        .stat-number {
          font-size: 25px;
        }
      }
      @media (max-width: 650px) {
        .proto-bar {
          padding: 0 12px;
          font-size: 10px;
        }
        .proto-bar .mono {
          display: none;
        }
        .sidebar {
          position: static;
          width: auto;
          padding: 16px 14px 0;
          margin-top: 34px;
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }
        .wordmark {
          font-size: 21px;
          margin: 0 3px 16px;
        }
        .workspace,
        .nav-label,
        .sidebar-bottom {
          display: none;
        }
        .nav {
          display: flex;
          gap: 5px;
        }
        .nav button {
          justify-content: center;
          padding: 10px 8px;
          font-size: 12px;
          gap: 5px;
          border-radius: 7px 7px 0 0;
        }
        .nav .icon {
          width: 15px;
          height: 15px;
        }
        .nav .count {
          display: none;
        }
        .shell {
          margin-left: 0;
          padding-top: 0;
        }
        .topbar {
          height: 45px;
          padding: 0 17px;
        }
        .topbar .connection,
        .topbar .divider,
        .topbar .avatar {
          display: none;
        }
        .main {
          padding: 22px 16px 90px;
        }
        .page-head {
          align-items: start;
          gap: 12px;
        }
        h1 {
          font-size: 24px;
        }
        .page-head .actions .btn.subtle {
          display: none;
        }
        .page-head .actions {
          flex-wrap: wrap;
          justify-content: flex-end;
        }
        .page-head p {
          font-size: 11px;
        }
        .stats {
          grid-template-columns: 1fr 1fr;
        }
        .stat {
          padding: 13px 15px;
        }
        .stat:nth-child(3) {
          border-left: 0;
          border-top: 1px solid var(--line);
        }
        .stat:nth-child(4) {
          border-top: 1px solid var(--line);
        }
        .stat-number small {
          font-size: 10px;
        }
        .dashboard-aside {
          grid-template-columns: 1fr;
        }
        .sessions-grid {
          grid-template-columns: 1fr;
        }
        .session-screen {
          height: 163px;
        }
        .task-footer {
          align-items: start;
          flex-wrap: wrap;
        }
        .latest-table th,
        .latest-table td {
          padding: 10px 12px;
        }
        .latest-table .optional {
          display: none;
        }
        .browser-paper {
          margin: 12px;
          padding: 22px;
          min-height: 300px;
        }
        .browser-paper h2 {
          font-size: 22px;
        }
        .browser-controls {
          grid-template-columns: 1fr;
        }
        .step-list {
          grid-template-columns: 1fr;
          gap: 7px;
        }
        .step {
          padding: 10px;
        }
        .step strong {
          display: inline-block;
          margin: 0 7px;
        }
        .settings-grid {
          grid-template-columns: 1fr;
          gap: 14px;
        }
        .settings-nav {
          flex-direction: row;
          overflow-x: auto;
        }
        .settings-nav button {
          white-space: nowrap;
        }
        .setting-row {
          gap: 12px;
          align-items: start;
        }
        .setting-row select {
          max-width: 150px;
        }
        .toast {
          left: 50%;
          bottom: 76px;
          width: max-content;
        }
        .tweaks-launch {
          right: 14px;
          bottom: 14px;
        }
        .task-meta {
          font-size: 10px;
        }
        .detail-panel {
          padding: 17px;
        }
        .browser-caption {
          flex-wrap: wrap;
        }
        .hide-mobile {
          display: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *:before,
        *:after {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <!-- Original SciRetriever wordmark and warm-white/pine palette, from apps/web/public. -->
    <svg
      aria-hidden="true"
      style="display: none"
      xmlns="http://www.w3.org/2000/svg"
    >
      <symbol id="i-grid" viewBox="0 0 24 24">
        <rect x="3" y="3" width="7" height="7" rx="1.5" />
        <rect x="14" y="3" width="7" height="7" rx="1.5" />
        <rect x="3" y="14" width="7" height="7" rx="1.5" />
        <rect x="14" y="14" width="7" height="7" rx="1.5" />
      </symbol>
      <symbol id="i-task" viewBox="0 0 24 24">
        <rect x="5" y="4" width="14" height="17" rx="2" />
        <path d="M9 4V2h6v2M9 10h6M9 14h6M9 18h4" />
      </symbol>
      <symbol id="i-book" viewBox="0 0 24 24">
        <path
          d="M4 4h7v16H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2ZM13 4h7a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-7ZM11 5h2M11 19h2"
        />
      </symbol>
      <symbol id="i-settings" viewBox="0 0 24 24">
        <path d="M4 7h16M4 17h16" />
        <rect x="7" y="4" width="4" height="6" rx="1" fill="var(--surface)" />
        <rect x="14" y="14" width="4" height="6" rx="1" fill="var(--surface)" />
      </symbol>
      <symbol id="i-arrow" viewBox="0 0 24 24">
        <path d="M5 12h14m-5-5 5 5-5 5" />
      </symbol>
      <symbol id="i-plus" viewBox="0 0 24 24">
        <path d="M12 5v14M5 12h14" />
      </symbol>
      <symbol id="i-browser" viewBox="0 0 24 24">
        <rect x="2" y="4" width="20" height="16" rx="2" />
        <path d="M2 9h20M6 6.5h.01M9 6.5h.01" />
      </symbol>
      <symbol id="i-bell" viewBox="0 0 24 24">
        <path d="M5 16h14l-2-4V8a5 5 0 0 0-10 0v4ZM10 20h4" />
      </symbol>
      <symbol id="i-check" viewBox="0 0 24 24">
        <path d="m5 12 4 4L19 6" />
      </symbol>
      <symbol id="i-file" viewBox="0 0 24 24">
        <path d="M5 3h9l5 5v13H5ZM14 3v6h5M8 13h8M8 17h5" />
      </symbol>
      <symbol id="i-close" viewBox="0 0 24 24">
        <path d="m6 6 12 12M6 18 18 6" />
      </symbol>
      <symbol id="i-link" viewBox="0 0 24 24">
        <path
          d="m9 15 6-6M8 16l-2 2a4 4 0 0 1-6-6l5-5a4 4 0 0 1 6 0M16 8l2-2a4 4 0 0 1 6 6l-5 5a4 4 0 0 1-6 0"
          transform="translate(1 0) scale(.9)"
        />
      </symbol>
    </svg>
    <div class="proto-bar">
      <span
        ><strong>设计原型 v0</strong> · 所有任务、文章与画面均为合成示例</span
      ><span class="row"
        ><span class="mono">2026.10.08 / LOCAL ONLY</span
        ><a href="proposal.md">设计提案 ↗</a></span
      >
    </div>
    <aside class="sidebar">
      <div class="wordmark">sci<span>retriever</span><i></i></div>
      <div class="workspace">
        <div class="workspace-mark">S</div>
        <div><b>我的科研工作空间</b><small>本地工作空间（示例）</small></div>
      </div>
      <div class="eyebrow nav-label">Workspace</div>
      <nav class="nav" aria-label="主要导航">
        <button data-route="home" class="active">
          <svg class="icon"><use href="#i-grid" /></svg>工作台
        </button>
        <button data-route="tasks">
          <svg class="icon"><use href="#i-task" /></svg>任务<span
            class="count"
            id="nav-count"
            >3</span
          >
        </button>
        <button data-route="library">
          <svg class="icon"><use href="#i-book" /></svg>文献库
        </button>
        <button data-route="settings">
          <svg class="icon"><use href="#i-settings" /></svg>设置
        </button>
      </nav>
      <div class="sidebar-bottom">
        <div class="row">
          <span class="dot"></span><small>运行状态示例</small>
        </div>
        <p>Agent 在工作，你来掌舵。</p>
        <small>过程可见 · 材料可追溯</small>
        <div class="version">
          <span>SciRetriever</span><span>WEB / v0</span>
        </div>
      </div>
    </aside>
    <div class="shell">
      <header class="topbar">
        <div class="crumb">
          工作空间 <span style="margin: 0 9px; color: #a4afa1">/</span>
          <b id="breadcrumb">工作台</b>
        </div>
        <div class="row">
          <span class="connection row"
            ><span class="dot"></span>本地交互示意</span
          ><span class="divider"></span
          ><button
            class="icon-btn"
            data-action="assistance"
            aria-label="查看待协助事项"
          >
            <svg class="icon"><use href="#i-bell" /></svg>
          </button>
          <div class="avatar" aria-label="示例用户">S</div>
        </div>
      </header>
      <main class="main" id="main" tabindex="-1"></main>
    </div>
    <button
      class="tweaks-launch"
      id="tweaks-button"
      aria-expanded="false"
      aria-controls="tweaks"
    >
      <svg class="icon"><use href="#i-settings" /></svg>设计选项
    </button>
    <aside class="tweaks" id="tweaks" aria-label="设计选项" hidden>
      <div class="row between">
        <h3>Tweaks <small>· 评审工具</small></h3>
        <button
          class="icon-btn"
          data-action="close-tweaks"
          aria-label="关闭设计选项"
        >
          <svg class="icon"><use href="#i-close" /></svg>
        </button>
      </div>
      <label for="layout-select">首页布局</label
      ><select id="layout-select">
        <option value="balanced">A · 任务与画面均衡</option>
        <option value="monitor">B · Browser 画面优先</option>
        <option value="dense">C · 紧凑任务布局</option>
      </select>
      <label for="scenario-select">样例状态</label
      ><select id="scenario-select">
        <option value="running">执行中 · 有事项需要协助</option>
        <option value="complete">全部示例任务完成</option>
        <option value="empty">空工作台</option>
        <option value="offline">连接中断</option>
      </select>
      <label class="row" for="show-labels"

            : "目标文献数（示例范围）";
          $("operation-note").textContent = discovery
            ? "只发现并接纳元数据，不自动下载 PDF。计数表示每个来源的原始扫描上限，不是保证接纳的文献数量。"
            : e.target.value === "获取 PDF"
              ? "只获取目标文献的 PDF，不自动解析或分析。此表单仅模拟提交，不访问网络。"
              : "只处理已有材料，缺口不会自动触发下载。此表单仅模拟提交。";
        }
      });
      $("tweaks-button").addEventListener("click", () => {
        $("tweaks").hidden = !$("tweaks").hidden;
        $("tweaks-button").setAttribute(
          "aria-expanded",
          String(!$("tweaks").hidden),
        );
      });
      $("layout-select").addEventListener("change", (e) => {
        state.layout = e.target.value;
        navigate("home");
      });
      $("scenario-select").addEventListener("change", (e) => {
        state.scenario = e.target.value;
        state.helped = false;
        state.human = false;
        state.downloaded = false;
        state.guide = "";
        navigate("home");
      });
      $("show-labels").addEventListener(
        "change",
        (e) => (document.body.dataset.labels = String(e.target.checked)),
      );
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && !$("tweaks").hidden)
          actions["close-tweaks"]();
      });
      const initial = location.hash.slice(1);
      if (
        ["home", "tasks", "detail", "browser", "library", "settings"].includes(
          initial,
        )
      )
        state.route = initial;
      render();
    </script>
  </body>
</html>
