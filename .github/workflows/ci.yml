name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quick:
    if: github.event_name == 'push' && github.ref != 'refs/heads/master'
    name: TypeScript quick
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"

      - name: Install pinned pnpm
        run: npm install --global pnpm@10.32.1

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quick checks
        run: pnpm quick

  full:
    if: github.event_name != 'push' || github.ref == 'refs/heads/master'
    name: TypeScript full
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"

      - name: Install pinned pnpm
        run: npm install --global pnpm@10.32.1

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Install locked Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Install bounded PDF inspection tools
        run: sudo apt-get install --yes --no-install-recommends poppler-utils

      - name: Select test browser
        run: |
          node --input-type=module -e 'import { chromium } from "playwright"; console.log("SCIRETRIEVER_BROWSER_EXECUTABLE=" + chromium.executablePath());' >> "$GITHUB_ENV"

      - name: Run full checks
        run: pnpm full
