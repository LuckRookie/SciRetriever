# Copy to config.toml and keep only the settings you need.
# This file lists only fields accepted by the current strict parser.
# Optional acquisition adapters are disabled by default.
schema_version = 1
# Delay starts of network-backed document work across foreground batches.
document_start_interval_seconds = 30.0

[paths]
catalog = "./catalog.sqlite"
storage_root = "./storage"

# Uncomment only the credentials you use and replace every placeholder.
# On POSIX, a config containing this section must have mode 0600 or stricter.
# [credentials]
# unpaywall_email = "YOUR_UNPAYWALL_EMAIL"
# semantic_scholar_api_key = "YOUR_SEMANTIC_SCHOLAR_API_KEY"
# elsevier_api_key = "YOUR_ELSEVIER_API_KEY"
# wiley_api_key = "YOUR_WILEY_API_KEY"
# springer_api_key = "YOUR_SPRINGER_API_KEY"

[discovery]
sources = ["crossref", "europe-pmc", "arxiv"]
# Also supported: "openalex", "semantic-scholar", "elsevier", "springer".
# Elsevier and Springer require their credentials above when selected.
limit = 100
timeout = 30.0
taxonomy = "literature-topic"
taxonomy_version = "1"
crossref_mailto = "researcher@example.org"

[discovery.filters]
year_from = 2020
year_to = 2026

[discovery.label_rules]
battery = ["electrolyte", "lithium"]

[search]
level = "metadata"
# Also supported: "download" and "analyze"; both require paths.storage_root.
limit = 100
providers = ["crossref", "europe-pmc", "arxiv"]
# Precedence must contain every configured provider exactly once.
precedence = ["crossref", "europe-pmc", "arxiv"]
provider_timeout = 30.0
max_concurrency = 8
crossref_mailto = "researcher@example.org"

[expansion]
direction = "references" # Also supported: "cited-by" and "both".
depth = 0
providers = ["openalex", "semantic-scholar"]
max_provider_calls = 10
page_size = 100

[acquisition]
providers = ["direct", "arxiv", "crossref", "unpaywall", "europe-pmc", "openalex", "semantic-scholar", "elsevier", "wiley", "springer"]
timeout = 30.0
provider_concurrency = 4
host_concurrency = 2
host_min_interval = 0.25
max_asset_bytes = 104857600
forbidden_urls = "./forbidden_urls.txt"
include_xml = false
include_html = false

# Sci-Hub has no default endpoint. Enable it only for an operator-authorized HTTPS
# endpoint and add "sci-hub" to acquisition.providers in the same configuration.
# Omit this table entirely when the capability is disabled.
# [acquisition.sci_hub]
# enabled = true
# base_url = "https://authorized-endpoint.example"
# allowed_pdf_hosts = ["authorized-pdf-host.example"]

# Restricted landing-page translation is the sequential second tier. Rules use
# exact host allowlists and the fixed static HTML whitelist; arbitrary scripts do not run.
# Omit this table entirely when disabled; disabled translator rules are rejected.
# [acquisition.translator]
# enabled = true
# [[acquisition.translator.rules]]
# name = "example-publisher"
# landing_url_template = "https://landing.example/article?doi={doi}"
# allowed_landing_hosts = ["redirect.example"]
# allowed_pdf_hosts = ["pdf.example"]

# Browser fallback is the sequential third tier. The existing profile directory
# must be owner-only 0700, outside the storage tree, and prepared without SciRetriever.
# Each invocation uses a temporary copy, does not call storage_state, and cleans it.
# Interactive login and CAPTCHA handling are unsupported.
# Omit this table entirely when disabled; disabled profile/rules are rejected.
# [acquisition.browser]
# enabled = true
# profile_dir = "./private-browser-profile"
# max_profile_bytes = 536870912
# max_profile_files = 20000
# [[acquisition.browser.rules]]
# name = "example-publisher"
# landing_url_template = "https://landing.example/article?doi={doi}"
# allowed_landing_hosts = ["landing.example"]
# allowed_pdf_hosts = ["pdf.example"]
# allowed_network_hosts = ["landing.example", "pdf.example", "assets.example"]

[acquisition.preflight]
min_free_bytes = 1073741824
max_asset_bytes = 104857600
readiness = "none" # "headers" enables body-free HEAD readiness for direct URLs only.
timeout = 10.0

[analysis.mineru]
# Loopback forbids auth_env and remote_upload. Remote mode requires an HTTPS
# origin, auth_env, and remote_upload=true because PDFs leave the local host.
mode = "loopback"
endpoint = "http://127.0.0.1:8000"
service_version = "3.4.4"
api_protocol = 2
backend = "vlm-engine"
model = "operator/model@revision"
overall_deadline = 900.0
poll_interval = 2.0
max_archive_bytes = 536870912
max_json_bytes = 134217728
max_pages = 2000
max_blocks = 500000
max_spans = 2000000
max_text_characters = 100000000
max_image_bytes = 67108864
max_archive_files = 10000
max_extracted_bytes = 1073741824
max_file_bytes = 268435456
max_compression_ratio = 200
max_images = 5000
max_json_depth = 100
max_json_elements = 2000000
max_json_string_characters = 100000000
max_upload_bytes = 104857600
max_attempts = 3

[analysis.llm]
endpoint = "https://llm.example.org/v1"
model = "analysis-model"
credential_env = "SCIRETRIEVER_LLM_API_KEY"
timeout = 120.0
max_output_tokens = 16384
max_input_characters = 200000
max_source_units = 5000

[package]
max_input_bytes = 67108864
max_pages = 2000
max_structural_units = 100000
max_depth = 256
max_elements = 500000
max_text_characters = 20000000
