<!doctype html>
<html lang="zh-CN" data-ui="library"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SciRetriever 文献库</title><link rel="stylesheet" href="/workspace.css"></head><body>
<div class="app">
  <aside class="side" id="side"></aside>
  <div class="main">
    <div class="tbar">
      <button class="btn q sm menu" id="menuBtn" aria-label="菜单">☰</button>
      <nav class="tabs" id="tabs" aria-label="标签页"></nav>
      <button class="actpill" id="actBtn"><span class="d"></span><span id="actTxt">正在连接</span></button>
    </div>
    <main class="view" id="main"></main>
  </div>
</div>

<input type="file" id="pdfInput" accept="application/pdf" hidden>

<div id="overlay"></div>
<div class="tip" id="tip" hidden></div>

<template id="configuration-template"><section id="config-workspace">
        <div class="live-heading">
          <p class="live-eyebrow">CONFIGURATION</p>
          <h1>设置</h1>
          <p>管理数据库、来源、模型与运行环境，查看保存和实际生效状态。</p>
        </div>
        <p id="config-page-status" role="status" aria-live="polite">
          正在读取配置…
        </p>
        <section class="config-card">
          <div class="job-card-heading">
            <h2>运行状态</h2>
            <button id="config-refresh" type="button">刷新</button>
          </div>
          <p id="config-runtime-status" role="status" aria-live="polite">
            正在检查已保存配置与运行时快照…
          </p>
          <ul id="config-readiness" class="config-readiness">
            <li>正在读取状态…</li>
          </ul>
        </section>
        <form id="paths-config-form" class="config-card config-form">
          <h2>文献数据库</h2>
          <p id="current-database-binding">
            正在读取当前进程使用的数据库与资产目录…
          </p>
          <p>默认保存在 ~/.sciretriever/ 下，可按需修改以下位置。</p>
          <label for="config-catalog-path">Catalog 路径</label
          ><input
            id="config-catalog-path"
            required
            placeholder="SQLite 文件的绝对路径"
          /><label for="config-artifact-root">资产目录</label
          ><input
            id="config-artifact-root"
            required
            placeholder="文献资产目录的绝对路径"
          />
          <p>
            保存后重启服务生效。新数据库文件所在目录须已存在；重启时目标文件不存在则创建空库。
            修改位置不会搬迁已有文献；使用已有库时，请同时选择其对应的资产目录。
          </p>
          <button id="paths-config-save" class="live-primary" type="submit">
            保存数据库绑定
          </button>
        </form>
        <form
          id="source-config-form"
          class="config-card config-form source-form"
        >
          <h2>文献来源</h2>
          <p>
            选择元数据检索和 PDF 获取来源。Auto 使用内置来源；Custom
            使用所选来源。保存只更新 Sources 配置。
          </p>
          <div class="source-columns">
            <section
              class="source-group"
              aria-labelledby="metadata-source-heading"
            >
              <h3 id="metadata-source-heading">元数据来源</h3>
              <label for="config-metadata-mode">选择模式</label>
              <select id="config-metadata-mode">
                <option value="auto">Auto · 内置来源</option>
                <option value="custom">Custom · 自选来源</option>
              </select>
              <p id="config-metadata-auto" class="source-auto-note"></p>
              <fieldset
                id="config-metadata-provider-set"
                class="source-provider-set"
              >
                <legend>Custom 来源</legend>
                <div
                  id="config-metadata-providers"
                  class="source-provider-list"
                ></div>
              </fieldset>
              <label for="config-metadata-limit">每个来源的原始结果上限</label>
              <input
                id="config-metadata-limit"
                type="number"
                min="1"
                step="1"
                required
              />
              <div class="source-parameters">
                <h4>Web of Science 参数</h4>
                <label for="config-wos-product">产品</label>
                <select id="config-wos-product">
                  <option value="">未配置</option>
                  <option value="starter">Starter</option>
                  <option value="expanded">Expanded</option>
                </select>
                <label for="config-wos-database">数据库</label>
                <input id="config-wos-database" autocomplete="off" />
                <label for="config-wos-edition">版本（可选）</label>
                <input id="config-wos-edition" autocomplete="off" />
              </div>
            </section>
            <section
              class="source-group"
              aria-labelledby="acquisition-source-heading"
            >
              <h3 id="acquisition-source-heading">PDF 获取来源</h3>
              <label for="config-acquisition-mode">选择模式</label>
              <select id="config-acquisition-mode">
                <option value="auto">Auto · 内置来源</option>
                <option value="custom">Custom · 自选来源</option>
              </select>
              <p id="config-acquisition-auto" class="source-auto-note"></p>
              <fieldset
                id="config-acquisition-provider-set"
                class="source-provider-set"
              >
                <legend>Custom 来源</legend>
                <div
                  id="config-acquisition-providers"
                  class="source-provider-list"
                ></div>
              </fieldset>
              <div class="source-parameters">
                <h4>Unpaywall 参数</h4>
                <label for="config-unpaywall-contact">联系邮箱</label>
                <input
                  id="config-unpaywall-contact"
                  type="email"
                  autocomplete="email"
                />
                <p>选择 Unpaywall 时需要提供联系邮箱。</p>
              </div>
            </section>
          </div>
          <div class="job-actions">
            <button id="source-config-save" class="live-primary" type="submit">
              保存来源配置
            </button>
          </div>
        </form>
        <form
          id="provider-model-form"
          class="config-card config-form model-registry-form"
        >
          <h2>Model Provider 与 Model</h2>
          <p>
            此处只保存协议、地址与 Model 能力。API Key
            继续通过下方独立凭据表单保存，不会进入普通配置。
          </p>
          <div class="model-registry-columns">
            <section
              class="registry-group"
              aria-labelledby="provider-registry-heading"
            >
              <h3 id="provider-registry-heading">Providers</h3>
              <div id="provider-rows" class="registry-rows"></div>
              <button id="provider-add" type="button">添加 Provider</button>
            </section>
            <section
              class="registry-group"
              aria-labelledby="model-registry-heading"
            >
              <h3 id="model-registry-heading">Models</h3>
              <div id="model-rows" class="registry-rows"></div>
              <button id="model-add" type="button">添加 Model</button>
            </section>
          </div>
          <div class="job-actions">
            <button id="provider-model-save" class="live-primary" type="submit">
              保存 Provider/Model 注册
            </button>
          </div>
        </form>
        <form id="config-form" class="config-card config-form">
          <h2>运行配置</h2>
          <label
            ><input id="config-browser-enabled" type="checkbox" /> 启用 Browser
            操作</label
          >
          <label for="config-browser-model">Browser 模型（需支持图片）</label
          ><select id="config-browser-model"></select>
          <label for="config-browser-profile">Browser Profile</label
          ><input id="config-browser-profile" autocomplete="off" />
          <label for="config-parser-url">MinerU 地址</label
          ><input id="config-parser-url" type="url" autocomplete="off" />
          <label for="config-parser-mode">MinerU 连接模式</label
          ><select id="config-parser-mode">
            <option value="">未配置</option>
            <option value="loopback">本机 loopback</option>
            <option value="remote">远程 HTTPS</option>
          </select>
          <label for="config-parser-model">MinerU 模型</label
          ><input id="config-parser-model" autocomplete="off" />
          <label for="config-analyze-model">分析模型</label
          ><select id="config-analyze-model"></select>
          <div class="job-actions">
            <button id="config-save" class="live-primary" type="submit">
              校验并保存</button
            ><button id="config-probe-parse" type="button">测试 Parse</button
            ><button id="config-probe-browser" type="button">
              测试 Browser 模型
            </button>
          </div>
        </form>
        <form id="config-credential-form" class="config-card config-form">
          <h2>本地凭据</h2>
          <p>凭据独立保存；页面和 readiness 只显示是否存在。</p>
          <label for="config-credential-namespace">凭据类型</label>
          <select id="config-credential-namespace">
            <option value="model">模型 Provider</option>
            <option value="source">文献来源 API key</option>
            <option value="mineru">MinerU bearer token</option>
          </select>
          <label for="config-credential-target">目标名称</label
          ><input id="config-credential-target" autocomplete="off" />
          <label for="config-credential-value">凭据值</label
          ><input
            id="config-credential-value"
            type="password"
            autocomplete="new-password"
          />
          <div class="job-actions">
            <button id="config-credential-save" type="submit">保存凭据</button>
          </div>
        </form>
      </section></template><template id="advanced-template"><div id="maintenance-workspace"><form id="manual-pdf-form">
              <h2>手动接纳 PDF</h2>
              <p>
                选择已存在的具体文献和本机
                PDF。接纳后保留原文件，后续解析和分析需单独启动。
              </p>
              <label for="manual-pdf-literature-id">文献 ID</label>
              <input
                id="manual-pdf-literature-id"
                required
                autocomplete="off"
              />
              <label for="manual-pdf-file">PDF 文件</label>
              <input
                id="manual-pdf-file"
                type="file"
                accept="application/pdf,.pdf"
                required
              />
              <button id="manual-pdf-submit" class="live-primary" type="submit">
                接纳 PDF
              </button>
              <p id="manual-pdf-status" role="status" aria-live="polite"></p>
            </form>
            <form id="document-parse-form" class="config-card config-form">
              <h2>解析已接纳的 PDF</h2>
              <p>
                使用文献库中的 Literature ID、Asset ID 和 PDF SHA-256
                固定输入。复用当前解析结果不会调用
                parser；明确重解析会调用已配置的 parser。Catalog 须先显式迁移至
                v3。
              </p>
              <label for="document-literature-id">Literature ID</label>
              <input id="document-literature-id" required autocomplete="off" />
              <button id="document-load-material" type="button">
                从文献库读取当前 PDF
              </button>
              <p id="document-material-status" role="status" aria-live="polite">
                尚未选择材料。
              </p>
              <label for="document-asset-id">Asset ID</label>
              <input id="document-asset-id" required readonly />
              <label for="document-asset-sha256">PDF SHA-256</label>
              <input
                id="document-asset-sha256"
                required
                readonly
                pattern="[0-9a-f]{64}"
              />
              <label for="document-parse-mode">解析方式</label>
              <select id="document-parse-mode">
                <option value="reparse">
                  调用解析服务（首次解析或重新解析）
                </option>
                <option value="reuse-current">复用已保存的解析结果</option>
              </select>
              <label for="document-default-revision"
                >预期默认版本 revision（首次发布留空）</label
              >
              <input
                id="document-default-revision"
                type="number"
                min="1"
                step="1"
              />
              <button
                id="document-parse-submit"
                class="live-primary"
                type="submit"
              >
                发布可读表示
              </button>
              <p
                id="document-parse-status"
                role="status"
                aria-live="polite"
              ></p>
            </form>
            <section class="config-card config-form" aria-label="单篇知识分析">
              <h2>单篇知识分析</h2>
              <p>
                明确选择已接纳的 PDF
                和当前可读文档版本，再生成有证据的概览、详细分析或问题回答。需要
                Catalog v6
                和已配置的分析模型；长文可选择分段处理，不设累计调用或 token
                预算。历史知识可在只读文献库按 ID 阅读。
              </p>
              <label for="knowledge-literature-id">Literature ID</label>
              <input id="knowledge-literature-id" autocomplete="off" />
              <label for="knowledge-purpose">用途</label>
              <select id="knowledge-purpose">
                <option value="overview">概览</option>
                <option value="detailed">详细分析</option>
                <option value="question">针对问题</option>
              </select>
              <label for="knowledge-mode">处理方式</label>
              <select id="knowledge-mode">
                <option value="single">单次全文（v1）</option>
                <option value="long">长文局部分析与整合（v2）</option>
              </select>
              <label for="knowledge-question">问题（仅“针对问题”填写）</label>
              <textarea
                id="knowledge-question"
                rows="3"
                spellcheck="false"
              ></textarea>
              <label for="knowledge-default-mode">默认视图</label>
              <select id="knowledge-default-mode">
                <option value="publish-only">仅发布历史产物</option>
                <option value="compare-and-set">
                  按 revision 更新默认视图
                </option>
              </select>
              <label for="knowledge-default-revision"
                >预期 revision（首次设为默认时留空）</label
              >
              <input
                id="knowledge-default-revision"
                type="number"
                min="1"
                step="1"
              />
              <p>处理完整输入并记录实际模型用量；可以随时取消当前请求。</p>
              <button id="knowledge-start" class="live-primary" type="button">
                启动单篇分析
              </button>
              <button id="knowledge-cancel" type="button" disabled>
                取消当前请求
              </button>
              <p id="knowledge-status" role="status" aria-live="polite"></p>
              <pre id="knowledge-result"></pre>
            </section>
            <section class="config-card config-form" aria-label="集合知识综合">
              <h2>集合知识综合</h2>
              <p>
                明确填写有序文档或知识来源，再固定版本和缺口。Catalog
                需显式迁移至
                v7。模型对已固定集合进行归纳，结果保留来源和实际覆盖。
              </p>
              <label for="synthesis-inputs">来源选择 JSON（1–128 项）</label>
              <textarea
                id="synthesis-inputs"
                rows="8"
                spellcheck="false"
                placeholder='[{"kind":"document","input_id":"paper-1","literature_id":"...","asset_id":"...","asset_sha256":"...","document_version_id":null},{"kind":"knowledge","input_id":"prior-1","source_artifact_id":"..."}]'
              ></textarea>
              <label for="synthesis-policy">覆盖政策</label>
              <select id="synthesis-policy">
                <option value="require-all">全部来源必须可用</option>
                <option value="allow-partial">允许部分来源并标明缺口</option>
              </select>
              <button id="synthesis-prepare" type="button">
                固定来源与缺口
              </button>
              <label for="synthesis-question">集合问题</label>
              <textarea
                id="synthesis-question"
                rows="3"
                spellcheck="false"
              ></textarea>
              <button
                id="synthesis-start"
                class="live-primary"
                type="button"
                disabled
              >
                启动集合综合
              </button>
              <button id="synthesis-cancel" type="button" disabled>
                取消当前请求
              </button>
              <p id="synthesis-status" role="status" aria-live="polite"></p>
              <pre id="synthesis-result"></pre>
            </section>
            <section
              class="config-card config-form"
              aria-label="材料检索索引维护"
            >
              <h2>材料检索索引</h2>
              <p>
                Catalog 显式迁移至 v4
                后，重建已保存元数据与已发布表示的检索投影。材料变更后需再次明确重建。
              </p>
              <button id="retrieval-rebuild" class="live-primary" type="button">
                重建材料索引
              </button>
              <p
                id="retrieval-rebuild-status"
                role="status"
                aria-live="polite"
              ></p>
              <p>
                Catalog 显式迁移至 v8
                后，可独立重建已发布单篇知识与集合综合的检索索引。
              </p>
              <button
                id="knowledge-retrieval-rebuild"
                class="live-primary"
                type="button"
              >
                重建知识索引
              </button>
              <p
                id="knowledge-retrieval-rebuild-status"
                role="status"
                aria-live="polite"
              ></p>
            </section>
            <section class="config-card config-form" aria-label="提取候选交付">
              <h2>提取候选交付</h2>
              <p>
                Catalog v5 上显式创建
                operation，再提交有证据的候选批次。准备结果可从只读文献库复制；回执只保存检查摘要和证据保护，不托管历史候选载荷。
              </p>
              <label for="extraction-caller">调用方 namespace</label>
              <input
                id="extraction-caller"
                autocomplete="off"
                placeholder="local.research-agent"
              />
              <label for="extraction-prepared">输入准备结果 JSON</label>
              <textarea
                id="extraction-prepared"
                rows="8"
                spellcheck="false"
              ></textarea>
              <button id="extraction-create" type="button">
                创建 operation
              </button>
              <label for="extraction-operation-id">Operation ID</label>
              <input id="extraction-operation-id" autocomplete="off" />
              <label for="extraction-batch">候选批次 JSON</label>
              <textarea
                id="extraction-batch"
                rows="10"
                spellcheck="false"
              ></textarea>
              <button id="extraction-submit" class="live-primary" type="button">
                提交候选批次
              </button>
              <button id="extraction-close" type="button">
                关闭 operation
              </button>
              <button id="extraction-cancel" type="button">
                取消 operation
              </button>
              <label for="extraction-receipt-id">Receipt ID</label>
              <input id="extraction-receipt-id" autocomplete="off" />
              <button id="extraction-receipt" type="button">
                读取回执与保护
              </button>
              <button id="extraction-cleanup" type="button">
                清理最多 100 项过期记录
              </button>
              <p id="extraction-status" role="status" aria-live="polite"></p>
              <pre id="extraction-result"></pre>
            </section>
          <form id="extraction-prepare-form">
              <h2>提取输入准备</h2>
              <p>
                检查调用方规范，绑定已接纳的原 PDF
                与可读文档版本。这里只读取资料；缺少的解析能力会列为缺口。
              </p>
              <label for="extraction-spec"
                >规范 JSON（可省略 spec_sha256，由本页计算）</label
              >
              <textarea
                id="extraction-spec"
                rows="9"
                spellcheck="false"
                required
                placeholder='{"schema_version":1,"spec_id":"my.study","spec_version":"1","record_meaning":"一条记录代表…","output_schema":{"$schema":"https://json-schema.org/draft/2020-12/schema","type":"object"},"field_instructions":[],"inclusion_rules":[],"missing_value_rules":[],"evidence_policy":{"field_granularity":"file","required_pointers":"record-root","cross_input_relation":"optional"},"required_capabilities":["material-file-v1"]}'
              ></textarea>
              <label for="extraction-inputs">显式输入 JSON 数组</label>
              <textarea
                id="extraction-inputs"
                rows="5"
                spellcheck="false"
                required
                placeholder='[{"input_id":"source-1","literature_id":"…","asset_id":"…","asset_sha256":"…","document_version_id":null}]'
              ></textarea>
              <button
                id="extraction-prepare-submit"
                class="live-primary"
                type="submit"
              >
                检查规范并固定输入
              </button>
              <p
                id="extraction-prepare-status"
                role="status"
                aria-live="polite"
              ></p>
              <pre
                id="extraction-prepare-result"
                aria-label="提取输入绑定结果"
              ></pre>
            </form></div></template>
<script type="module" src="/live.js"></script>
</body></html>
