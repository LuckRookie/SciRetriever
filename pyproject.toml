[project]
name = "sciretriever"
version = "0.1.0"
description = "Scientific-literature database for metadata, assets, light-structured text, domain-neutral analysis, and provenance."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.12.0",
    "prompt-toolkit>=3.0.51",
    "pypdf2>=3.0.1",
    "rich>=14.1.0",
    "tomli>=1.1.0; python_version < '3.11'",
    "tomlkit>=0.13.3",
]

[project.scripts]
sciretriever = "sciretriever.entry.cli.main:main"

[dependency-groups]
dev = [
    "build>=1.5.0",
    "playwright>=1.55.0",
    "pyright>=1.1.407",
    "ruff>=0.12.0",
    "setuptools>=42",
    "tomli>=2.0.0",
    "wheel>=0.45.1",
]


[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "strict"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["C90", "E4", "E7", "E9", "F", "I"]
extend-select = ["E501"]

[tool.ruff.format]
docstring-code-format = true
