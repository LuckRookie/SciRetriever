[project]
name = "sciretriever"
version = "0.1.0"
description = "Scientific-literature acquisition, cataloging, normalization, and light-structuring system that stops at a versioned, provenance-bearing DocumentPackage; domain-specific extraction is out of scope."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.116.0",
    "bibtexparser>=1.4.3",
    "bs4>=0.0.2",
    "fake-useragent>=2.2.0",
    "ipykernel>=6.30.1",
    "openai>=2.8.1",
    "playwright>=1.55.0",
    "pydantic>=2.12.0",
    "pypdf2>=3.0.1",
    "requests>=2.32.3",
    "sqlalchemy>=2.0.41",
    "tomli>=1.1.0; python_version < '3.11'",
]

[dependency-groups]
dev = [
    "build>=1.5.0",
    "pyright>=1.1.407",
    "ruff>=0.12.0",
    "setuptools>=42",
    "tomli>=2.0.0",
    "wheel>=0.45.1",
]


[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "strict"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["C90", "E4", "E7", "E9", "F", "I"]
extend-select = ["E501"]

[tool.ruff.format]
docstring-code-format = true
